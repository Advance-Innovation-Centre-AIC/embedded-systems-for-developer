</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="21" style="--paginate:true;--theme:default;" data-marpit-pagination-total="30">
<h1 id="%E0%B9%80%E0%B8%8A%E0%B9%87%E0%B8%84%E0%B8%9C%E0%B9%88%E0%B8%B2%E0%B8%99--%E0%B8%AA%E0%B9%88%E0%B8%87%E0%B8%87%E0%B8%B2%E0%B8%99">เช็คผ่าน + ส่งงาน</h1>
<svg width="660" height="170" xmlns="http://www.w3.org/2000/svg">
  <g font-size="13.5">
  <text x="10" y="22" fill="#1f9d55">ผ่าน: Program to Device แล้วบอร์ดขึ้นเมนู MODE: &lt; NORMAL &gt;</text>
  <text x="10" y="48" fill="#1f9d55">ผ่าน: UP/DOWN เปลี่ยน EASY/NORMAL/HARD ได้, A เริ่มเล่น</text>
  <text x="10" y="74" fill="#1f9d55">ผ่าน: เล่นได้ นกลอดท่อ + แต้มขึ้น + Best ค้างข้ามรอบ</text>
  <text x="10" y="100" fill="#1f9d55">ผ่าน: แก้ MODES 1 ค่า re-program แล้วเห็นความยากเปลี่ยนจริง</text>
  <text x="10" y="126" fill="#1f9d55">ผ่าน: เปลี่ยน fps แล้วเกมยังเร็วเท่าเดิม (delta-time ทำงาน)</text>
  <text x="10" y="152" fill="#1f9d55">ผ่าน: อธิบายได้ว่า dt มาจาก ticks_ms/ticks_diff และทำไมต้อง clamp</text>
  </g>
</svg>
<blockquote>
<p><strong>ส่ง:</strong> โชว์อาจารย์ เลือกโหมด เล่น 1 รอบให้แต้ม ≥ 1 แล้วตายกลับเมนู · ส่ง <code>flappy_step5.py</code> ที่เติมครบ พร้อมจดว่าแก้ค่าโหมดไหน แล้วเกิดอะไรบนจอ</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="22" style="--paginate:true;--theme:default;" data-marpit-pagination-total="30">
<h1 id="%E0%B9%80%E0%B8%8A%E0%B8%B7%E0%B9%88%E0%B8%AD%E0%B8%A1%E0%B9%82%E0%B8%A2%E0%B8%87%E0%B8%A3%E0%B8%B2%E0%B8%81%E0%B8%90%E0%B8%B2%E0%B8%99--delta-time-%E0%B8%AA%E0%B8%AD%E0%B8%99%E0%B8%A7%E0%B8%B4%E0%B8%A8%E0%B8%A7%E0%B8%81%E0%B8%A3%E0%B8%A3%E0%B8%A1%E0%B8%AD%E0%B8%B0%E0%B9%84%E0%B8%A3%E0%B9%80%E0%B8%A3%E0%B8%B2%E0%B8%9A%E0%B9%89%E0%B8%B2%E0%B8%87">เชื่อมโยงรากฐาน · delta-time สอนวิศวกรรมอะไรเราบ้าง</h1>
<p><code>dt</code> ไม่กี่บรรทัดที่เราเขียนวันนี้ จริง ๆ แล้วคือหลักคิดเรื่อง <strong>เวลา</strong> ที่งานฝังตัวใช้ทุกที่:</p>
<div style="display:flex;gap:16px;font-size:.92em">
<div style="flex:1">
<p><strong>ฝั่ง Embedded / MCU</strong></p>
<ul>
<li><code>time.ticks_ms()</code> อ่านจาก <strong>hardware timer</strong> ในชิป — ตัวเดียวกับที่ใช้ทำ PWM, นับ timeout, ตั้ง periodic interrupt</li>
<li>ระบบเรียลไทม์ (RTOS) ทุกตัวมี <strong>tick</strong> เป็นหัวใจ การวัด <code>dt</code> คือการอ่าน tick มาคิดเวลา</li>
<li>ฟิสิกส์อิงเวลาจริง = เครื่องช้า-เร็วต่างกัน ผลลัพธ์ยังเท่าเดิม นี่คือนิยามของ <strong>deterministic timing</strong></li>
</ul>
</div>
<div style="flex:1">
<p><strong>ฝั่ง Python / Algorithm / Graphics</strong></p>
<ul>
<li>เก็บ <code>last_clock</code> ใน list แล้วให้ closure แก้ค่า คือ pattern <strong>mutable state in closure</strong> ของ Python</li>
<li><code>v += g·dt</code>, <code>y += v·dt</code> คือ <strong>numerical integration (Euler)</strong> — คณิตเดียวกับ physics engine จริง</li>
<li><code>clamp dt ≤ 0.05</code> คือการ <strong>กันค่าผิดปกติ (input clamping)</strong> ก่อนป้อนเข้าสมการ</li>
<li>เฟรมต่อเนื่องที่ลื่นตา = หลัก <strong>frame transition</strong> ของกราฟิกเกม</li>
</ul>
</div>
</div>
<div style="text-align:center">
<iframe width="480" height="270" src="https://www.youtube.com/embed/rWtfClpWSb8" title="Understanding framerate independence and deltatime" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe>
</div>
<p><em>Understanding framerate independence and deltatime — Clear Code</em> · อธิบายว่าทำไมต้องคูณ <code>dt</code> แล้วเกมจะลื่นเท่ากันทุกเครื่อง แนวคิดตรงกับที่เราทำวันนี้ (สอนด้วย Python)</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="23" style="--paginate:true;--theme:default;" data-marpit-pagination-total="30">
<h1 id="%E0%B8%AA%E0%B8%A3%E0%B8%B8%E0%B8%9B--%E0%B8%87%E0%B8%B2%E0%B8%99%E0%B8%97%E0%B8%B3%E0%B9%80%E0%B8%AD%E0%B8%87-30">สรุป + งานทำเอง 30%</h1>
<p><strong>คาบนี้เราได้:</strong></p>
<ul>
<li><strong>delta-time</strong> — <code>dt = ticks_diff/1000</code>, <code>v += g*dt</code>, <code>y += v*dt</code> (clamp <code>dt ≤ 0.05</code>)</li>
<li><strong>ตารางโหมด</strong> — <code>MODES[i]</code> สลับความยากด้วย index เดียว</li>
<li><strong>best score</strong> — ตัวแปร module + <code>global</code> ค้างข้ามรอบ → <strong>MVP-2 Flappy เต็ม</strong></li>
</ul>
<p><strong>งานทำเอง 30% (ในไฟล์ <a class="pc-gh-link" href="https://github.com/Advance-Innovation-Centre-AIC/embedded-systems-for-developer/blob/main/developer-ii/practise_codes/flappy_step5.py" target="_blank" rel="noopener" title="เปิดไฟล์บน GitHub (แท็บใหม่)" style="text-decoration:none"><code>practise_codes/flappy_step5.py</code><sup style="color:#22d3ee;font-weight:800">&#8599;</sup></a>):</strong></p>
<ol>
<li>เติมการวัด <code>dt</code> และฟิสิกส์ <code>* dt</code> ใน <code>on_each_frame()</code></li>
<li>เติมลูป <code>choose_mode()</code> ให้รับ UP/DOWN + A จริง</li>
<li>อัปเดต <code>best_score</code> + <code>hud_label.set(...)</code> ตอนทำแต้ม</li>
</ol>
<p><span is="marp-span" data-auto-scaling="downscale-only" class="katex-display"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mtext>fps เปลี่ยน</mtext><mtext>  </mtext><mo>⇒</mo><mtext>  </mtext><mi mathvariant="normal">Δ</mi><mi>t</mi><mtext> ปรับเอง</mtext><mtext>  </mtext><mo>⇒</mo><mtext>  </mtext><mi>v</mi><mo>⋅</mo><mi mathvariant="normal">Δ</mi><mi>t</mi><mtext> คงที่</mtext></mrow><annotation encoding="application/x-tex">\text{fps เปลี่ยน} \;\Rightarrow\; \Delta t \text{ ปรับเอง} \;\Rightarrow\; v\cdot\Delta t \text{ คงที่} 
</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8889em;vertical-align:-0.1944em;"></span><span class="mord text"><span class="mord">fps </span><span class="mord brahmic_fallback">เปลี่ยน</span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">⇒</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord">Δ</span><span class="mord mathnormal">t</span><span class="mord text"><span class="mord"> </span><span class="mord brahmic_fallback">ปรับเอง</span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">⇒</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.4445em;"></span><span class="mord mathnormal" style="margin-right:0.0359em;">v</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">⋅</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord">Δ</span><span class="mord mathnormal">t</span><span class="mord text"><span class="mord"> </span><span class="mord brahmic_fallback">คงที่</span></span></span></span></span></span></p><blockquote>
<p>คาบหน้า: เราจะเริ่ม <strong>Snake</strong> เกมที่สองของคอร์ส — กริด, ทิศทาง, และการต่อหาง</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="24" style="--paginate:true;--theme:default;" data-marpit-pagination-total="30">
<h1 id="%E0%B9%80%E0%B8%89%E0%B8%A5%E0%B8%A2-flappy_step5py--%E0%B8%AD%E0%B9%88%E0%B8%B2%E0%B8%99%E0%B9%83%E0%B8%AB%E0%B9%89%E0%B9%80%E0%B8%82%E0%B9%89%E0%B8%B2%E0%B9%83%E0%B8%88-%E0%B8%9B%E0%B8%B4%E0%B8%94%E0%B9%84%E0%B8%9F%E0%B8%A5%E0%B9%8C-%E0%B9%81%E0%B8%A5%E0%B9%89%E0%B8%A7%E0%B8%9E%E0%B8%B4%E0%B8%A1%E0%B8%9E%E0%B9%8C%E0%B9%80%E0%B8%AD%E0%B8%87">เฉลย <code>flappy_step5.py</code> — อ่านให้เข้าใจ ปิดไฟล์ แล้วพิมพ์เอง</h1>
<p>เฉลยนี้มีไว้ให้ <strong>เทียบ</strong> ไม่ได้มีไว้ให้ลอกวางส่ง คะแนนของคาบนี้อยู่ที่ใบงานกับการที่น้องอธิบายได้ด้วยคำพูดตัวเอง วิธีใช้ให้ได้ผลจริงคือ อ่านเฉลยให้เข้าใจ ปิดไฟล์ แล้วกลับไปพิมพ์ใหม่ด้วยมือตัวเอง ตอนพิมพ์เองนั่นแหละที่สมองจำ pattern ได้ ต่อจากนี้เราจะแกะเฉลยทีละก้อน ไม่ดูรวดเดียว เพราะทุกบรรทัดมีเหตุผลของมัน และเหตุผลนั้นแหละที่จะติดตัวไปใช้เกมต่อ ๆ ไป</p>
<p><strong>ก้อนแรก — ตารางความยาก แยก &quot;ค่า&quot; ออกจาก &quot;โค้ด&quot;:</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-comment"># ตารางโหมด: (ชื่อ, gap, speed px/s, grav px/s^2, flap px/s)  — มิเรอร์ s_flap_modes[]</span>
<span class="hljs-comment"># page_game_flappy.c:59-63 (ค่าปรับให้เข้ากับสเกล Python ของ step1-4)</span>
MODES = [
    (<span class="hljs-string">&quot;EASY&quot;</span>,   <span class="hljs-number">175</span>, <span class="hljs-number">200.0</span>,  <span class="hljs-number">900.0</span>, -<span class="hljs-number">360.0</span>),
    (<span class="hljs-string">&quot;NORMAL&quot;</span>, <span class="hljs-number">152</span>, <span class="hljs-number">240.0</span>, <span class="hljs-number">1100.0</span>, -<span class="hljs-number">390.0</span>),
    (<span class="hljs-string">&quot;HARD&quot;</span>,   <span class="hljs-number">120</span>, <span class="hljs-number">300.0</span>, <span class="hljs-number">1300.0</span>, -<span class="hljs-number">410.0</span>),
]
</code></pre>
<ul>
<li>ทำไมเก็บความยากเป็น <strong>list ของ tuple</strong> แทนที่จะเขียน <code>if mode == &quot;HARD&quot;: gap = 120 ...</code> เป็นชั้น ๆ? เพราะพอค่าทั้งชุดอยู่ในตารางเดียว การเปลี่ยนทั้งเกมก็เหลือแค่สลับ index ตัวเดียว (<code>:31-35</code>) นี่คือแนวคิด <strong>ตารางโหมด</strong> ที่เราคุยกันในสไลด์ &quot;ตารางโหมด (mode table): หัวใจของเกมในตู้&quot; — ข้อมูลเป็นตัวขับ ไม่ใช่โค้ด</li>
<li>ลำดับใน tuple มีความหมายตายตัว: <code>(ชื่อ, gap, speed, grav, flap)</code> ทุกแถวเรียงเหมือนกันเป๊ะ ถ้าสลับตำแหน่งแถวใดแถวหนึ่ง ค่าจะเข้าช่องผิดทันที นิสัยนี้คือ &quot;โครงข้อมูลต้องสม่ำเสมอ&quot;</li>
<li>หน่วยเปลี่ยนไปแล้วนะ: <code>grav</code> เป็น <code>900.0</code> (ต่อวินาที) ไม่ใช่ <code>0.45</code> (ต่อเฟรม) แบบคาบก่อน เพราะคาบนี้เราคูณ <code>dt</code> ตัวเลขจึงดูใหญ่ขึ้น แต่ความหมายเดียวกัน — โยงกับสไลด์ &quot;delta-time คืออะไร&quot;</li>
<li>ค่าพวกนี้ไม่ได้สุ่มมา มันมิเรอร์ <code>s_flap_modes[]</code> ฝั่ง C จริง (<code>page_game_flappy.c:59-63</code>) เราจงใจให้ Python step ตรงกับที่คอนโซลจริงทำ</li>
</ul>
<blockquote>
<p>ถ้าวันหลังอยากเพิ่มโหมด <code>INSANE</code> น้องไม่ต้องแตะลูปเกมเลย เติมอีกแถวในตารางก็จบ นั่นคือพลังของการแยกค่าออกจากโครง</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="25" style="--paginate:true;--theme:default;" data-marpit-pagination-total="30">
<h1 id="%E0%B9%80%E0%B8%89%E0%B8%A5%E0%B8%A2--%E0%B8%81%E0%B9%89%E0%B8%AD%E0%B8%99%E0%B8%97%E0%B8%B5%E0%B9%88%E0%B8%AA%E0%B8%AD%E0%B8%87--play_round-%E0%B8%95%E0%B8%B1%E0%B9%89%E0%B8%87%E0%B9%80%E0%B8%A7%E0%B8%97%E0%B8%B5%E0%B8%81%E0%B9%88%E0%B8%AD%E0%B8%99%E0%B9%80%E0%B8%9B%E0%B8%B4%E0%B8%94%E0%B8%89%E0%B8%B2%E0%B8%81">เฉลย · ก้อนที่สอง — <code>play_round()</code> ตั้งเวทีก่อนเปิดฉาก</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">def</span> <span class="hljs-title function_">play_round</span>(<span class="hljs-params">mode_index</span>):
    <span class="hljs-string">&quot;&quot;&quot;เล่นหนึ่งรอบด้วยโหมดที่เลือก. คืน score เมื่อจบ.&quot;&quot;&quot;</span>
    <span class="hljs-keyword">global</span> best_score
    mode_name, gap, speed, gravity, flap = MODES[mode_index]

    game.clear()                                  <span class="hljs-comment"># ล้างจอเมนูก่อนเริ่มรอบ (กันทะลุเพดาน 32 sprite)</span>
    bird = game.Box(<span class="hljs-number">150</span>, <span class="hljs-number">180</span>, <span class="hljs-number">34</span>, <span class="hljs-number">34</span>, game.GB_LIGHTEST)
    bird_y, bird_velocity, score = <span class="hljs-number">198.0</span>, <span class="hljs-number">0.0</span>, <span class="hljs-number">0</span>
    hud_label = game.Text(<span class="hljs-string">&quot;0  Best: %d  [%s]&quot;</span> % (best_score, mode_name), <span class="hljs-number">300</span>, <span class="hljs-number">16</span>, game.WHITE)
</code></pre>
<ul>
<li>บรรทัด <code>mode_name, gap, speed, gravity, flap = MODES[mode_index]</code> (<code>:43</code>) คือ <strong>tuple unpacking</strong> แกะค่าทั้งแถวออกมาเป็นตัวแปรทีเดียว ถ้าไม่ทำแบบนี้เราต้องเขียน <code>MODES[mode_index][2]</code> กระจายทั่วโค้ด อ่านยากและพิมพ์ผิดง่าย โยงกับสไลด์ &quot;ตารางโหมด&quot; ที่โชว์บรรทัดนี้ไว้แล้ว</li>
<li><code>game.clear()</code> (<code>:45</code>) วางไว้ <strong>ต้นทุกรอบ</strong> ด้วยเหตุผลจริงจัง: กล่อง <code>Box</code>/<code>Text</code> ของรอบก่อนกับหน้าเมนูยังค้างบนจอ ถ้าไม่ล้าง sprite จะสะสมจนชนเพดาน 32 ตัว — นี่คือกับดักที่เราเตือนในสไลด์ &quot;กับดักที่เจอบ่อย&quot;</li>
<li><code>bird_y</code> เริ่มที่ <code>198.0</code> เป็น <strong>float</strong> ตั้งแต่ต้น ไม่ใช่ <code>198</code> เพราะทันทีที่เราคูณ <code>dt</code> (ทศนิยม) ค่าจะกลายเป็นทศนิยมอยู่ดี ตั้งเป็น float ไว้แต่แรกจึงชัดเจนกว่า</li>
<li><code>hud_label</code> เก็บลงตัวแปรเพราะเราจะเรียก <code>hud_label.set(...)</code> อัปเดตแต้มทุกครั้งที่ทำคะแนน ส่วน <code>game.title(&quot;FLAPPY&quot;)</code> (<code>:37</code>) ที่อยู่นอกฟังก์ชันไม่ต้องเก็บ เพราะไม่ต้องแก้ทีหลัง — หลักเดิม &quot;ใช้ครั้งเดียวไม่ต้องตั้งชื่อ ต้องแก้ซ้ำจึงเก็บ&quot;</li>
</ul>
<blockquote>
<p>ตัวแปรทุกตัวที่สร้างตรงนี้อยู่ใน <strong>ขอบเขตนอก</strong> ของ closure สร้างครั้งเดียวต่อรอบ แล้ว <code>on_each_frame</code> ข้างในจะหยิบไปใช้ได้ตลอด — จำผัง &quot;ประกอบร่าง play_round()&quot; ไว้นะ ก้อนถัดไปจะใช้ท่านี้</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="26" style="--paginate:true;--theme:default;" data-marpit-pagination-total="30">
<h1 id="%E0%B9%80%E0%B8%89%E0%B8%A5%E0%B8%A2--%E0%B8%81%E0%B9%89%E0%B8%AD%E0%B8%99%E0%B8%97%E0%B8%B5%E0%B9%88%E0%B8%AA%E0%B8%B2%E0%B8%A1--%E0%B8%AB%E0%B8%B1%E0%B8%A7%E0%B9%83%E0%B8%88-delta-time-%E0%B8%A7%E0%B8%B1%E0%B8%94%E0%B9%80%E0%B8%A7%E0%B8%A5%E0%B8%B2%E0%B8%88%E0%B8%A3%E0%B8%B4%E0%B8%87%E0%B8%97%E0%B8%B8%E0%B8%81%E0%B9%80%E0%B8%9F%E0%B8%A3%E0%B8%A1">เฉลย · ก้อนที่สาม — หัวใจ delta-time วัดเวลาจริงทุกเฟรม</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">    <span class="hljs-keyword">def</span> <span class="hljs-title function_">on_each_frame</span>():
        <span class="hljs-keyword">global</span> best_score                        <span class="hljs-comment"># อัปเดต best (ตัวแปรระดับ module) ในนี้ด้วย</span>
        <span class="hljs-comment"># ----- เติมส่วนนี้เอง: ฟิสิกส์แบบ delta-time -----</span>
        now = time.ticks_ms()
        dt = time.ticks_diff(now, last_clock[<span class="hljs-number">0</span>]) / <span class="hljs-number">1000.0</span>   <span class="hljs-comment"># เวลาจริงที่ผ่านไป (วินาที)</span>
        last_clock[<span class="hljs-number">0</span>] = now
        <span class="hljs-keyword">if</span> dt &gt; <span class="hljs-number">0.05</span>: dt = <span class="hljs-number">0.05</span>                   <span class="hljs-comment"># กันเฟรมค้างยาวทะลุท่อ</span>
</code></pre>
<ul>
<li>สามบรรทัด <code>:66-68</code> คือหัวใจของทั้งคาบ: อ่านนาฬิกาบอร์ด (<code>now</code>) หาส่วนต่างจากเฟรมก่อน แปลงเป็นวินาที แล้ว <strong>จำเวลาไว้ใช้เฟรมหน้า</strong> (<code>last_clock[0] = now</code>) โยงกับสไลด์ &quot;วัดเวลาจริงด้วย ticks_ms + ticks_diff&quot; ตรง ๆ</li>
<li>ทำไมต้อง <code>time.ticks_diff(now, last_clock[0])</code> แทนการลบ <code>now - last_clock[0]</code> ตรง ๆ? เพราะตัวนับ ticks วนรอบ (overflow) ได้ <code>ticks_diff</code> จัดการกรณีนั้นให้ปลอดภัย ลบเองมีวันติดลบแปลก ๆ ตอนตัวนับพลิก</li>
<li>ทำไม <code>last_clock</code> ต้องเป็น <strong>list</strong> ไม่ใช่ตัวแปรเฉย ๆ? เพราะ closure แก้ค่า int นอกขอบเขตตรง ๆ ไม่ได้ (ต้อง <code>global</code>/<code>nonlocal</code>) แต่ list เป็น object เดียวกัน <code>last_clock[0] = now</code> จึงแก้ข้ามเฟรมได้ — นี่คือ <strong>mutable state in closure</strong> ที่เราวาดไว้ในผัง &quot;ประกอบร่าง play_round()&quot; (สร้างที่ <code>:60,100</code> อ่าน/เขียนที่ <code>:67-68</code>)</li>
<li><code>if dt &gt; 0.05: dt = 0.05</code> (<code>:69</code>) คือ <strong>clamp</strong>: ถ้าเฟรมค้างยาว (เช่นบอร์ดสะดุด 200ms) <code>dt</code> จะพุ่ง นกจะกระโดดทะลุท่อในเฟรมเดียว เราจึงตัดเพดานไว้ที่ 0.05 วินาที เป็นการกันค่าผิดปกติก่อนป้อนเข้าสมการ</li>
</ul>
<blockquote>
<p><code>dt</code> แค่สามบรรทัดนี้คือกาวเชื่อม &quot;เวลาจริงของบอร์ด&quot; เข้ากับ &quot;ฟิสิกส์ของเกม&quot; — เฟรมจะถี่หรือกระตุกแค่ไหน นกก็ตกด้วยความเร็วเท่าเดิมเสมอ</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="27" style="--paginate:true;--theme:default;" data-marpit-pagination-total="30">
<h1 id="%E0%B9%80%E0%B8%89%E0%B8%A5%E0%B8%A2--%E0%B8%81%E0%B9%89%E0%B8%AD%E0%B8%99%E0%B8%97%E0%B8%B5%E0%B9%88%E0%B8%AA%E0%B8%B5%E0%B9%88--%E0%B8%A0%E0%B8%B2%E0%B8%9E%E0%B8%A3%E0%B8%A7%E0%B8%A1%E0%B8%81%E0%B8%B2%E0%B8%A3%E0%B9%84%E0%B8%95%E0%B9%88%E0%B8%A3%E0%B8%B0%E0%B8%94%E0%B8%B1%E0%B8%9A-step4-%E2%86%92-step5">เฉลย · ก้อนที่สี่ + ภาพรวมการไต่ระดับ step4 → step5</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">            <span class="hljs-keyword">if</span> game.hit(bird, pipe[<span class="hljs-string">&quot;top&quot;</span>]) <span class="hljs-keyword">or</span> game.hit(bird, pipe[<span class="hljs-string">&quot;bot&quot;</span>]):
                game.sfx(<span class="hljs-string">&quot;fall&quot;</span>); <span class="hljs-keyword">return</span> <span class="hljs-literal">False</span>
            <span class="hljs-keyword">if</span> <span class="hljs-keyword">not</span> pipe[<span class="hljs-string">&quot;scored&quot;</span>] <span class="hljs-keyword">and</span> pipe[<span class="hljs-string">&quot;x&quot;</span>] + PIPE_WIDTH &lt; bird.x:
                pipe[<span class="hljs-string">&quot;scored&quot;</span>] = <span class="hljs-literal">True</span>
                bird_state[<span class="hljs-string">&quot;score&quot;</span>] += <span class="hljs-number">1</span>
                game.sfx(<span class="hljs-string">&quot;point&quot;</span>)
                <span class="hljs-keyword">if</span> bird_state[<span class="hljs-string">&quot;score&quot;</span>] &gt; best_score: best_score = bird_state[<span class="hljs-string">&quot;score&quot;</span>]
                hud_label.<span class="hljs-built_in">set</span>(<span class="hljs-string">&quot;%d  Best: %d  [%s]&quot;</span> % (bird_state[<span class="hljs-string">&quot;score&quot;</span>], best_score, mode_name))
</code></pre>
<ul>
<li>ธง <code>pipe[&quot;scored&quot;]</code> (<code>:93</code>) กันนับแต้มซ้ำท่อเดิม — ของเดิมจากคาบที่แล้ว (step4) ที่เรายกมาทั้งดุ้น ส่วนบรรทัด <code>if bird_state[&quot;score&quot;] &gt; best_score</code> (<code>:97</code>) คือ <strong>ของใหม่คาบนี้</strong>: อัปเดตสถิติเฉพาะตอนทำลายสถิติ</li>
<li><code>best_score</code> ประกาศไว้ระดับ module (<code>:38</code>) จึง <strong>ค้างข้ามรอบเล่น</strong> เราแตะมันใน frame ได้เพราะมี <code>global best_score</code> (<code>:64</code>) โยงกับสไลด์ &quot;best score: จำคะแนนดีที่สุดข้ามรอบ&quot;</li>
</ul>
<table>
<thead>
<tr>
<th>ชิ้นส่วน</th>
<th>step4 (คาบก่อน)</th>
<th>step5 (คาบนี้)</th>
<th>แนวคิดที่ยกระดับ</th>
</tr>
</thead>
<tbody>
<tr>
<td>ฟิสิกส์</td>
<td><code>bird_velocity += GRAVITY</code> ต่อเฟรม (<code>step4:52</code>)</td>
<td><code>bird_state[&quot;velocity&quot;] += gravity*dt</code> ต่อวินาที (<code>:73-74</code>)</td>
<td>delta-time / Euler</td>
</tr>
<tr>
<td>ความยาก</td>
<td>ค่าคงที่ <code>GAP/SPEED/GRAVITY</code> (<code>step4:20-25</code>)</td>
<td>ตาราง <code>MODES[i]</code> (<code>:31-35,43</code>)</td>
<td>ข้อมูลเป็นตัวขับ</td>
</tr>
<tr>
<td>สถานะข้ามเฟรม</td>
<td>global <code>bird_y</code> (<code>step4:48</code>)</td>
<td>dict <code>bird_state</code> + list <code>last_clock</code> (<code>:61,100</code>)</td>
<td>mutable state in closure</td>
</tr>
<tr>
<td>คะแนน</td>
<td><code>score</code> รอบเดียว (<code>step4:32</code>)</td>
<td><code>best_score</code> ระดับ module (<code>:38,97</code>)</td>
<td>state ค้างข้ามรอบ</td>
</tr>
<tr>
<td>โครงรัน</td>
<td><code>game.run</code> เดียว (<code>step4:81</code>)</td>
<td>console loop ห่อ <code>play_round</code> (<code>:124-127</code>)</td>
<td>ลูปซ้อนลูป</td>
</tr>
</tbody>
</table>
<blockquote>
<p>อ่านตารางจากบนลงล่างจะเห็นเส้นเรื่องของคาบนี้: เราไม่ได้เขียนเกมใหม่ เราหยิบ step4 ที่เล่นจบได้ มายกระดับทีละชิ้นให้มัน &quot;เท่ากันทุกบอร์ด เลือกยากได้ จำสถิติได้&quot; — นี่คือวิธีที่ software จริงโตขึ้น</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="28" style="--paginate:true;--theme:default;" data-marpit-pagination-total="30">
<h1 id="%E0%B9%80%E0%B8%8A%E0%B8%B7%E0%B9%88%E0%B8%AD%E0%B8%A1%E0%B8%88%E0%B8%B8%E0%B8%94--dt-%E0%B8%95%E0%B8%B1%E0%B8%A7%E0%B8%99%E0%B8%B5%E0%B9%89%E0%B8%A1%E0%B8%B2%E0%B8%88%E0%B8%B2%E0%B8%81%E0%B9%84%E0%B8%AB%E0%B8%99-%E0%B9%81%E0%B8%A5%E0%B9%89%E0%B8%A7%E0%B8%88%E0%B8%B0%E0%B8%9E%E0%B8%B2%E0%B9%80%E0%B8%A3%E0%B8%B2%E0%B9%84%E0%B8%9B%E0%B8%96%E0%B8%B6%E0%B8%87%E0%B9%84%E0%B8%AB%E0%B8%99">เชื่อมจุด — <code>dt</code> ตัวนี้มาจากไหน แล้วจะพาเราไปถึงไหน</h1>
<p>อยากให้หยุดคิดสักครู่ก่อนปิดคาบ ไม่ใช่เรื่องไวยากรณ์ แต่เรื่อง &quot;มองให้ทะลุ&quot; ว่า <code>dt</code> สามบรรทัดที่เราเพิ่งเขียน จริง ๆ แล้วเป็นชิ้นส่วนของอะไร</p>
<p><strong>ที่มา — <code>dt</code> ยืนอยู่บนอะไร</strong> ย้อนไปสไลด์ &quot;เรื่องจริงจากเครื่องเกม: ปัญหาเร็ว-ช้าตามเครื่อง&quot; เกม NES บน PAL ช้ากว่า NTSC ราว 17% เพราะโค้ดนับเป็น &quot;เฟรม&quot; ไม่ใช่ &quot;วินาที&quot; นั่นคือปัญหาเดียวกับที่ step4 ของเรามี (<code>bird_velocity += GRAVITY</code> ต่อเฟรม) วันนี้เราแก้มันด้วยสมการเดียวจากสไลด์ &quot;delta-time คืออะไร&quot;: คูณ <code>dt</code> เข้าไป อัตราส่วนเร็ว-ช้าตามเครื่องก็หายวับ นี่ไม่ใช่ลูกเล่นของเกม มันคือหลักคิดเรื่อง <strong>เวลา</strong> ที่งานฝังตัวใช้ทุกที่</p>
<p><strong>ที่ไป — <code>dt</code> ตัวนี้จะโตเป็นอะไร</strong> จำผัง &quot;ผังทั้งโปรแกรม: ลูปซ้อนลูป&quot; ได้ไหม ลูปในหมุน 60 ครั้ง/วินาที ลูปนอกหมุนรอบละหลายวินาที <code>dt</code> คือกาวเชื่อมสองสเกลเวลานี้ พอน้องคุมเวลาได้ คาบหน้า Snake ที่ต้อง &quot;ขยับทีละช่องตามจังหวะ&quot; ก็คือการใช้ <code>dt</code>/timer ตัวเดียวกันนี้คุมจังหวะเดิน และตารางความยาก <code>MODES</code> วันนี้ก็จะกลายเป็น &quot;Snake ยิ่งกินยิ่งเร็ว&quot; ในคาบถัด ๆ ไป</p>
<p>ลองตอบสามคำถามนี้ในใจ นี่แหละคือการเชื่อมจุดด้วยตัวเอง:</p>
<ul>
<li>จำ <code>time.sleep_ms(180)</code> ที่หน่วงปุ่มในเมนูเลือกโหมดได้ไหม ถ้าวันหน้าเราอยากให้ Snake ขยับทุก ๆ 150ms โดยไม่บล็อกการรับปุ่ม เราจะใช้ <code>ticks_diff</code> แทน <code>sleep</code> ได้ไหม (ใบ้: เก็บ <code>last_move</code> แล้วเช็คว่าเวลาผ่านไปครบหรือยัง)</li>
<li>ถ้าวันนี้เราทำให้นกตกเท่ากันทุก fps ได้ พรุ่งนี้เราจะทำให้ <strong>ทั้งเกม</strong> เดินเท่ากันทุกบอร์ดด้วยหลักเดียวกันได้ไหม</li>
<li>สังเกตไหมว่า clamp <code>dt ≤ 0.05</code> มันคือเรื่องเดียวกับการ &quot;กันค่า sensor ที่พุ่งผิดปกติ&quot; ก่อนเอาไปคำนวณต่อ</li>
</ul>

<p>ถ้าตอบได้ว่า &quot;อ๋อ dt กับ RTOS tick กับ การกันค่า sensor มันเรื่องเดียวกัน&quot; — นั่นคือการหยั่งรู้ที่อาจารย์อยากให้เกิด สามบรรทัดวันนี้ไม่ได้เล็ก มันคือวิธีที่วิศวกรจับ &quot;เวลา&quot; มาใช้</p>
</blockquote>

<h1 id="%E0%B9%83%E0%B8%8A%E0%B9%89%E0%B8%88%E0%B8%A3%E0%B8%B4%E0%B8%87%E0%B8%97%E0%B8%B5%E0%B9%88%E0%B9%84%E0%B8%AB%E0%B8%99--delta-time--ticks--numerical-integration">ใช้จริงที่ไหน — delta-time · ticks · numerical integration</h1>
<p>เทคนิควันนี้ไม่ใช่แค่แบบฝึกหัด มันคือสิ่งที่ระบบจริงใช้กันทุกวัน:</p>

  <circle cx="330" cy="50" r="4" fill="#1565c0" />

  <text x="656" y="226" font-size="11" fill="#777" text-anchor="middle">x += v·dt ทีละก้าว — Euler integration</text>

<ul>
<li><strong>เอนจินเกมทุกตัว</strong> — Unity มี <code>Time.deltaTime</code>, Unreal มี <code>DeltaSeconds</code>, Godot มี <code>delta</code> ใน <code>_process()</code> ล้วนคือ <code>dt</code> ตัวเดียวกับเรา คูณกับการเคลื่อนที่ให้เกมลื่นเท่ากันทุกเครื่อง ต่างแค่เขาอ่านเวลาจาก GPU frame timer เราอ่านจาก <code>time.ticks_ms()</code></li>
<li><strong>RTOS scheduler / งานเป็นคาบ</strong> — <code>ticks_ms()</code> คือการอ่าน <strong>system tick</strong> ตัวเดียวกับที่ FreeRTOS ใช้จัดคิวงาน นับ timeout ตั้ง periodic task การวัด <code>dt = ticks_diff(...)</code> คือหัวใจของการทำงานตามเวลาจริง</li>
<li><strong>ลูปควบคุม PID (มอเตอร์ / อุณหภูมิ / โดรน)</strong> — พจน์ integral และ derivative ต้องคูณ/หารด้วย <code>dt</code> จริง ถ้า <code>dt</code> เพี้ยน ตัวคุมจะแกว่ง หลักเดียวกับที่เราคูณ <code>gravity * dt</code> — คือ <strong>numerical integration (Euler)</strong> ตัวจริง</li>
<li><strong>จำลองฟิสิกส์ / หุ่นยนต์ / รถอัตโนมัติ</strong> — <code>v += a*dt</code>, <code>x += v*dt</code> คือก้าวเดินของ physics engine ทุกตัว ค่า grav (px/s²) ในตาราง <code>MODES</code> ก็คือหน่วยความเร่งจริงแบบเดียวกับที่วิศวกรใส่ในโมเดล</li>
</ul>
<blockquote>
<p>เห็นไหมว่าสี่ข้อนี้ไม่มีข้อไหนเป็นของสมมติ ตั้งแต่เกม AAA ยันตัวคุมมอเตอร์ในโรงงาน ล้วนคูณ <code>dt</code> ด้วยเหตุผลเดียวกับที่เราทำวันนี้</p>
</blockquote>
</section>

<h1 id="%E0%B8%95%E0%B9%88%E0%B8%AD%E0%B8%A2%E0%B8%AD%E0%B8%94--%E0%B8%84%E0%B8%B4%E0%B8%94%E0%B8%95%E0%B9%88%E0%B8%AD%E0%B9%80%E0%B8%AD%E0%B8%87">ต่อยอด — คิดต่อเอง</h1>
<p>ลองเอาโจทย์พวกนี้ไปคิดต่อ ไม่มีคำตอบเดียวตายตัว ทุกข้อโยงกลับไปหาโปรเจกต์จริงได้:</p>
<div style="text-align:center">
<svg width="840" height="228" viewBox="0 0 840 228" font-family="DejaVu Sans, sans-serif">
  <defs>
    <marker id="arDn2" markerWidth="9" markerHeight="9" refX="4" refY="7" orient="auto"><path d="M0,0 L8,0 L4,7 Z" fill="#607d8b" /></marker>
  </defs>

  <text x="408" y="57" font-size="12" fill="#455a64" text-anchor="middle">time.sleep_ms(180) — เกมหยุดนิ่ง</text>
  <rect x="626" y="36" width="70" height="34" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" />

  <text x="436" y="119" font-size="11" fill="#777">เปลี่ยนวิธีคิด</text>
  
  <text x="14" y="150" font-size="13" font-weight="700" fill="#2e7d32">แบบจำเวลา — ticks_diff (ไม่บล็อก)</text>

  <text x="132" y="183" font-size="12" fill="#2e7d32">ทุกวนรอบ: อ่านปุ่ม + วาดจอ — ไม่หยุดเลย</text>

  <rect x="660" y="162" width="8" height="34" fill="#2e7d32" />

  <text x="428" y="216" font-size="11" fill="#2e7d32" text-anchor="middle">ปุ่มกดตอนไหนก็รับได้ — Snake เดินตามจังหวะ</text>
</svg>
</div>
<ul>
<li><strong>หน่วงเวลาแบบไม่บล็อกเกม</strong> — เมนูใช้ <code>time.sleep_ms(180)</code> กันปุ่มเด้ง ซึ่งหยุดทุกอย่างระหว่างหน่วง ถ้าต้องรับปุ่มพร้อมอัปเดตจอ จะเปลี่ยนมาใช้ <code>ticks_diff</code> จำ &quot;เวลากดล่าสุด&quot; แทนยังไงให้ลื่นโดยไม่ค้าง</li>
<li><strong>ปรับความยากอัตโนมัติ (dynamic difficulty)</strong> — แทนที่ผู้เล่นเลือก EASY/NORMAL/HARD เอง ถ้าอยากให้เกม <strong>ค่อย ๆ เร่ง</strong> เมื่อแต้มสูงขึ้น จะไล่ระดับจากตาราง <code>MODES</code> หรือคำนวณ <code>speed</code> จาก <code>score</code> ตรง ๆ ดี ข้อดีข้อเสียต่างกันยังไง</li>
<li><strong>best score ที่ไม่หายตอนปิดเครื่อง</strong> — <code>best_score</code> หายเมื่อรีบูต ถ้าอยากให้สถิติค้างข้ามการปิดเปิดบอร์ด จะเก็บลงไฟล์ (persistent storage) ตอนไหน อ่านกลับตอนไหน แล้วกันไฟล์เสียตอนดับไฟกลางคันยังไง</li>
<li><strong>เตรียมสู่ Snake (คาบหน้า)</strong> — Snake ขยับ &quot;ทีละช่องกริด&quot; ตามจังหวะ ไม่ลื่นต่อเนื่องแบบนก ลองออกแบบล่วงหน้า: จะใช้ <code>dt</code>/<code>ticks_diff</code> คุม &quot;ทุกกี่มิลลิวินาทีขยับหนึ่งช่อง&quot; ยังไง และจะทำ &quot;ยิ่งกินยิ่งเร็ว&quot; ด้วยแนวคิดตาราง <code>MODES</code> ได้ไหม</li>
</ul>
<blockquote>
<p>เลือกมาสักข้อ แล้วเขียนลงใบงานว่า &quot;ถ้าเป็นเรา จะออกแบบยังไง&quot; ไม่ต้องมีคำตอบถูก ขอแค่คิดต่อจากสามบรรทัด <code>dt</code> ที่พิมพ์เองวันนี้ — ตรงนั้นแหละคือจุดที่น้องเริ่มเป็นวิศวกร ไม่ใช่แค่คนพิมพ์ตามเฉลย</p>
</blockquote>
