<h2 id="delta-time--%E0%B9%82%E0%B8%AB%E0%B8%A1%E0%B8%94%E0%B8%84%E0%B8%A7%E0%B8%B2%E0%B8%A1%E0%B8%A2%E0%B8%B2%E0%B8%81">delta-time + โหมดความยาก</h2>
<p><strong>ช่วง Flappy (ฟิสิกส์เกม) · คาบปิดท้ายของ Flappy — MVP-2</strong><br />

<blockquote>
<p>คาถาประจำคาบ: <strong>&quot;นับเป็นวินาที ไม่ใช่นับเป็นเฟรม&quot;</strong> · 3 คน / 1 บอร์ด</p>
</blockquote>

<h1 id="%E0%B9%80%E0%B8%9B%E0%B9%89%E0%B8%B2%E0%B8%AB%E0%B8%A1%E0%B8%B2%E0%B8%A2--visible-win--mvp">เป้าหมาย + visible win + MVP</h1>
<ul>
<li>เข้าใจ <strong>delta-time</strong> ว่าทำไม <code>vy += grav*dt</code> ถึงดีกว่า <code>vy += grav</code></li>
<li>ทำเมนู <strong>เลือกความยาก</strong> EASY / NORMAL / HARD ก่อนเริ่มเล่น</li>
<li>เก็บ <strong>best score</strong> ให้ค้างข้ามรอบเล่น</li>
</ul>
<p><span is="marp-span" data-auto-scaling="downscale-only" class="katex-display"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi>v</mi><mo>+</mo><mo>=</mo><mi>g</mi><mo>⋅</mo><mi mathvariant="normal">Δ</mi><mi>t</mi><mo separator="true">,</mo><mspace width="2em"/><mi>y</mi><mo>+</mo><mo>=</mo><mi>v</mi><mo>⋅</mo><mi mathvariant="normal">Δ</mi><mi>t</mi></mrow><annotation encoding="application/x-tex">v \mathrel{+}= g \cdot \Delta t, \qquad y \mathrel{+}= v \cdot \Delta t

<p><strong>visible win:</strong> boot ขึ้นเมนู <code>MODE: &lt; NORMAL &gt;</code> กด UP/DOWN เลือก EASY/HARD แล้วกด A นกจะบินลอดท่อ แต้มขึ้น และ <code>Best:</code> ค้างข้ามรอบ — เป็นเกมในตู้จริง</p>
</blockquote>
<p><strong>MVP-2:</strong> เกม Flappy เต็มที่เลือกโหมดได้ + ฟิสิกส์ delta-time + best score ค้างข้ามรอบ เปิดใน BENTO IDE แล้ว <strong>Program to Device</strong> เล่นโชว์อาจารย์ได้</p>

<h1 id="delta-time-%E0%B8%84%E0%B8%B7%E0%B8%AD%E0%B8%AD%E0%B8%B0%E0%B9%84%E0%B8%A3-%E0%B8%99%E0%B8%B1%E0%B8%9A%E0%B9%80%E0%B8%9B%E0%B9%87%E0%B8%99%E0%B8%A7%E0%B8%B4%E0%B8%99%E0%B8%B2%E0%B8%97%E0%B8%B5-%E0%B9%84%E0%B8%A1%E0%B9%88%E0%B9%83%E0%B8%8A%E0%B9%88%E0%B9%80%E0%B8%9F%E0%B8%A3%E0%B8%A1">delta-time คืออะไร: &quot;นับเป็นวินาที ไม่ใช่เฟรม&quot;</h1>
<p>แต่ละเฟรมกินเวลาไม่เท่ากัน (16ms บ้าง 33ms บ้าง) ถ้าเราบวกความเร็วเท่ากันทุกเฟรม นกจะเร็วหรือช้าตามเครื่อง — ซึ่งเราไม่อยากให้เป็นแบบนั้น</p>
<p><span is="marp-span" data-auto-scaling="downscale-only" class="katex-display"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi mathvariant="normal">Δ</mi><mi>t</mi><mo>=</mo><mfrac><mrow><msub><mi>t</mi><mtext>now</mtext></msub><mo>−</mo><msub><mi>t</mi><mtext>last</mtext></msub></mrow><mn>1000</mn></mfrac><mtext>  </mtext><mtext>(วินาที)</mtext></mrow><annotation encoding="application/x-tex">\Delta t = \frac{t_{\text{now}} - t_{\text{last}}}{1000} \;\text{(วินาที)} 
</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord">Δ</span><span class="mord mathnormal">t</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:1.9781em;vertical-align:-0.686em;"></span><span class="mord"><span class="mopen nulldelimiter"></span><span class="mfrac"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:1.2921em;"><span style="top:-2.314em;"><span class="pstrut" style="height:3em;"></span><span class="mord"><span class="mord">1000</span></span></span><span style="top:-3.23em;"><span class="pstrut" style="height:3em;"></span><span class="frac-line" style="border-bottom-width:0.04em;"></span></span><span style="top:-3.677em;"><span class="pstrut" style="height:3em;"></span><span class="mord"><span class="mord"><span class="mord mathnormal">t</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.1514em;"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord text mtight"><span class="mord mtight">now</span></span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">−</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mord"><span class="mord mathnormal">t</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3361em;"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord text mtight"><span class="mord mtight">last</span></span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.686em;"><span></span></span></span></span></span><span class="mclose nulldelimiter"></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mord text"><span class="mord">(</span><span class="mord brahmic_fallback">วินาที</span><span class="mord">)</span></span></span></span></span></span></p><p><span is="marp-span" data-auto-scaling="downscale-only" class="katex-display"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><msub><mi>v</mi><mtext>new</mtext></msub><mo>=</mo><mi>v</mi><mo>+</mo><mi>g</mi><mo>⋅</mo><mi mathvariant="normal">Δ</mi><mi>t</mi><mspace width="2em"/><msub><mi>y</mi><mtext>new</mtext></msub><mo>=</mo><mi>y</mi><mo>+</mo><msub><mi>v</mi><mtext>new</mtext></msub><mo>⋅</mo><mi mathvariant="normal">Δ</mi><mi>t</mi></mrow><annotation encoding="application/x-tex">v_{\text{new}} = v + g \cdot \Delta t \qquad y_{\text{new}} = y + v_{\text{new}} \cdot \Delta t 
</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.5806em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0359em;">v</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.1514em;"><span style="top:-2.55em;margin-left:-0.0359em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord text mtight"><span class="mord mtight">new</span></span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6667em;vertical-align:-0.0833em;"></span><span class="mord mathnormal" style="margin-right:0.0359em;">v</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">+</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:0.6389em;vertical-align:-0.1944em;"></span><span class="mord mathnormal" style="margin-right:0.0359em;">g</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">⋅</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:0.8778em;vertical-align:-0.1944em;"></span><span class="mord">Δ</span><span class="mord mathnormal">t</span><span class="mspace" style="margin-right:2em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0359em;">y</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.1514em;"><span style="top:-2.55em;margin-left:-0.0359em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord text mtight"><span class="mord mtight">new</span></span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.7778em;vertical-align:-0.1944em;"></span><span class="mord mathnormal" style="margin-right:0.0359em;">y</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">+</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:0.5945em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0359em;">v</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.1514em;"><span style="top:-2.55em;margin-left:-0.0359em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord text mtight"><span class="mord mtight">new</span></span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">⋅</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord">Δ</span><span class="mord mathnormal">t</span></span></span></span></span></p><svg width="640" height="120" xmlns="http://www.w3.org/2000/svg">
  <text x="10" y="25" font-size="14" fill="#c0392b">ต่อเฟรม: vy += GRAVITY → เฟรมกระตุก = ความเร็วเพี้ยน</text>
  <line x1="10" y1="40" x2="620" y2="40" stroke="#c0392b" stroke-dasharray="4" />
  <text x="10" y="80" font-size="14" fill="#1f9d55">delta-time: vy += grav*dt → แม้เฟรมกระตุก ความเร็วก็คงที่</text>
  <line x1="10" y1="95" x2="620" y2="95" stroke="#1f9d55" />
</svg>
<blockquote>
<p>หน่วยเปลี่ยนจาก &quot;ต่อเฟรม&quot; (<code>0.45</code>) มาเป็น &quot;ต่อวินาที&quot; (<code>900.0</code>) ตัวเลขจึงดูใหญ่ขึ้น แต่ความหมายเดียวกัน</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="5" style="--paginate:true;--theme:default;" data-marpit-pagination-total="30">
<h1 id="%E0%B9%80%E0%B8%AB%E0%B9%87%E0%B8%99%E0%B9%80%E0%B8%9B%E0%B9%87%E0%B8%99%E0%B8%81%E0%B8%A3%E0%B8%B2%E0%B8%9F-%E0%B9%80%E0%B8%9B%E0%B8%A5%E0%B8%B5%E0%B9%88%E0%B8%A2%E0%B8%99-fps-%E0%B9%81%E0%B8%A5%E0%B9%89%E0%B8%A7%E0%B8%99%E0%B8%81%E0%B8%95%E0%B8%81%E0%B8%95%E0%B9%88%E0%B8%B2%E0%B8%87%E0%B8%81%E0%B8%B1%E0%B8%99%E0%B9%81%E0%B8%84%E0%B9%88%E0%B9%84%E0%B8%AB%E0%B8%99">เห็นเป็นกราฟ: เปลี่ยน fps แล้วนกตกต่างกันแค่ไหน</h1>
<p>ลองวัด &quot;ระยะที่นกตกใน 1 วินาทีจริง&quot; ที่ 30fps เทียบ 60fps ด้วยสองวิธี แล้ววาดเป็นกราฟ:</p>
<p><img src="img/dt_framerate_graph.png" alt="" style="width:680px;" /></p>
<p>ฝั่งซ้าย (<code>vy += grav</code>) นับเป็นเฟรม จำนวนเฟรมต่อวินาทีต่างกัน ผลรวมจึงต่างกันมาก:</p>
<p><span is="marp-span" data-auto-scaling="downscale-only" class="katex-display"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><msub><mi>y</mi><mtext>60fps</mtext></msub><mtext>  </mtext><mo>≈</mo><mtext>  </mtext><mn>4</mn><mo>×</mo><msub><mi>y</mi><mtext>30fps</mtext></msub><mspace width="1em"/><mo stretchy="false">(</mo><mtext>เครื่องเร็วกว่า นกตกเร็วกว่า ทั้งที่เป็นเกมเดียวกัน</mtext><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">y_{\text{60fps}} \;\approx\; 4 \times y_{\text{30fps}} \quad(\text{เครื่องเร็วกว่า นกตกเร็วกว่า ทั้งที่เป็นเกมเดียวกัน}) 
</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.7692em;vertical-align:-0.2861em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0359em;">y</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3361em;"><span style="top:-2.55em;margin-left:-0.0359em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord text mtight"><span class="mord mtight">60fps</span></span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.2861em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">≈</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.7278em;vertical-align:-0.0833em;"></span><span class="mord">4</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">×</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:1.0361em;vertical-align:-0.2861em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0359em;">y</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3361em;"><span style="top:-2.55em;margin-left:-0.0359em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord text mtight"><span class="mord mtight">30fps</span></span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.2861em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:1em;"></span><span class="mopen">(</span><span class="mord text"><span class="mord brahmic_fallback">เครื่องเร็วกว่า</span><span class="mord"> </span><span class="mord brahmic_fallback">นกตกเร็วกว่า</span><span class="mord"> </span><span class="mord brahmic_fallback">ทั้งที่เป็นเกมเดียวกัน</span></span><span class="mclose">)</span></span></span></span></span></p><p>ฝั่งขวา (<code>vy += grav*dt</code>) เฟรมยิ่งถี่ <code>dt</code> ยิ่งเล็ก คูณกันแล้วชดเชยพอดี ผลรวมจึงเท่ากันทุก fps:</p>
<p><span is="marp-span" data-auto-scaling="downscale-only" class="katex-display"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi>y</mi><mtext>  </mtext><mo>=</mo><mtext>  </mtext><mo>∑</mo><mi>v</mi><mtext> </mtext><mi mathvariant="normal">Δ</mi><mi>t</mi><mtext>  </mtext><mo>≈</mo><mtext>  </mtext><mstyle scriptlevel="0" displaystyle="false"><mfrac><mn>1</mn><mn>2</mn></mfrac></mstyle><mtext> </mtext><mi>g</mi><mtext> </mtext><msup><mi>t</mi><mn>2</mn></msup><mspace width="1em"/><mo stretchy="false">(</mo><mtext>ค่าเดียวกันไม่ว่าจะกี่ fps</mtext><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">y \;=\; \sum v\,\Delta t \;\approx\; \tfrac{1}{2}\,g\,t^2 \quad(\text{ค่าเดียวกันไม่ว่าจะกี่ fps}) 
</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.625em;vertical-align:-0.1944em;"></span><span class="mord mathnormal" style="margin-right:0.0359em;">y</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:1.6em;vertical-align:-0.55em;"></span><span class="mop op-symbol large-op" style="position:relative;top:0em;">∑</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal" style="margin-right:0.0359em;">v</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord">Δ</span><span class="mord mathnormal">t</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">≈</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:1.2091em;vertical-align:-0.345em;"></span><span class="mord"><span class="mopen nulldelimiter"></span><span class="mfrac"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.8451em;"><span style="top:-2.655em;"><span class="pstrut" style="height:3em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mtight">2</span></span></span></span><span style="top:-3.23em;"><span class="pstrut" style="height:3em;"></span><span class="frac-line" style="border-bottom-width:0.04em;"></span></span><span style="top:-3.394em;"><span class="pstrut" style="height:3em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mtight">1</span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.345em;"><span></span></span></span></span></span><span class="mclose nulldelimiter"></span></span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal" style="margin-right:0.0359em;">g</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord"><span class="mord mathnormal">t</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.8641em;"><span style="top:-3.113em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight">2</span></span></span></span></span></span></span></span><span class="mspace" style="margin-right:1em;"></span><span class="mopen">(</span><span class="mord text"><span class="mord brahmic_fallback">ค่าเดียวกันไม่ว่าจะกี่</span><span class="mord"> fps</span></span><span class="mclose">)</span></span></span></span></span></p><blockquote>
<p>นี่คือเหตุผลที่เราท่อง &quot;นับเป็นวินาที ไม่ใช่นับเป็นเฟรม&quot; — เส้นเขียวสองเส้นทับกันสนิท คือเป้าหมายของเรา</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="6" style="--paginate:true;--theme:default;" data-marpit-pagination-total="30">
<h1 id="%E0%B8%94%E0%B8%B9%E0%B9%81%E0%B8%9A%E0%B8%9A%E0%B9%80%E0%B8%84%E0%B8%A5%E0%B8%B7%E0%B9%88%E0%B8%AD%E0%B8%99%E0%B9%84%E0%B8%AB%E0%B8%A7-%E0%B9%80%E0%B8%9F%E0%B8%A3%E0%B8%A1%E0%B8%81%E0%B8%A3%E0%B8%B0%E0%B8%95%E0%B8%B8%E0%B8%81-%E0%B8%99%E0%B8%81%E0%B8%95%E0%B8%B1%E0%B8%A7%E0%B9%84%E0%B8%AB%E0%B8%99%E0%B8%95%E0%B8%81%E0%B8%96%E0%B8%B9%E0%B8%81%E0%B8%88%E0%B8%B1%E0%B8%87%E0%B8%AB%E0%B8%A7%E0%B8%B0">ดูแบบเคลื่อนไหว: เฟรมกระตุก นกตัวไหนตกถูกจังหวะ</h1>
<p><img src="img/dt_compare.gif" alt="" style="width:560px;" /></p>
<p>แถบฟ้าด้านบนคือ &quot;เวลาจริง&quot; ที่เดินไป สังเกตว่าแต่ละเฟรมกินเวลาไม่เท่ากัน (16ms บ้าง 70ms บ้าง — นี่คือเฟรมกระตุก) เส้นประเขียวคือ &quot;ตำแหน่งที่ถูกต้องตามฟิสิกส์จริง&quot; ณ เวลานั้น</p>
<ul>
<li>นกแดง (<code>vy += grav</code>) นับเป็นเฟรม พอเฟรมยืด มันก็ <strong>หลุดออกจากเส้นจริง</strong> ตกเร็วไปบ้างช้าไปบ้าง คุมจังหวะไม่ได้</li>
<li>นกเขียว (<code>vy += grav*dt</code>) คูณเวลาจริงไว้ จึง <strong>เกาะเส้นจริงตลอด</strong> เฟรมจะกระตุกแค่ไหนก็ตกถูกจังหวะ</li>
</ul>
<blockquote>
<p>นี่แหละสิ่งที่ <code>dt</code> ให้เรา: เฟรมไม่สม่ำเสมอเป็นเรื่องปกติของบอร์ดจริง แต่ถ้าคูณ <code>dt</code> ไว้ การเคลื่อนที่จะอิงเวลาจริง ไม่อิงความเร็วเครื่อง</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="7" style="--paginate:true;--theme:default;" data-marpit-pagination-total="30">
<h1 id="%E0%B8%A7%E0%B8%B1%E0%B8%94%E0%B9%80%E0%B8%A7%E0%B8%A5%E0%B8%B2%E0%B8%88%E0%B8%A3%E0%B8%B4%E0%B8%87%E0%B8%94%E0%B9%89%E0%B8%A7%E0%B8%A2-ticks_ms--ticks_diff">วัดเวลาจริงด้วย <code>ticks_ms</code> + <code>ticks_diff</code></h1>
<p>เราใช้นาฬิกาของบอร์ดวัด &quot;เวลาที่ผ่านไปจริง&quot; ระหว่างเฟรมก่อนกับเฟรมนี้ แล้วหารพันให้เป็นวินาที</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">    <span class="hljs-keyword">import</span> time
    last_clock = [time.ticks_ms()]              <span class="hljs-comment"># ห่อใน list ให้ closure แก้ค่าได้</span>

    <span class="hljs-keyword">def</span> <span class="hljs-title function_">on_each_frame</span>():
        now = time.ticks_ms()
        dt = time.ticks_diff(now, last_clock[<span class="hljs-number">0</span>]) / <span class="hljs-number">1000.0</span>   <span class="hljs-comment"># เวลาจริง (วินาที)</span>
        last_clock[<span class="hljs-number">0</span>] = now
        <span class="hljs-keyword">if</span> dt &gt; <span class="hljs-number">0.05</span>:                           <span class="hljs-comment"># กันเฟรมค้างยาวทะลุท่อ</span>
            dt = <span class="hljs-number">0.05</span>
</code></pre>
<p><img src="img/dt_loop.png" alt="" style="width:680px;" /></p>
<p><span is="marp-span" data-auto-scaling="downscale-only" class="katex-display"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mtext>clamp:</mtext><mspace width="1em"/><mi mathvariant="normal">Δ</mi><mi>t</mi><mo>≤</mo><mn>0.05</mn><mtext> </mtext><mtext>s</mtext><mtext>  </mtext><mo>⇒</mo><mtext>  </mtext><mtext>ไม่ทะลุท่อตอนเฟรมค้าง</mtext></mrow><annotation encoding="application/x-tex">\text{clamp:}\quad \Delta t \le 0.05\,\text{s} \;\Rightarrow\; \text{ไม่ทะลุท่อตอนเฟรมค้าง} 
</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8889em;vertical-align:-0.1944em;"></span><span class="mord text"><span class="mord">clamp:</span></span><span class="mspace" style="margin-right:1em;"></span><span class="mord">Δ</span><span class="mord mathnormal">t</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">≤</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">0.05</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord text"><span class="mord">s</span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">⇒</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord text"><span class="mord brahmic_fallback">ไม่ทะลุท่อตอนเฟรมค้าง</span></span></span></span></span></span></p><blockquote>
<p>เคล็ดเล็ก ๆ: <code>time.ticks_diff()</code> ปลอดภัยกว่าการลบกันตรง ๆ เพราะมันจัดการกรณีตัวนับวนรอบ (overflow) ให้เรา<br />
อ่านแผนภาพซ้ายไปขวา: อ่านนาฬิกา → หาส่วนต่าง → แปลงเป็นวินาที → clamp → เอา <code>dt</code> ไปคูณในฟิสิกส์ → จำเวลาไว้ใช้เฟรมหน้า</p>
<p><strong>map ลงไฟล์:</strong> <code>now = ticks_ms()</code> → <code>flappy_step5.py:66</code> · <code>dt = ticks_diff/1000</code> → <code>:67</code> · จำเวลา <code>last_clock[0]=now</code> → <code>:68</code> · clamp <code>dt&gt;0.05</code> → <code>:69</code>. หมายเหตุ: ในไฟล์จริงจับเวลาเริ่มไว้ที่ <code>last_time</code> (<code>:60</code>) แล้วค่อยห่อเป็น list <code>last_clock = [last_time]</code> <strong>หลัง</strong> นิยาม <code>on_each_frame</code> (<code>:100</code>) — สไลด์นี้ย่อให้อ่านง่าย (ดูรายละเอียด closure ในสไลด์ประกอบร่างท้ายคาบ)</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="8" style="--paginate:true;--theme:default;" data-marpit-pagination-total="30">
<h1 id="%E0%B8%9F%E0%B8%B4%E0%B8%AA%E0%B8%B4%E0%B8%81%E0%B8%AA%E0%B9%8C-delta-time-%E0%B8%88%E0%B8%B8%E0%B8%94%E0%B8%97%E0%B8%B5%E0%B9%88%E0%B8%95%E0%B9%88%E0%B8%B2%E0%B8%87%E0%B8%88%E0%B8%B2%E0%B8%81%E0%B8%84%E0%B8%B2%E0%B8%9A%E0%B8%81%E0%B9%88%E0%B8%AD%E0%B8%99">ฟิสิกส์ delta-time: จุดที่ต่างจากคาบก่อน</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">        keys = game.keys()
        <span class="hljs-keyword">if</span> keys.a <span class="hljs-keyword">or</span> keys.up:                   <span class="hljs-comment"># กระพือ</span>
            bird_state[<span class="hljs-string">&quot;velocity&quot;</span>] = flap
            game.sfx(<span class="hljs-string">&quot;flap&quot;</span>)
        bird_state[<span class="hljs-string">&quot;velocity&quot;</span>] += gravity * dt  <span class="hljs-comment"># โน้มถ่วง &quot;ต่อวินาที&quot;</span>
        bird_state[<span class="hljs-string">&quot;y&quot;</span>]        += bird_state[<span class="hljs-string">&quot;velocity&quot;</span>] * dt
        <span class="hljs-keyword">if</span> bird_state[<span class="hljs-string">&quot;y&quot;</span>] &lt; <span class="hljs-number">0</span>:                 <span class="hljs-comment"># กันทะลุเพดาน</span>
            bird_state[<span class="hljs-string">&quot;y&quot;</span>], bird_state[<span class="hljs-string">&quot;velocity&quot;</span>] = <span class="hljs-number">0</span>, <span class="hljs-number">0</span>
        <span class="hljs-keyword">if</span> bird_state[<span class="hljs-string">&quot;y&quot;</span>] &gt; game.HEIGHT - bird.h:   <span class="hljs-comment"># ตกพื้น = จบ</span>
            game.sfx(<span class="hljs-string">&quot;fall&quot;</span>)
            <span class="hljs-keyword">return</span> <span class="hljs-literal">False</span>
        bird.move_to(bird.x, bird_state[<span class="hljs-string">&quot;y&quot;</span>])
</code></pre>
<p><img src="img/dt_physics_diff.png" alt="" style="width:600px;" /></p>
<blockquote>
<p>จุดต่างจาก step4 อยู่ที่ <code>* dt</code> สองบรรทัด: เดิม <code>bird_velocity += GRAVITY</code> (<code>flappy_step4.py:52</code>, ค่าคงที่ต่อเฟรม) ตอนนี้เป็น <code>bird_state[&quot;velocity&quot;] += gravity * dt</code> (<code>flappy_step5.py:73-74</code>, คูณด้วยวินาทีจริง)<br />
หน้าจอบอร์ดเรา <code>game.WIDTH = 792</code>, <code>game.HEIGHT = 398</code> (จาก <code>bentogame.py</code>)</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="9" style="--paginate:true;--theme:default;" data-marpit-pagination-total="30">
<h1 id="%E0%B9%80%E0%B8%AA%E0%B8%B5%E0%B8%A2%E0%B8%87%E0%B8%82%E0%B8%AD%E0%B8%87-flappy-%E0%B8%81%E0%B8%A3%E0%B8%B0%E0%B8%9E%E0%B8%B7%E0%B8%AD--%E0%B9%84%E0%B8%94%E0%B9%89%E0%B9%81%E0%B8%95%E0%B9%89%E0%B8%A1--%E0%B8%95%E0%B8%81">เสียงของ Flappy: กระพือ / ได้แต้ม / ตก</h1>
<p>Flappy ในคาบนี้เรียก <code>game.sfx(...)</code> สามจังหวะ: ตอนกระพือ (<code>flap</code>), ตอนลอดท่อได้แต้ม (<code>point</code>), และตอนนกตกพื้น (<code>fall</code>) — แต่ละจังหวะมีเสียงประกอบของมันเอง ลองฟังเสียงจริงที่บอร์ดจะเล่นก่อนเอาไปใส่โค้ด</p>
<blockquote>
<p><strong>เสียงในคาบนี้</strong> — Flappy ใช้เสียง 3 จังหวะ: กระพือ (<code>flap</code>), ลอดท่อได้แต้ม (<code>point</code>), และตกพื้น (<code>fall</code>) (กดเล่นฟังได้จริง):</p>
</blockquote>
<div style="display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap;font-size:0.72em;margin:8px 0">
<span><b>flappy_flap</b> (flap)<br /><audio controls src="img/sfx_flappy_flap.mp3" style="height:30px;width:160px"></audio><br /><img src="img/sfx_flappy_flap_spec.png" style="width:160px;height:auto;margin-top:4px;filter:none" alt="spectrogram ของ flappy_flap — สั้นกระชับ" /></span>
<span><b>flappy_score</b> (point)<br /><audio controls src="img/sfx_flappy_score.mp3" style="height:30px;width:160px"></audio><br /><img src="img/sfx_flappy_score_spec.png" style="width:160px;height:auto;margin-top:4px;filter:none" alt="spectrogram ของ flappy_score — สั้นสว่าง" /></span>
<span><b>flappy_die</b> (fall)<br /><audio controls src="img/sfx_flappy_die.mp3" style="height:30px;width:160px"></audio><br /><img src="img/sfx_flappy_die_spec.png" style="width:160px;height:auto;margin-top:4px;filter:none" alt="spectrogram ของ flappy_die — ยาวกว่า ตกลงด้านล่าง" /></span>
<span style="min-width:180px">ฟังครบ 21 ตัว + รูปคลื่น/ซูม/spectrogram → <a href="img/sound_video_demo.html"><b>Sound Explorer</b></a></span>
</div>
<blockquote>
<p>ดูรูป spectrogram ใต้แต่ละปุ่มจะเห็นชัดว่าเสียง <code>flap</code>/<code>point</code> เป็นแถบสั้น ๆ สว่าง (เล่นถี่ทุกครั้งที่กดปุ่ม) ส่วน <code>fall</code> เป็นแถบยาวกว่าและไล่ลงต่ำ ให้รู้สึกว่า &quot;จบรอบแล้ว&quot; — แกนนอนคือเวลา แกนตั้งคือความถี่</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="10" style="--paginate:true;--theme:default;" data-marpit-pagination-total="30">
<h1 id="%E0%B9%80%E0%B8%A3%E0%B8%B7%E0%B9%88%E0%B8%AD%E0%B8%87%E0%B8%88%E0%B8%A3%E0%B8%B4%E0%B8%87%E0%B8%88%E0%B8%B2%E0%B8%81%E0%B9%80%E0%B8%84%E0%B8%A3%E0%B8%B7%E0%B9%88%E0%B8%AD%E0%B8%87%E0%B9%80%E0%B8%81%E0%B8%A1-%E0%B8%9B%E0%B8%B1%E0%B8%8D%E0%B8%AB%E0%B8%B2-%E0%B9%80%E0%B8%A3%E0%B9%87%E0%B8%A7-%E0%B8%8A%E0%B9%89%E0%B8%B2%E0%B8%95%E0%B8%B2%E0%B8%A1%E0%B9%80%E0%B8%84%E0%B8%A3%E0%B8%B7%E0%B9%88%E0%B8%AD%E0%B8%87">เรื่องจริงจากเครื่องเกม: ปัญหา &quot;เร็ว-ช้าตามเครื่อง&quot;</h1>
<div style="display:flex;gap:18px;align-items:center">
<div style="flex:0 0 38%;text-align:center">
<p><img src="img/ins_nes.jpg" alt="" style="width:300px;" /></p>
<p><sub>ที่มา: &quot;Nintendo Entertainment System NES Console&quot; — Evan-Amos, Public domain, Wikimedia Commons</sub></p>
</div>
<div style="flex:1">
<p>เครื่องเกมยุค NES มีสองรุ่นตามภูมิภาค: ฝั่งอเมริกา/ญี่ปุ่น (NTSC) จอรีเฟรช <strong>60 ครั้ง/วินาที</strong> ส่วนฝั่งยุโรป (PAL) รีเฟรช <strong>50 ครั้ง/วินาที</strong> เกมหลายเกมสมัยนั้นผูกฟิสิกส์ไว้กับเฟรมตรง ๆ (<code>vy += grav</code> แบบที่เราเพิ่งเลิกใช้)</p>
<p>ผลคือ <strong>เกมเดียวกันเล่นบนเครื่อง PAL ช้ากว่าเครื่อง NTSC ราว 17%</strong> ตัวละครเดินช้าลง เพลงยืดออก เพราะโค้ดนับเป็น &quot;เฟรม&quot; ไม่ใช่ &quot;วินาที&quot; นี่คือบั๊กระดับตำนานที่ delta-time แก้ได้พอดี</p>
<p><span is="marp-span" data-auto-scaling="downscale-only" class="katex-display"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mfrac><mrow><mn>50</mn><mtext> fps</mtext></mrow><mrow><mn>60</mn><mtext> fps</mtext></mrow></mfrac><mo>≈</mo><mn>0.833</mn><mtext>  </mtext><mo>⇒</mo><mtext>  </mtext><mn>1</mn><mo>−</mo><mn>0.833</mn><mo>=</mo><mn>0.167</mn><mo>≈</mo><mn>17</mn><mi mathvariant="normal">%</mi><mtext> ช้าลง</mtext></mrow><annotation encoding="application/x-tex">\frac{50\ \text{fps}}{60\ \text{fps}} \approx 0.833 \;\Rightarrow\; 1 - 0.833 = 0.167 \approx 17\%\ \text{ช้าลง} 
</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:2.2519em;vertical-align:-0.8804em;"></span><span class="mord"><span class="mopen nulldelimiter"></span><span class="mfrac"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:1.3714em;"><span style="top:-2.314em;"><span class="pstrut" style="height:3em;"></span><span class="mord"><span class="mord">60</span><span class="mspace"> </span><span class="mord text"><span class="mord">fps</span></span></span></span><span style="top:-3.23em;"><span class="pstrut" style="height:3em;"></span><span class="frac-line" style="border-bottom-width:0.04em;"></span></span><span style="top:-3.677em;"><span class="pstrut" style="height:3em;"></span><span class="mord"><span class="mord">50</span><span class="mspace"> </span><span class="mord text"><span class="mord">fps</span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.8804em;"><span></span></span></span></span></span><span class="mclose nulldelimiter"></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">≈</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">0.833</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">⇒</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.7278em;vertical-align:-0.0833em;"></span><span class="mord">1</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">−</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">0.833</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">0.167</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">≈</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.8056em;vertical-align:-0.0556em;"></span><span class="mord">17%</span><span class="mspace"> </span><span class="mord text"><span class="mord brahmic_fallback">ช้าลง</span></span></span></span></span></span></p><p>PAL ขยับฟิสิกส์ได้แค่ 50 ครั้งต่อวินาทีเทียบกับ 60 ครั้งของ NTSC โหมด <code>vy += grav</code> จึงสะสมความเร็วได้น้อยกว่า ~17% — คูณ <code>dt</code> ปุ๊บอัตราส่วนนี้หายทันที</p>
</div>
</div>
<blockquote>
<p>บอร์ด BENTO ของเราก็เจอเรื่องเดียวกัน: บางจังหวะ CM55 วาดจอช้าลง เฟรมก็ยืด ถ้าเราคูณ <code>dt</code> ไว้ เกมจะเล่นด้วยความเร็วเท่าเดิมเสมอ ไม่ว่าเฟรมจะกระตุกหรือไม่</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="11" style="--paginate:true;--theme:default;" data-marpit-pagination-total="30">
<h1 id="%E0%B8%95%E0%B8%B2%E0%B8%A3%E0%B8%B2%E0%B8%87%E0%B9%82%E0%B8%AB%E0%B8%A1%E0%B8%94-mode-table-%E0%B8%AB%E0%B8%B1%E0%B8%A7%E0%B9%83%E0%B8%88%E0%B8%82%E0%B8%AD%E0%B8%87-%E0%B9%80%E0%B8%81%E0%B8%A1%E0%B9%83%E0%B8%99%E0%B8%95%E0%B8%B9%E0%B9%89">ตารางโหมด (mode table): หัวใจของ &quot;เกมในตู้&quot;</h1>
<p>เราเก็บค่าความยากเป็น list ของ tuple พอทำแบบนี้ การเปลี่ยนเกมทั้งใบก็เหลือแค่สลับ index ตัวเดียว</p>
<p><span is="marp-span" data-auto-scaling="downscale-only" class="katex-display"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mtext>difficulty</mtext><mo>=</mo><mtext>MODES</mtext><mo stretchy="false">[</mo><mtext> </mtext><mi>i</mi><mtext> </mtext><mo stretchy="false">]</mo><mo separator="true">,</mo><mspace width="1em"/><mi>i</mi><mo>∈</mo><mo stretchy="false">{</mo><mn>0</mn><mo separator="true">,</mo><mn>1</mn><mo separator="true">,</mo><mn>2</mn><mo stretchy="false">}</mo><mtext>  </mtext><mo>⇒</mo><mtext>  </mtext><mtext>EASY/NORMAL/HARD</mtext></mrow><annotation encoding="application/x-tex">\text{difficulty} = \text{MODES}[\,i\,], \quad i \in \{0,1,2\} \;\Rightarrow\; \text{EASY/NORMAL/HARD}
</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8889em;vertical-align:-0.1944em;"></span><span class="mord text"><span class="mord">difficulty</span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord text"><span class="mord">MODES</span></span><span class="mopen">[</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal">i</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mclose">]</span><span class="mpunct">,</span><span class="mspace" style="margin-right:1em;"></span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal">i</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">∈</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mopen">{</span><span class="mord">0</span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord">1</span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord">2</span><span class="mclose">}</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">⇒</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord text"><span class="mord">EASY/NORMAL/HARD</span></span></span></span></span></span></p><pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">    <span class="hljs-comment"># ตารางโหมด: (ชื่อ, gap, speed px/s, grav px/s^2, flap px/s)</span>
    MODES = [
        (<span class="hljs-string">&quot;EASY&quot;</span>,   <span class="hljs-number">175</span>, <span class="hljs-number">200.0</span>,  <span class="hljs-number">900.0</span>, -<span class="hljs-number">360.0</span>),
        (<span class="hljs-string">&quot;NORMAL&quot;</span>, <span class="hljs-number">152</span>, <span class="hljs-number">240.0</span>, <span class="hljs-number">1100.0</span>, -<span class="hljs-number">390.0</span>),
        (<span class="hljs-string">&quot;HARD&quot;</span>,   <span class="hljs-number">120</span>, <span class="hljs-number">300.0</span>, <span class="hljs-number">1300.0</span>, -<span class="hljs-number">410.0</span>),
    ]

    <span class="hljs-comment"># เลือกโหมดแล้วแกะค่าออกมาใช้ทีเดียว</span>
    mode_name, gap, speed, gravity, flap = MODES[mode_index]
</code></pre>
<blockquote>
<p><code>gap</code> ยิ่งแคบยิ่งยาก · <code>grav</code> ยิ่งสูง นกยิ่งตกหนัก · <code>flap</code> ยิ่งลบมาก กระพือยิ่งแรง<br />
pattern นี้น้อง ๆ จะเจออีกใน Snake ที่ปรับความเร็วตามคะแนน — จำไว้ให้ดี<br />
ในไฟล์: ตาราง <code>MODES</code> → <code>flappy_step5.py:31-35</code> · แกะค่า <code>mode_name, gap, speed, gravity, flap = MODES[mode_index]</code> → <code>:43</code> (มิเรอร์ <code>s_flap_modes[]</code> ฝั่ง C ที่ <code>page_game_flappy.c:59-63</code>)</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="12" style="--paginate:true;--theme:default;" data-marpit-pagination-total="30">
<h1 id="%E0%B8%AB%E0%B8%99%E0%B9%89%E0%B8%B2%E0%B8%88%E0%B8%AD%E0%B9%80%E0%B8%A5%E0%B8%B7%E0%B8%AD%E0%B8%81%E0%B9%82%E0%B8%AB%E0%B8%A1%E0%B8%94-up--down-%E0%B9%80%E0%B8%A5%E0%B8%B7%E0%B9%88%E0%B8%AD%E0%B8%99-a-%E0%B9%80%E0%B8%A3%E0%B8%B4%E0%B9%88%E0%B8%A1">หน้าจอเลือกโหมด: UP / DOWN เลื่อน, A เริ่ม</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">    <span class="hljs-keyword">def</span> <span class="hljs-title function_">choose_mode</span>():
        game.clear()                            <span class="hljs-comment"># ล้างจอ GAME OVER ของรอบก่อน</span>
        selected = <span class="hljs-number">1</span>                            <span class="hljs-comment"># ค่าเริ่มต้น = NORMAL</span>
        mode_label = game.Text(<span class="hljs-string">&quot;&quot;</span>, <span class="hljs-number">280</span>, <span class="hljs-number">150</span>, game.GB_LIGHTEST)
        game.Text(<span class="hljs-string">&quot;UP/DOWN เลือกโหมด, A = เริ่ม&quot;</span>, <span class="hljs-number">250</span>, <span class="hljs-number">200</span>, game.WHITE)
        mode_label.<span class="hljs-built_in">set</span>(<span class="hljs-string">&quot;MODE:  &lt; %s &gt;&quot;</span> % MODES[selected][<span class="hljs-number">0</span>])
        <span class="hljs-keyword">while</span> <span class="hljs-literal">True</span>:
            keys = game.keys()
            <span class="hljs-keyword">if</span> keys.up:                         <span class="hljs-comment"># เลื่อนขึ้น (วนรอบด้วย %)</span>
                selected = (selected - <span class="hljs-number">1</span>) % <span class="hljs-built_in">len</span>(MODES)
                mode_label.<span class="hljs-built_in">set</span>(<span class="hljs-string">&quot;MODE:  &lt; %s &gt;&quot;</span> % MODES[selected][<span class="hljs-number">0</span>])
                time.sleep_ms(<span class="hljs-number">180</span>)              <span class="hljs-comment"># กันปุ่มเด้งรัว</span>
            <span class="hljs-keyword">if</span> keys.down:
                selected = (selected + <span class="hljs-number">1</span>) % <span class="hljs-built_in">len</span>(MODES)
                mode_label.<span class="hljs-built_in">set</span>(<span class="hljs-string">&quot;MODE:  &lt; %s &gt;&quot;</span> % MODES[selected][<span class="hljs-number">0</span>])
                time.sleep_ms(<span class="hljs-number">180</span>)
            <span class="hljs-keyword">if</span> keys.a:
                <span class="hljs-keyword">return</span> selected                 <span class="hljs-comment"># ยืนยัน → เริ่มเล่นโหมดนี้</span>
            time.sleep_ms(<span class="hljs-number">30</span>)
</code></pre>
<p><img src="img/mode_wrap.png" alt="" style="width:560px;" /></p>
<blockquote>
<p><code>% len(MODES)</code> ทำให้เลื่อนจาก EASY ขึ้นไปวนกลับมา HARD ได้เอง ไม่ต้องเช็คขอบ<br />
โค้ดจริง <code>choose_mode()</code> อยู่ที่ <code>flappy_step5.py:108-121</code> — ไฟล์แยกการอัปเดตป้ายเป็นฟังก์ชันย่อย <code>draw_choice()</code> (<code>:113-115</code>) สไลด์นี้กระจายมาเขียนตรง ๆ ให้อ่านง่าย (ผลเหมือนกัน)</p>
</blockquote>
</section>

<h1 id="best-score-%E0%B8%88%E0%B8%B3%E0%B8%84%E0%B8%B0%E0%B9%81%E0%B8%99%E0%B8%99%E0%B8%94%E0%B8%B5%E0%B8%97%E0%B8%B5%E0%B9%88%E0%B8%AA%E0%B8%B8%E0%B8%94%E0%B8%82%E0%B9%89%E0%B8%B2%E0%B8%A1%E0%B8%A3%E0%B8%AD%E0%B8%9A">best score: จำคะแนนดีที่สุดข้ามรอบ</h1>
<p><code>best_score</code> เป็นตัวแปรระดับ module อยู่นอกฟังก์ชันเล่น พอจบรอบมันจึงไม่หาย เราอัปเดตทุกครั้งที่ทำแต้มใหม่</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">    best_score = <span class="hljs-number">0</span>                              <span class="hljs-comment"># อยู่นอก play_round → ค้างข้ามรอบ</span>

    <span class="hljs-keyword">def</span> <span class="hljs-title function_">on_each_frame</span>():
        <span class="hljs-keyword">global</span> best_score
        ...
        <span class="hljs-keyword">if</span> <span class="hljs-keyword">not</span> pipe[<span class="hljs-string">&quot;scored&quot;</span>] <span class="hljs-keyword">and</span> pipe[<span class="hljs-string">&quot;x&quot;</span>] + PIPE_WIDTH &lt; bird.x:
            pipe[<span class="hljs-string">&quot;scored&quot;</span>] = <span class="hljs-literal">True</span>
            bird_state[<span class="hljs-string">&quot;score&quot;</span>] += <span class="hljs-number">1</span>
            game.sfx(<span class="hljs-string">&quot;point&quot;</span>)
            <span class="hljs-keyword">if</span> bird_state[<span class="hljs-string">&quot;score&quot;</span>] &gt; best_score:    <span class="hljs-comment"># ทำลายสถิติ</span>
                best_score = bird_state[<span class="hljs-string">&quot;score&quot;</span>]
            hud_label.<span class="hljs-built_in">set</span>(<span class="hljs-string">&quot;%d  Best: %d  [%s]&quot;</span> %
                          (bird_state[<span class="hljs-string">&quot;score&quot;</span>], best_score, mode_name))
</code></pre>
<p><img src="img/best_score_scope.png" alt="" style="width:600px;" /></p>
<blockquote>
<p>ธง <code>pipe[&quot;scored&quot;]</code> กันนับแต้มซ้ำท่อเดิม (ของเดิมจากคาบที่แล้ว) ส่วน <code>best_score</code> คือของใหม่คาบนี้<br />
ในไฟล์: ประกาศ <code>best_score = 0</code> ระดับ module <code>flappy_step5.py:38</code> · <code>global best_score</code> ใน frame <code>:64</code> · อัปเดตสถิติ <code>:97</code> — วางนอก <code>play_round()</code> จึงไม่หายตอนจบรอบ</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="14" style="--paginate:true;--theme:default;" data-marpit-pagination-total="30">
<h1 id="%E0%B8%A5%E0%B8%B9%E0%B8%9B%E0%B8%84%E0%B8%AD%E0%B8%99%E0%B9%82%E0%B8%8B%E0%B8%A5%E0%B8%88%E0%B8%A3%E0%B8%B4%E0%B8%87-%E0%B9%80%E0%B8%A5%E0%B8%B7%E0%B8%AD%E0%B8%81-%E2%86%92-%E0%B9%80%E0%B8%A5%E0%B9%88%E0%B8%99-%E2%86%92-%E0%B8%95%E0%B8%B2%E0%B8%A2-%E2%86%92-%E0%B8%81%E0%B8%A5%E0%B8%B1%E0%B8%9A%E0%B9%80%E0%B8%A1%E0%B8%99%E0%B8%B9">ลูปคอนโซลจริง: เลือก → เล่น → ตาย → กลับเมนู</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">    <span class="hljs-comment"># วนเหมือนเครื่องเกมจริง</span>
    <span class="hljs-keyword">while</span> <span class="hljs-literal">True</span>:
        chosen_mode = choose_mode()             <span class="hljs-comment"># หน้าเลือกโหมด</span>
        play_round(chosen_mode)                 <span class="hljs-comment"># เล่น 1 รอบ</span>
        time.sleep_ms(<span class="hljs-number">700</span>)                      <span class="hljs-comment"># ค้างจอ GAME OVER ก่อนกลับเมนู</span>
</code></pre>

<blockquote>
<p>เปิด <code>game.clear()</code> ต้นทุกหน้าจอใหม่ เพื่อล้างกล่อง/ข้อความรอบก่อน กันชน &quot;เพดาน 32 sprite&quot;</p>

</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="15" style="--paginate:true;--theme:default;" data-marpit-pagination-total="30">
<h1 id="%E0%B8%9B%E0%B8%A3%E0%B8%B0%E0%B8%81%E0%B8%AD%E0%B8%9A%E0%B8%A3%E0%B9%88%E0%B8%B2%E0%B8%87-play_round-closure-%E0%B8%AB%E0%B9%88%E0%B8%AD-%E0%B8%A5%E0%B8%B9%E0%B8%9B%E0%B9%80%E0%B8%9F%E0%B8%A3%E0%B8%A1">ประกอบร่าง <code>play_round()</code>: closure ห่อ &quot;ลูปเฟรม&quot;</h1>
<p><code>play_round()</code> คือ <strong>ฟังก์ชันที่ห่อฟังก์ชัน</strong> (closure): ขอบเขตนอกสร้างเวที (นก·ท่อ·นาฬิกา) ครั้งเดียว แล้วนิยาม <code>on_each_frame</code> ไว้ข้างใน ให้ <code>game.run</code> เรียกซ้ำทุกเฟรม — ตัวแปรของรอบนั้นถูก &quot;จำ&quot; ไว้ในขอบเขตนอกโดยไม่ต้องเป็น global</p>
<div style="text-align:center">
<svg width="900" height="216" viewBox="0 0 900 216" font-family="DejaVu Sans, sans-serif">
  <defs>
    <marker id="arc" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#607d8b" /></marker>
  </defs>
  <rect x="14" y="14" width="556" height="190" rx="12" fill="#f5f9ff" stroke="#1565c0" stroke-width="2" stroke-dasharray="7 5" />
  <text x="28" y="34" font-size="13" font-weight="700" fill="#1565c0">play_round() — ขอบเขตนอก (สร้างครั้งเดียวต่อรอบ)</text>
  <g font-size="13" text-anchor="middle">
    <rect x="30" y="44" width="250" height="40" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" />
    <text x="155" y="63" fill="#1565c0" font-weight="700">last_time = time.ticks_ms()</text><text x="155" y="78" font-size="10" fill="#999">จับเวลาเริ่ม :60</text>
    <rect x="308" y="42" width="238" height="44" rx="8" fill="#fff3e0" stroke="#ef6c00" stroke-width="2" />
    <text x="427" y="62" fill="#e65100" font-weight="700">last_clock = [ last_time ]</text><text x="427" y="78" font-size="10" fill="#999">ห่อเป็น list (แก้ค่าได้) :100</text>
  </g>
  <rect x="30" y="104" width="516" height="86" rx="10" fill="#faf5ff" stroke="#6a1b9a" stroke-width="2" stroke-dasharray="7 5" />
  <text x="44" y="123" font-size="12" font-weight="700" fill="#6a1b9a">on_each_frame() — ขอบเขตใน (เรียกทุกเฟรม 60 Hz) :63</text>
  <g font-size="12" text-anchor="middle">
    <rect x="44" y="132" width="150" height="44" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" />
    <text x="119" y="151" fill="#1565c0" font-weight="700">now = ticks_ms()</text><text x="119" y="167" font-size="10" fill="#999">:66</text>
    <rect x="210" y="132" width="176" height="44" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" />
    <text x="298" y="151" fill="#2e7d32" font-weight="700">dt = diff(now, last_clock[0])</text><text x="298" y="167" font-size="10" fill="#999">อ่านค่าเก่า :67</text>
    <rect x="402" y="132" width="132" height="44" rx="8" fill="#fff3e0" stroke="#ef6c00" stroke-width="2" />
    <text x="468" y="151" fill="#e65100" font-weight="700">last_clock[0]=now</text><text x="468" y="167" font-size="10" fill="#999">เขียนทับ :68</text>
  </g>
  <path d="M380,86 C360,104 310,116 298,132" fill="none" stroke="#2e7d32" stroke-width="2" marker-end="url(#arc)" />
  <text x="342" y="104" font-size="10" fill="#2e7d32">read [0]</text>
  <path d="M468,132 C505,116 505,100 490,86" fill="none" stroke="#ef6c00" stroke-width="2" marker-end="url(#arc)" />
  <text x="512" y="120" font-size="10" fill="#ef6c00">write [0]</text>
  <rect x="586" y="24" width="300" height="172" rx="10" fill="#fffdf5" stroke="#cfa000" stroke-width="1.5" />
  <text x="600" y="46" font-size="13" font-weight="700" fill="#b8860b">ทำไมต้องห่อใน list?</text>
  <text x="600" y="70" font-size="12" fill="#444">closure แก้ค่าตัวแปร int</text>
  <text x="600" y="88" font-size="12" fill="#444">นอกขอบเขตตรง ๆ ไม่ได้</text>
  <text x="600" y="106" font-size="12" fill="#444">(ต้อง global / nonlocal)</text>
  <text x="600" y="130" font-size="12" fill="#2e7d32">แต่ list เป็น object เดียวกัน</text>
  <text x="600" y="148" font-size="12" fill="#2e7d32">→ แก้ของ "ข้างใน" ได้</text>
  <text x="600" y="166" font-size="12" fill="#2e7d32">last_clock[0]=now จึงเวิร์ก</text>
  <text x="600" y="188" font-size="11" fill="#999">= mutable state in closure</text>
</svg>
</div>
<blockquote>
<p><code>last_clock</code> ห่อเวลาไว้ใน <strong>list</strong> เพราะ closure แก้ค่า int นอกขอบเขตตรง ๆ ไม่ได้ แต่ list เป็น object เดียวกัน จึงแก้ <code>last_clock[0]</code> ข้ามเฟรมได้ (<code>flappy_step5.py:60,100</code> สร้าง · <code>:67-68</code> อ่าน/เขียน) — pattern เดียวกับ <code>bird_state = {...}</code> (<code>:61</code>) ที่ห่อ y/velocity/score ไว้ให้เฟรมแก้ได้</p>
</blockquote>
</section>

<p><code>flappy_step5</code> มี <strong>สองลูปซ้อนกัน</strong> — ลูปนอกคือ &quot;เครื่องเกม&quot; (เลือกโหมด→เล่น→กลับเมนู) หมุนช้า ๆ รอบละหลายวินาที · ลูปในคือ &quot;ฟิสิกส์&quot; หมุนเร็ว 60 ครั้ง/วินาที อยู่ข้างใน <code>play_round()</code></p>
<div style="font-size:13px;color:#607d8b;margin:2px 0 6px">⬭ เทา เริ่ม/จบ · ▭ ฟ้า ประมวลผล · ◇ ม่วง ตัดสินใจ · ▭ เขียว อ่านปุ่ม/วาดจอ · เส้นประ = วนกลับ</div>

<h1 id="%E0%B8%A7%E0%B8%B4%E0%B8%98%E0%B8%B5%E0%B8%A3%E0%B8%B1%E0%B8%99%E0%B8%9A%E0%B8%99%E0%B8%9A%E0%B8%AD%E0%B8%A3%E0%B9%8C%E0%B8%94-%E0%B9%80%E0%B8%9B%E0%B8%B4%E0%B8%94%E0%B9%83%E0%B8%99-bento-ide-%E2%86%92-program-to-device">วิธีรันบนบอร์ด: เปิดใน BENTO IDE → Program to Device</h1>

<ol>
<li>เปิด <code>flappy_step5.py</code> ใน <strong>BENTO IDE</strong></li>
<li>กด <strong>Program to Device</strong> ส่งโค้ดลงบอร์ด</li>
<li>บนจอจะขึ้นเมนู <code>MODE: &lt; NORMAL &gt;</code> — กด UP/DOWN เลือกโหมด, A เริ่มเล่น</li>
</ol>
<blockquote>
<p>เราไม่ใช้ <code>exec(open(...))</code> ในการรันนะ — บน BENTO ให้ใช้ปุ่ม <strong>Program to Device</strong> เสมอ มันจัดเรื่อง reset + โหลดไฟล์ให้เราครบ</p>
<p><strong>70% core ที่ต้องเขียนเอง:</strong> วัด <code>dt</code>, ฟิสิกส์ <code>*dt</code>, ลูป <code>choose_mode()</code>, อัปเดต <code>best_score</code></p>
</blockquote>
</section>

<h1 id="%E0%B8%9C%E0%B8%A5%E0%B8%9A%E0%B8%99%E0%B8%9A%E0%B8%AD%E0%B8%A3%E0%B9%8C%E0%B8%94%E0%B8%88%E0%B8%A3%E0%B8%B4%E0%B8%87-flappy-%E0%B9%80%E0%B8%A5%E0%B8%B7%E0%B8%AD%E0%B8%81%E0%B9%82%E0%B8%AB%E0%B8%A1%E0%B8%94%E0%B9%84%E0%B8%94%E0%B9%89">ผลบนบอร์ดจริง: Flappy เลือกโหมดได้</h1>

<blockquote>
<p>เมนู <code>MODE: &lt; NORMAL &gt;</code> กด UP/DOWN เปลี่ยน EASY/HARD แล้วกด A เริ่มเล่น<br />
มุมบนแสดง <code>แต้ม  Best: N  [โหมด]</code> — <code>Best:</code> ค้างข้ามรอบ</p>
<p>ลองเลือก HARD เทียบ EASY: ช่องท่อ (gap) แคบลง ท่อพุ่งเร็วขึ้น นกตกไวขึ้น เห็นความต่างทันที</p>
</blockquote>
</section>

<h1 id="%E0%B8%97%E0%B8%94%E0%B8%A5%E0%B8%AD%E0%B8%87%E0%B9%80%E0%B8%AD%E0%B8%87-%E0%B9%81%E0%B8%81%E0%B9%89%E0%B8%95%E0%B8%B2%E0%B8%A3%E0%B8%B2%E0%B8%87%E0%B9%82%E0%B8%AB%E0%B8%A1%E0%B8%94%E0%B9%83%E0%B8%AB%E0%B9%89-hard-%E0%B9%82%E0%B8%AB%E0%B8%94%E0%B8%82%E0%B8%B6%E0%B9%89%E0%B8%99">ทดลองเอง: แก้ตารางโหมดให้ HARD โหดขึ้น</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">    MODES = [
        (<span class="hljs-string">&quot;EASY&quot;</span>,   <span class="hljs-number">175</span>, <span class="hljs-number">200.0</span>,  <span class="hljs-number">900.0</span>, -<span class="hljs-number">360.0</span>),
        (<span class="hljs-string">&quot;NORMAL&quot;</span>, <span class="hljs-number">152</span>, <span class="hljs-number">240.0</span>, <span class="hljs-number">1100.0</span>, -<span class="hljs-number">390.0</span>),
        (<span class="hljs-string">&quot;HARD&quot;</span>,   <span class="hljs-number">100</span>, <span class="hljs-number">360.0</span>, <span class="hljs-number">1300.0</span>, -<span class="hljs-number">410.0</span>),  <span class="hljs-comment"># gap 120→100, speed 300→360</span>
    ]
</code></pre>

<blockquote>
<p>แก้แล้วเปิดใน BENTO IDE → <strong>Program to Device</strong> ใหม่ เลือก HARD จะเห็นช่องท่อแคบลงและท่อเร็วขึ้นชัดเจน</p>
<p>ลองเปลี่ยน <code>fps</code> ใน <code>game.run(on_each_frame, fps=60)</code> เป็น <code>fps=40</code> ดู — เพราะมี delta-time <strong>เกมยังเร็วเท่าเดิม</strong> นี่คือสิ่งที่ delta-time ให้เรา</p>
</blockquote>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="19" style="" data-marpit-pagination-total="30" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="20" style="--paginate:true;--theme:default;" data-marpit-pagination-total="30">
<h1 id="%E0%B8%81%E0%B8%B1%E0%B8%9A%E0%B8%94%E0%B8%B1%E0%B8%81%E0%B8%97%E0%B8%B5%E0%B9%88%E0%B9%80%E0%B8%88%E0%B8%AD%E0%B8%9A%E0%B9%88%E0%B8%AD%E0%B8%A2">กับดักที่เจอบ่อย</h1>
<svg width="660" height="200" xmlns="http://www.w3.org/2000/svg">
  <g font-size="13">
  <rect x="0" y="0" width="650" height="34" rx="5" fill="#fdeaea" />
  <text x="10" y="21" fill="#c0392b">ลืม * dt → นกแทบไม่ตก (ค่า grav เป็น "ต่อวินาที" ใหญ่กว่ามาก ต้องคูณ dt)</text>
  <rect x="0" y="40" width="650" height="34" rx="5" fill="#fdeaea" />
  <text x="10" y="61" fill="#c0392b">ลืม clamp dt &lt;= 0.05 → เฟรมค้างยาว นกกระโดดทะลุท่อในเฟรมเดียว</text>
  <rect x="0" y="80" width="650" height="34" rx="5" fill="#fdeaea" />
  <text x="10" y="101" fill="#c0392b">ไม่หน่วง sleep_ms หลังเลื่อนเมนู → กดทีเดียวเลื่อนรัวหลายโหมด</text>
  <rect x="0" y="120" width="650" height="34" rx="5" fill="#fdeaea" />
  <text x="10" y="141" fill="#c0392b">ลืม game.clear() ต้นหน้าจอใหม่ → กล่องรอบก่อนค้าง ชนเพดาน 32 sprite</text>
  <rect x="0" y="160" width="650" height="34" rx="5" fill="#fdeaea" />
  <text x="10" y="181" fill="#c0392b">best_score อยู่ในฟังก์ชันเล่น → รีเซ็ตทุกรอบ ต้องวางไว้ระดับ module + global</text>
  </g>
</svg>
<blockquote>
<p>ถ้านกขยับกระตุก ลองเช็คว่าเรียก <code>bird.move_to(bird.x, bird_state[&quot;y&quot;])</code> หลังคำนวณ <code>y</code> เสร็จแล้วหรือยัง</p>
</blockquote>
