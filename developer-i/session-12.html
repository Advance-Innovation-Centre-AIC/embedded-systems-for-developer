<h1 id="%E0%B8%84%E0%B8%B2%E0%B8%9A-12--shooter-3">คาบ 12 — Shooter #3</h1>
<h2 id="%E0%B8%A8%E0%B8%B1%E0%B8%95%E0%B8%A3%E0%B8%B9--wave--%E0%B8%84%E0%B8%A7%E0%B8%B2%E0%B8%A1%E0%B8%A2%E0%B8%B2%E0%B8%81">ศัตรู + wave + ความยาก</h2>
<p><strong>เกม Shooter ก้าวสุดท้าย — วันนี้เล่นจบรอบได้จริง (MVP-2)</strong></p>
<blockquote>
<p>คาบที่แล้วยานของเราเลื่อนซ้าย-ขวาและยิงกระสุนจากบ่อได้แล้ว วันนี้เราจะเติม &quot;ศัตรู&quot; ที่ตกลงมา กติกาคะแนน/ชีวิต และ wave ที่ค่อย ๆ ยากขึ้น พอครบชุดนี้ <strong>Shooter ก็เป็นเกมเต็มที่เล่นเอาชนะกันได้</strong></p>
</blockquote>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-class="cover" data-theme="default" lang="C" class="cover" data-marpit-pagination="1" style="" data-marpit-pagination-total="31" data-marpit-advanced-background="pseudo"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="2" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="2" style="--paginate:true;--theme:default;" data-marpit-pagination-total="31">
<h1 id="%E0%B9%80%E0%B8%9B%E0%B9%89%E0%B8%B2%E0%B8%AB%E0%B8%A1%E0%B8%B2%E0%B8%A2%E0%B8%84%E0%B8%B2%E0%B8%9A%E0%B8%99%E0%B8%B5%E0%B9%89">เป้าหมายคาบนี้</h1>
<p>วันนี้เราจะปิดเกม Shooter ให้สมบูรณ์ โดยจับ 3 เรื่องทีละก้าว:</p>
<ol>
<li><strong>spawn ศัตรู</strong> — สร้างบ่อศัตรูครั้งเดียว ให้ตกจากฟ้าด้วยความเร็วสุ่ม แล้วรีไซเคิลกลับขึ้นบน</li>
<li><strong>many-vs-many collision</strong> — กระสุนทุกนัด × ศัตรูทุกตัว ใครชนใคร ได้คะแนน</li>
<li><strong>wave / ความยาก</strong> — เล่นไปเรื่อย ๆ ศัตรูตกเร็วขึ้น เกมท้าทายขึ้น</li>
</ol>
<p><img src="img/shooter_goals.png" alt="" style="width:760px;" /></p>
<blockquote>
<p>ปลายทางที่อยากเห็น: กด A ยิงขึ้น ยิงโดนศัตรู +1 คะแนน ศัตรูหลุดถึงพื้นเสียชีวิต ชีวิตหมดขึ้น <strong>GAME OVER</strong> — นี่คือ <strong>MVP-2</strong> เกม Shooter ที่เล่นจบรอบได้</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="3" style="--paginate:true;--theme:default;" data-marpit-pagination-total="31">
<h1 id="visible-win--%E0%B8%AA%E0%B8%B4%E0%B9%88%E0%B8%87%E0%B8%97%E0%B8%B5%E0%B9%88%E0%B9%80%E0%B8%A3%E0%B8%B2%E0%B8%88%E0%B8%B0%E0%B9%80%E0%B8%AB%E0%B9%87%E0%B8%99%E0%B8%9A%E0%B8%99%E0%B8%88%E0%B8%AD">visible win — สิ่งที่เราจะเห็นบนจอ</h1>
<div style="display:flex;gap:16px;">
<div style="flex:1;border:2px solid #2196F3;border-radius:10px;padding:12px;">
<b>ศัตรูตกจากฟ้า</b><br />
กล่องสี (แดง/ส้ม/ชมพู) ร่วงลงมาทีละตัว เร็วช้าต่างกัน
</div>
<div style="flex:1;border:2px solid #F44336;border-radius:10px;padding:12px;">
<b>กติกาครบ</b><br />
ยิงโดน = +1 คะแนน · หลุดพื้น = เสีย 1 ชีวิต · ชีวิตหมด = GAME OVER
</div>
</div>
<p style="text-align:center;margin:8px 0;"><img src="img/shooter_gameplay.gif" width="440" /></p>
<div style="text-align:center;font-size:0.74em;margin-top:-4px">ลูปจริงวนซ้ำ: ศัตรูร่วง → เลเซอร์ยิงโดน → Score +1 → หลุดพื้น = Lives ลด → GAME OVER</div>
<blockquote>
<p><strong>visible win:</strong> กด A แล้วเลเซอร์พุ่งขึ้น ยิงโดนศัตรูได้คะแนน +1 ถ้าศัตรูหลุดลงล่างชีวิตจะลด เมื่อชีวิตหมดจะขึ้น <strong>GAME OVER</strong> สีแดงกลางจอ — อย่างในคลิปบนนี้ที่วนเล่นอยู่</p>
</blockquote>
<p><strong>MVP-2:</strong> Shooter ที่เล่นจบรอบได้ พอถึงตรงนี้เราก็มีครบทั้ง Snake / Flappy / Shooter</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="4" style="--paginate:true;--theme:default;" data-marpit-pagination-total="31">
<h1 id="%E0%B8%AB%E0%B8%B1%E0%B8%A7%E0%B9%83%E0%B8%88%E0%B8%84%E0%B8%B2%E0%B8%9A%E0%B8%99%E0%B8%B5%E0%B9%89--%E0%B8%A3%E0%B8%B5%E0%B9%84%E0%B8%8B%E0%B9%80%E0%B8%84%E0%B8%B4%E0%B8%A5%E0%B8%A8%E0%B8%B1%E0%B8%95%E0%B8%A3%E0%B8%B9-%E0%B9%80%E0%B8%AB%E0%B8%A1%E0%B8%B7%E0%B8%AD%E0%B8%99%E0%B8%9A%E0%B9%88%E0%B8%AD%E0%B8%81%E0%B8%A3%E0%B8%B0%E0%B8%AA%E0%B8%B8%E0%B8%99">หัวใจคาบนี้ — รีไซเคิลศัตรู (เหมือนบ่อกระสุน)</h1>
<svg viewBox="0 0 760 230" width="100%" font-family="sans-serif" font-size="14">
  <rect x="20" y="20" width="200" height="190" rx="10" fill="#FFEBEE" stroke="#F44336" />

  <rect x="50" y="60" width="40" height="30" fill="#F44336" />
  <rect x="100" y="60" width="40" height="30" fill="#FF9800" />
  <rect x="150" y="60" width="40" height="30" fill="#E91E63" />
  <rect x="50" y="110" width="40" height="30" fill="#FF9800" />
  <rect x="100" y="110" width="40" height="30" fill="#F44336" />
  <rect x="150" y="110" width="40" height="30" fill="#E91E63" />
  <text x="120" y="175" text-anchor="middle" font-size="12">6 ตัว สีต่างกัน ความเร็วต่างกัน</text>
  <path d="M240 90 h80" stroke="#333" stroke-width="2" marker-end="url(#a)" />
  <text x="280" y="80" text-anchor="middle">ตกลง</text>
  <path d="M560 145 h-80" stroke="#333" stroke-width="2" marker-end="url(#a)" />
  <text x="520" y="170" text-anchor="middle">respawn()</text>
  <rect x="330" y="40" width="410" height="150" rx="10" fill="#FFF3E0" stroke="#FF9800" />

  <text x="535" y="100" text-anchor="middle">ตกถึงพื้น = เสียชีวิต → เกิดใหม่บนสุด</text>

  <defs><marker markerUnits="userSpaceOnUse" id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 z" fill="#333" /></marker></defs>
</svg>
<blockquote>
<p>ศัตรูใช้ pattern เดียวกับบ่อกระสุนคาบที่แล้ว ของหมดอายุไม่ลบทิ้ง แต่ &quot;ส่งกลับขึ้นบน&quot; มาใช้ใหม่ จำนวน widget จึงคงที่เสมอ</p>
</blockquote>
</section>

<h1 id="%E0%B9%80%E0%B8%81%E0%B8%A3%E0%B9%87%E0%B8%94-%E0%B8%82%E0%B8%AD%E0%B8%87%E0%B8%88%E0%B8%A3%E0%B8%B4%E0%B8%87--space-invaders-1978">เกร็ด: ของจริง — Space Invaders (1978)</h1>

<p>เกมยิงต้นแบบของวงการ ตู้นี้ทำมาตั้งแต่ปี 1978 ดูที่จอสิ — <strong>ศัตรูเรียงเป็นแถวไล่ลงมา</strong> ตรงกับ <code>enemies</code> ที่เราสร้างวันนี้เป๊ะ</p>
<ul>
<li>ฮาร์ดแวร์ยุคนั้นมี RAM น้อยมาก ศัตรูจึงเป็น <strong>ชุดตายตัวที่ reuse</strong> ไม่ได้สร้าง-ลบทิ้งทุกตัว — นี่คือ pool pattern เดียวกับบ่อศัตรูของเรา</li>
<li>ยิ่งเหลือศัตรูน้อย ตัวที่เหลือ <strong>ยิ่งเลื่อนเร็วขึ้น</strong> — wave / ความยากที่ค่อย ๆ เพิ่ม เกิดมาคู่กับเกมยิงตั้งแต่วันแรก</li>
</ul>
<blockquote>
<p>เกร็ดสนุก: ตอนนั้นเครื่องวาดศัตรูทีละตัว พอตัวถูกยิงหายไป งานวาดต่อเฟรมน้อยลง CPU เลยวาดได้ไว — เกมเร็วขึ้นเอง &quot;โดยบังเอิญ&quot; จนกลายเป็นกติกาคลาสสิก</p>
</blockquote>
<p><sub>ที่มา: &quot;Space Invaders&quot; — Tomomarusan, CC BY 2.5, Wikimedia Commons</sub></p>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="5" style="" data-marpit-pagination-total="31" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="6" style="--paginate:true;--theme:default;" data-marpit-pagination-total="31">
<h1 id="7030--%E0%B8%82%E0%B8%AD%E0%B8%87%E0%B8%97%E0%B8%B5%E0%B9%88-engine-%E0%B9%83%E0%B8%AB%E0%B9%89%E0%B8%A1%E0%B8%B2-vs-%E0%B8%97%E0%B8%B5%E0%B9%88%E0%B9%80%E0%B8%A3%E0%B8%B2%E0%B9%80%E0%B8%82%E0%B8%B5%E0%B8%A2%E0%B8%99">70/30 — ของที่ engine ให้มา vs ที่เราเขียน</h1>
<div style="display:flex;gap:16px;">
<div style="flex:7;border:2px solid #4CAF50;border-radius:10px;padding:12px;background:#E8F5E9;">
<b>70% core (engine ให้มา)</b><br />
<code>game.Box</code> · <code>box.show()/.hide()</code> ·<br />
<code>box.move_to()</code> · <code>box.set_color()</code> ·<br />
<code>game.hit(a,b)</code> · <code>game.sfx()</code> · <code>text.set()</code>
</div>
<div style="flex:3;border:2px solid #FF9800;border-radius:10px;padding:12px;background:#FFF3E0;">
<b>30% ที่เราเขียน</b><br />
spawn ศัตรู · ศัตรูตก · ชน · นับคะแนน · นับชีวิต · จบเกม
</div>
</div>
<svg viewBox="0 0 760 96" width="100%" font-family="sans-serif" font-size="14">
  <rect x="10" y="22" width="518" height="48" rx="8" fill="#E8F5E9" stroke="#4CAF50" stroke-width="2" />
  <text x="269" y="42" text-anchor="middle" font-weight="bold" fill="#2E7D32">engine ให้มา</text>
  <text x="269" y="60" text-anchor="middle" fill="#2E7D32">70% — verb พร้อมใช้</text>
  <rect x="538" y="22" width="212" height="48" rx="8" fill="#FFF3E0" stroke="#FF9800" stroke-width="2" />
  <text x="644" y="42" text-anchor="middle" font-weight="bold" fill="#E65100">กติกาในหัวเรา</text>
  <text x="644" y="60" text-anchor="middle" fill="#E65100">30% — เกมของน้อง ๆ</text>
  <text x="10" y="16" font-size="11" fill="#777">0%</text>
  <text x="500" y="16" font-size="11" fill="#777">70%</text>
  <text x="734" y="16" font-size="11" fill="#777">100%</text>
  <path d="M450 86 H 620" stroke="#555" stroke-width="2" marker-end="url(#sb)" />
  <text x="535" y="84" text-anchor="middle" font-size="12" fill="#555">verb ส่งต่อ</text>
  <defs><marker markerUnits="userSpaceOnUse" id="sb" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6 z" fill="#555" /></marker></defs>
</svg>
<blockquote>
<p>30% คือ &quot;กติกาในหัว&quot; เป็นส่วนที่น้อง ๆ <strong>เป็นเจ้าของ</strong> เอง engine แค่ยื่นเครื่องมือให้ — สังเกตแถบ: ฝั่งเขียวกว้างกว่า เพราะ engine แบกงานหนักให้ 70% แล้ว</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="7" style="--paginate:true;--theme:default;" data-marpit-pagination-total="31">
<h1 id="step-1--%E0%B8%AA%E0%B8%A3%E0%B9%89%E0%B8%B2%E0%B8%87%E0%B8%9A%E0%B9%88%E0%B8%AD%E0%B8%A8%E0%B8%B1%E0%B8%95%E0%B8%A3%E0%B8%B9--%E0%B8%84%E0%B8%A7%E0%B8%B2%E0%B8%A1%E0%B9%80%E0%B8%A3%E0%B9%87%E0%B8%A7%E0%B8%AA%E0%B8%B8%E0%B9%88%E0%B8%A1">STEP 1 — สร้างบ่อศัตรู + ความเร็วสุ่ม</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">import</span> bentogame <span class="hljs-keyword">as</span> game
<span class="hljs-keyword">import</span> random

MAX_ENEMIES = <span class="hljs-number">6</span>
ENEMY_COLORS = [game.RED, game.ORANGE, game.PINK]

<span class="hljs-comment"># บ่อศัตรู — สร้างครั้งเดียว นอก on_frame เริ่มที่ y ติดลบสุ่ม (เหนือจอ)</span>
enemies = [game.Box(random.randint(<span class="hljs-number">0</span>, game.WIDTH - <span class="hljs-number">30</span>),
                    -random.randint(<span class="hljs-number">40</span>, <span class="hljs-number">400</span>), <span class="hljs-number">30</span>, <span class="hljs-number">24</span>,
                    random.choice(ENEMY_COLORS)) <span class="hljs-keyword">for</span> _ <span class="hljs-keyword">in</span> <span class="hljs-built_in">range</span>(MAX_ENEMIES)]
<span class="hljs-comment"># ความเร็วตกของแต่ละตัว สุ่มให้ไม่เท่ากัน</span>
enemy_speed = [random.uniform(<span class="hljs-number">2.5</span>, <span class="hljs-number">4.5</span>) <span class="hljs-keyword">for</span> _ <span class="hljs-keyword">in</span> <span class="hljs-built_in">range</span>(MAX_ENEMIES)]
</code></pre>
<p>ศัตรูแต่ละตัวเริ่มเหนือจอ (y ติดลบสุ่ม) + ความเร็วสุ่มในช่วง:</p>
<p><span is="marp-span" data-auto-scaling="downscale-only" class="katex-display"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><msub><mi>y</mi><mn>0</mn></msub><mo>∈</mo><mo stretchy="false">[</mo><mo>−</mo><mn>400</mn><mo separator="true">,</mo><mtext> </mtext><mo>−</mo><mn>40</mn><mo stretchy="false">]</mo><mo separator="true">,</mo><mspace width="2em"/><msub><mi>v</mi><mtext>enemy</mtext></msub><mo>∼</mo><mi mathvariant="script">U</mi><mo stretchy="false">(</mo><mn>2.5</mn><mo separator="true">,</mo><mtext> </mtext><mn>4.5</mn><mo stretchy="false">)</mo><mtext> px/frame</mtext></mrow><annotation encoding="application/x-tex">y_0 \in [-400,\ -40], \qquad v_{\text{enemy}} \sim \mathcal{U}(2.5,\ 4.5)\ \text{px/frame} 
</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.7335em;vertical-align:-0.1944em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0359em;">y</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3011em;"><span style="top:-2.55em;margin-left:-0.0359em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight">0</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">∈</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:1.0361em;vertical-align:-0.2861em;"></span><span class="mopen">[</span><span class="mord">−</span><span class="mord">400</span><span class="mpunct">,</span><span class="mspace"> </span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord">−</span><span class="mord">40</span><span class="mclose">]</span><span class="mpunct">,</span><span class="mspace" style="margin-right:2em;"></span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0359em;">v</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.1514em;"><span style="top:-2.55em;margin-left:-0.0359em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord text mtight"><span class="mord mtight">enemy</span></span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.2861em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">∼</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathcal" style="margin-right:0.0993em;">U</span><span class="mopen">(</span><span class="mord">2.5</span><span class="mpunct">,</span><span class="mspace"> </span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord">4.5</span><span class="mclose">)</span><span class="mspace"> </span><span class="mord text"><span class="mord">px/frame</span></span></span></span></span></span></p><blockquote>
<p>ที่ให้แต่ละตัวเร็วต่างกันด้วย <code>random.uniform</code> ก็เพื่อให้ศัตรูดูมีชีวิต ไม่ตกลงมาเป็นแถวเดียวกันน่าเบื่อ</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="8" style="--paginate:true;--theme:default;" data-marpit-pagination-total="31">
<h1 id="step-2--%E0%B8%A3%E0%B8%B5%E0%B9%84%E0%B8%8B%E0%B9%80%E0%B8%84%E0%B8%B4%E0%B8%A5%E0%B8%A8%E0%B8%B1%E0%B8%95%E0%B8%A3%E0%B8%B9-%E0%B8%AA%E0%B9%88%E0%B8%87%E0%B8%81%E0%B8%A5%E0%B8%B1%E0%B8%9A%E0%B8%82%E0%B8%B6%E0%B9%89%E0%B8%99%E0%B8%9A%E0%B8%99">STEP 2 — รีไซเคิลศัตรู (ส่งกลับขึ้นบน)</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">def</span> <span class="hljs-title function_">respawn_enemy</span>(<span class="hljs-params">index</span>):
    <span class="hljs-comment"># ย้ายศัตรูตัวที่ index กลับขึ้นไปเริ่มใหม่เหนือจอ</span>
    enemies[index].move_to(random.randint(<span class="hljs-number">0</span>, game.WIDTH - <span class="hljs-number">30</span>),
                           -random.randint(<span class="hljs-number">20</span>, <span class="hljs-number">200</span>))
    enemies[index].set_color(random.choice(ENEMY_COLORS))   <span class="hljs-comment"># สุ่มสีใหม่</span>
</code></pre>
<p><svg viewBox="0 0 700 70" width="80%"><rect x="10" y="10" width="680" height="50" rx="8" fill="#FFEBEE" stroke="#F44336" /><text x="350" y="32" text-anchor="middle" font-family="sans-serif" font-size="15">โดนยิง / หลุดพื้น → <tspan font-weight="bold">respawn_enemy(index)</tspan></text><text x="350" y="50" text-anchor="middle" font-family="sans-serif" font-size="13">ไม่สร้างกล่องใหม่ — ย้ายตัวเดิมกลับขึ้นบน</text></svg></p>
<blockquote>
<p>เรียก <code>respawn_enemy()</code> ได้ 2 จังหวะ: ตอนศัตรูหลุดพื้น (เสียชีวิต) และตอนโดนยิง (ได้คะแนน) ทั้งสองกรณีคือ &quot;ส่งกลับขึ้นบน&quot; เหมือนกัน</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="9" style="--paginate:true;--theme:default;" data-marpit-pagination-total="31">
<h1 id="step-3--%E0%B8%95%E0%B8%B2%E0%B8%99%E0%B9%89%E0%B8%AD%E0%B8%87-%E0%B9%86-%E0%B9%80%E0%B8%82%E0%B8%B5%E0%B8%A2%E0%B8%99-30-%E0%B8%A8%E0%B8%B1%E0%B8%95%E0%B8%A3%E0%B8%B9%E0%B8%95%E0%B8%81--%E0%B8%8A%E0%B8%99">STEP 3 — ตาน้อง ๆ เขียน 30%: ศัตรูตก + ชน</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">    <span class="hljs-comment"># วนศัตรูทุกตัว (ต้องการทั้ง index และตัว enemy → ใช้ enumerate)</span>
    <span class="hljs-keyword">for</span> index, enemy <span class="hljs-keyword">in</span> <span class="hljs-built_in">enumerate</span>(enemies):
        enemy.move_to(enemy.x, enemy.y + enemy_speed[index])  <span class="hljs-comment"># ตกลงตามความเร็วตัวมัน</span>
        <span class="hljs-keyword">if</span> enemy.y &gt; game.HEIGHT:              <span class="hljs-comment"># หลุดถึงล่าง = เสียชีวิต</span>
            lives -= <span class="hljs-number">1</span>
            hud.<span class="hljs-built_in">set</span>(<span class="hljs-string">&quot;Score: %d   Lives: %d&quot;</span> % (score, lives))
            respawn_enemy(index)
            <span class="hljs-keyword">if</span> lives &lt;= <span class="hljs-number">0</span>:
                game.sfx(<span class="hljs-string">&quot;gameover&quot;</span>)
                game.Text(<span class="hljs-string">&quot;GAME OVER&quot;</span>, <span class="hljs-number">320</span>, <span class="hljs-number">180</span>, game.RED)
                <span class="hljs-keyword">return</span> <span class="hljs-literal">False</span>                   <span class="hljs-comment"># หยุดเกม</span>
            <span class="hljs-keyword">continue</span>
        <span class="hljs-keyword">for</span> bullet <span class="hljs-keyword">in</span> bullets:                 <span class="hljs-comment"># นัดไหนโดนศัตรูตัวนี้?</span>
            <span class="hljs-keyword">if</span> bullet.y &gt;= -<span class="hljs-number">20</span> <span class="hljs-keyword">and</span> game.hit(bullet, enemy):
                score += <span class="hljs-number">1</span>; game.sfx(<span class="hljs-string">&quot;hit&quot;</span>)
                hud.<span class="hljs-built_in">set</span>(<span class="hljs-string">&quot;Score: %d   Lives: %d&quot;</span> % (score, lives))
                bullet.move_to(<span class="hljs-number">0</span>, -<span class="hljs-number">50</span>); bullet.hide()   <span class="hljs-comment"># กระสุนกลับบ่อ</span>
                respawn_enemy(index); <span class="hljs-keyword">break</span>             <span class="hljs-comment"># อย่าลืม break!</span>
</code></pre>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="10" style="--paginate:true;--theme:default;" data-marpit-pagination-total="31">
<h1 id="%E0%B9%80%E0%B8%AA%E0%B8%B5%E0%B8%A2%E0%B8%87%E0%B8%82%E0%B8%AD%E0%B8%87%E0%B9%80%E0%B8%81%E0%B8%A1-shooter">เสียงของเกม Shooter</h1>
<p>โค้ดเมื่อกี้เรียก <code>game.sfx(&quot;hit&quot;)</code> ตอนยิงโดน และ <code>game.sfx(&quot;gameover&quot;)</code> ตอนชีวิตหมด — บวกเสียงยิงตอนกด A เกมยิงจึงมี 3 เสียงหลักที่บอกผู้เล่นว่าเกิดอะไรขึ้นโดยไม่ต้องอ่านตัวเลข</p>
<blockquote>
<p><strong>เสียงในคาบนี้</strong> — Shooter ใช้เสียงตอนยิงกระสุน (<code>fire</code>) ตอนยิงโดนศัตรู (<code>hit</code>) และตอน GAME OVER (กดเล่นฟังได้จริง):</p>
</blockquote>
<div style="display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap;font-size:0.72em;margin:8px 0">
<span style="text-align:center"><b>sfx_shoot_fire</b> <span style="color:#4CAF50">(สั้น)</span><br /><img src="img/sfx_shoot_fire.png" width="170" style="border-radius:4px;margin:2px 0" /><br /><audio controls src="img/sfx_shoot_fire.mp3" style="height:30px;width:170px"></audio><br /><img src="img/sfx_shoot_fire_zoom.png" style="width:160px;border-radius:4px;margin-top:3px" /></span>
<span style="text-align:center"><b>sfx_shoot_hit</b> <span style="color:#4CAF50">(สั้น)</span><br /><img src="img/sfx_shoot_hit.png" width="170" style="border-radius:4px;margin:2px 0" /><br /><audio controls src="img/sfx_shoot_hit.mp3" style="height:30px;width:170px"></audio><br /><img src="img/sfx_shoot_hit_zoom.png" style="width:160px;border-radius:4px;margin-top:3px" /></span>
<span style="text-align:center"><b>sfx_game_over</b> <span style="color:#FF9800">(ยาว)</span><br /><img src="img/sfx_game_over.png" width="170" style="border-radius:4px;margin:2px 0" /><br /><audio controls src="img/sfx_game_over.mp3" style="height:30px;width:170px"></audio><br /><img src="img/sfx_game_over_zoom.png" style="width:160px;border-radius:4px;margin-top:3px" /></span>
<span style="min-width:170px;padding-bottom:4px">รูปคลื่นบนปุ่มเล่นคือ "หน้าตา" ของเสียง — `fire`/`hit` แหลมแล้วเงียบไว ส่วน `game_over` ลากยาว<br />ฟังครบ 21 ตัว + ซูม/spectrogram → <a href="img/sound_video_demo.html"><b>Sound Explorer</b></a></span>
</div>
<blockquote>
<p>เสียงสั้น-คม (<code>fire</code>/<code>hit</code> ราว 1–2 KB) ทำหน้าที่เป็น feedback ทันใจทุกครั้งที่ยิง ส่วน <code>game_over</code> ยาวกว่าเพื่อปิดจังหวะรอบเกม — ลองฟังเทียบความสั้น-ยาวกับบทบาทของมันในเกม</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="11" style="--paginate:true;--theme:default;" data-marpit-pagination-total="31">
<h1 id="many-vs-many--%E0%B8%81%E0%B8%A3%E0%B8%B0%E0%B8%AA%E0%B8%B8%E0%B8%99%E0%B8%97%E0%B8%B8%E0%B8%81%E0%B8%99%E0%B8%B1%E0%B8%94-%C3%97-%E0%B8%A8%E0%B8%B1%E0%B8%95%E0%B8%A3%E0%B8%B9%E0%B8%97%E0%B8%B8%E0%B8%81%E0%B8%95%E0%B8%B1%E0%B8%A7">many-vs-many — กระสุนทุกนัด × ศัตรูทุกตัว</h1>
<p>ในเฟรมเดียว เราต้องถามว่า <strong>กระสุนนัดไหน ชนศัตรูตัวไหน</strong> — เป็น loop ซ้อน loop:</p>
<svg viewBox="0 0 720 170" width="100%" font-family="sans-serif" font-size="13">
  <text x="20" y="30" font-weight="bold">enemies (6)</text>
  <rect x="20" y="40" width="34" height="24" fill="#F44336" />
  <rect x="60" y="40" width="34" height="24" fill="#FF9800" />
  <rect x="100" y="40" width="34" height="24" fill="#E91E63" />
  <text x="150" y="58">…</text>
  <text x="20" y="110" font-weight="bold">bullets (6)</text>
  <rect x="20" y="120" width="12" height="26" fill="#00BCD4" />
  <rect x="40" y="120" width="12" height="26" fill="#00BCD4" />
  <rect x="60" y="120" width="12" height="26" fill="#00BCD4" />
  <text x="100" y="140">…</text>
  <rect x="360" y="30" width="340" height="120" rx="10" fill="#FFF3E0" stroke="#FF9800" />
  <text x="530" y="60" text-anchor="middle" font-weight="bold">for enemy in enemies:</text>
  <text x="530" y="88" text-anchor="middle">    for bullet in bullets:</text>
  <text x="530" y="116" text-anchor="middle">        if game.hit(bullet, enemy): ...</text>
  <text x="530" y="142" text-anchor="middle" font-style="italic">6 × 6 = 36 คู่ / เฟรม</text>
</svg>
<p><span is="marp-span" data-auto-scaling="downscale-only" class="katex-display"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi>N</mi><mo>=</mo><mi mathvariant="normal">∣</mi><mtext>bullets</mtext><mi mathvariant="normal">∣</mi><mo>×</mo><mi mathvariant="normal">∣</mi><mtext>enemies</mtext><mi mathvariant="normal">∣</mi><mo>=</mo><mn>6</mn><mo>×</mo><mn>6</mn><mo>=</mo><mn>36</mn><mtext> คู่/เฟรม</mtext></mrow><annotation encoding="application/x-tex">N = |\text{bullets}| \times |\text{enemies}| = 6 \times 6 = 36 \ \text{คู่/เฟรม} 
</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.109em;">N</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord">∣</span><span class="mord text"><span class="mord">bullets</span></span><span class="mord">∣</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">×</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord">∣</span><span class="mord text"><span class="mord">enemies</span></span><span class="mord">∣</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.7278em;vertical-align:-0.0833em;"></span><span class="mord">6</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">×</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">6</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord">36</span><span class="mspace"> </span><span class="mord text"><span class="mord brahmic_fallback">คู่</span><span class="mord">/</span><span class="mord brahmic_fallback">เฟรม</span></span></span></span></span></span></p><blockquote>
<p>นี่คือ verb เดียวกับ Catch (คาบ 3), Snake (คาบ 5), Flappy (คาบ 10) เกมต่างกัน แต่คณิตเบื้องหลังเป็นเรื่องเดิมที่น้อง ๆ รู้อยู่แล้ว — แค่คราวนี้เช็คหลายคู่พร้อมกัน</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="12" style="--paginate:true;--theme:default;" data-marpit-pagination-total="31">
<h1 id="aabb-collision--%E0%B8%81%E0%B8%A3%E0%B8%B0%E0%B8%AA%E0%B8%B8%E0%B8%99-%C3%97-%E0%B8%A8%E0%B8%B1%E0%B8%95%E0%B8%A3%E0%B8%B9">AABB collision — กระสุน × ศัตรู</h1>
<p><code>game.hit(bullet, enemy)</code> คืน True เมื่อกล่อง <strong>ซ้อนทับ</strong> ทั้งแกน x และ y:</p>
<p><span is="marp-span" data-auto-scaling="downscale-only" class="katex-display"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><msub><mtext>overlap</mtext><mi>x</mi></msub><mo>:</mo><mtext> </mtext><msub><mi>b</mi><mi>x</mi></msub><mo>&lt;</mo><msub><mi>e</mi><mi>x</mi></msub><mo>+</mo><msub><mi>e</mi><mi>w</mi></msub><mtext> </mtext><mo>∧</mo><mtext> </mtext><msub><mi>e</mi><mi>x</mi></msub><mo>&lt;</mo><msub><mi>b</mi><mi>x</mi></msub><mo>+</mo><msub><mi>b</mi><mi>w</mi></msub></mrow><annotation encoding="application/x-tex">\text{overlap}_x:\ b_x &lt; e_x + e_w \ \wedge\ e_x &lt; b_x + b_w

<p><span is="marp-span" data-auto-scaling="downscale-only" class="katex-display"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mtext>เช็คชน</mtext><mtext>  </mtext><mo>⟺</mo><mtext>  </mtext><msub><mi>b</mi><mi>y</mi></msub><mo>≥</mo><mo>−</mo><mn>20</mn><mtext> </mtext><mo>∧</mo><mtext> hit</mtext><mo stretchy="false">(</mo><mi>b</mi><mo separator="true">,</mo><mi>e</mi><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">\text{เช็คชน} \iff b_y \ge -20 \ \wedge\ \text{hit}(b, e)

-right:0.1667em;"></span><span class="mord mathnormal">e</span><span class="mclose">)</span></span></span></span></span></p><blockquote>

</blockquote>
<blockquote>
<p><strong>ทฤษฎี → โค้ด (bridge):</strong> อสมการข้างบนคือสิ่งที่ <code>game.hit()</code> ทำให้ ต้นฉบับ Python จริงอยู่ในเกมเต็ม <code>full_games/shooter_full.py:48-50</code> — <code>overlap(ax,ay,aw,ah, ox,oy,ow,oh)</code> เขียนแบบกลับด้าน (De Morgan): <code>return not (ax+aw &lt; ox or ax &gt; ox+ow or ay+ah &lt; oy or ay &gt; oy+oh)</code> (<code>:50</code>) — พิสูจน์ว่า &quot;ไม่ซ้อน&quot; 4 กรณีแล้ว <code>not</code> กลับผล เกมเต็มเรียกมัน 2 จุด: กระสุน×ศัตรู <code>:237</code> และ ยาน×ศัตรู <code>:250</code></p>

<h1 id="step-4--wave--%E0%B8%84%E0%B8%A7%E0%B8%B2%E0%B8%A1%E0%B8%A2%E0%B8%B2%E0%B8%81%E0%B8%84%E0%B9%88%E0%B8%AD%E0%B8%A2-%E0%B9%86-%E0%B9%80%E0%B8%9E%E0%B8%B4%E0%B9%88%E0%B8%A1">STEP 4 — wave / ความยากค่อย ๆ เพิ่ม</h1>
<div style="border:2px solid #2e7d32;border-radius:8px;padding:6px 12px;background:#e8f5e9;font-size:0.82em;margin-bottom:8px">
<b>มีไฟล์เฉลยแล้ว — <code>solution_codes/shooter_step5.py</code>:</b> แนวคิด "ปรับความยากได้ + ศัตรูมาเป็นคลื่น" คือ <b>step5</b> ที่ต่อจาก step4 จริง ๆ ไม่ใช่ของแถมลอย ๆ. step5 ทำความยากด้วย <b>ตารางโหมด</b> <code>MODES</code> (FREE/EASY/DIFFICULT, <code>shooter_step5.py:44-47</code>) เลือกด้วยตัวแปร <code>MODE</code> (<code>:49-50</code>) และปล่อยศัตรูเป็นคลื่นด้วย <b>spawn timer</b> (<code>:101-106</code>) ทีละตัวตามจังหวะ <code>SPAWN_DELAY</code> ของโหมด — คนละกลไกกับสูตร <code>min(9.0, base+0.15·score)</code> ด้านล่าง (อันนั้นเป็น variant ให้ลองเล่นสมการ ไม่ได้อยู่ในไฟล์). ส่วนที่ยังเป็น <b>C-native</b> ล้วน (ตาม header <code>:5-10</code>): ระเบิด-pool, sprites pixel-art, backing music, scanline skin, และ <b>เมนูเลือกโหมดบนจอ</b> — ฝั่ง Python เลือกโหมดผ่านตัวแปร <code>MODE</code> แทน
</div>
<p>อยากให้เกมยากขึ้นเรื่อย ๆ? แนวคิดหนึ่งคือ ทุกครั้งที่ respawn ศัตรู ให้ <strong>เพิ่มความเร็ว</strong> ตามคะแนน:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">def</span> <span class="hljs-title function_">respawn_enemy</span>(<span class="hljs-params">index</span>):                     <span class="hljs-comment"># เวอร์ชันต่อยอด — เพิ่มจาก step4 :41-43</span>
    enemies[index].move_to(random.randint(<span class="hljs-number">0</span>, game.WIDTH - <span class="hljs-number">30</span>),
                           -random.randint(<span class="hljs-number">20</span>, <span class="hljs-number">200</span>))
    enemies[index].set_color(random.choice(ENEMY_COLORS))
    <span class="hljs-comment"># wave: ยิ่งคะแนนมาก ศัตรูยิ่งตกเร็ว (มีเพดานกันเร็วเกินเล่นไม่ทัน)</span>
    base = random.uniform(<span class="hljs-number">2.5</span>, <span class="hljs-number">4.5</span>)
    enemy_speed[index] = <span class="hljs-built_in">min</span>(<span class="hljs-number">9.0</span>, base + score * <span class="hljs-number">0.15</span>)   <span class="hljs-comment"># +0.15 ต่อ 1 คะแนน</span>
</code></pre>
<p>ความเร็วเป้าหมายเป็นฟังก์ชันของคะแนน (มี clamp กันพุ่งเกิน):</p>
<p><span is="marp-span" data-auto-scaling="downscale-only" class="katex-display"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><msub><mi>v</mi><mtext>enemy</mtext></msub><mo>=</mo><mi>min</mi><mo>⁡</mo><mtext> ⁣</mtext><mo fence="false" stretchy="true" minsize="1.2em" maxsize="1.2em">(</mo><mn>9.0</mn><mo separator="true">,</mo><mtext>  </mtext><mi mathvariant="script">U</mi><mo stretchy="false">(</mo><mn>2.5</mn><mo separator="true">,</mo><mn>4.5</mn><mo stretchy="false">)</mo><mo>+</mo><mn>0.15</mn><mo>⋅</mo><mtext>score</mtext><mo fence="false" stretchy="true" minsize="1.2em" maxsize="1.2em">)</mo></mrow><annotation encoding="application/x-tex">v_{\text{enemy}} = \min\!\big(9.0,\ \ \mathcal{U}(2.5, 4.5) + 0.15 \cdot \text{score}\big) 
</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.7167em;vertical-align:-0.2861em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0359em;">v</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.1514em;"><span style="top:-2.55em;margin-left:-0.0359em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord text mtight"><span class="mord mtight">enemy</span></span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.2861em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:1.2em;vertical-align:-0.35em;"></span><span class="mop">min</span><span class="mspace" style="margin-right:-0.1667em;"></span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord"><span class="delimsizing size1">(</span></span><span class="mord">9.0</span><span class="mpunct">,</span><span class="mspace"> </span><span class="mspace"> </span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathcal" style="margin-right:0.0993em;">U</span><span class="mopen">(</span><span class="mord">2.5</span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord">4.5</span><span class="mclose">)</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">+</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">0.15</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">⋅</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:1.2em;vertical-align:-0.35em;"></span><span class="mord text"><span class="mord">score</span></span><span class="mord"><span class="delimsizing size1">)</span></span></span></span></span></span></p><blockquote>
<p>นี่คือ &quot;ความยากแบบนุ่ม&quot; (smooth difficulty) ผู้เล่นเก่งขึ้นเกมก็ตามขึ้น แต่ <code>min(9.0, ...)</code> คือเพดานไม่ให้เร็วจนเล่นไม่ไหว ลองปรับ 0.15 หรือเพดาน 9.0 ดูว่ารู้สึกต่างกันไหม</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="14" style="--paginate:true;--theme:default;" data-marpit-pagination-total="31">
<h1 id="%E0%B8%81%E0%B8%A3%E0%B8%B2%E0%B8%9F--%E0%B8%84%E0%B8%A7%E0%B8%B2%E0%B8%A1%E0%B8%A2%E0%B8%B2%E0%B8%81%E0%B8%9E%E0%B8%B8%E0%B9%88%E0%B8%87%E0%B8%82%E0%B8%B6%E0%B9%89%E0%B8%99%E0%B9%81%E0%B8%A5%E0%B9%89%E0%B8%A7%E0%B8%8A%E0%B8%99%E0%B9%80%E0%B8%9E%E0%B8%94%E0%B8%B2%E0%B8%99">กราฟ · ความยากพุ่งขึ้นแล้วชนเพดาน</h1>
<p>วาดสมการ <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>v</mi><mo>=</mo><mi>min</mi><mo>⁡</mo><mo stretchy="false">(</mo><mn>9.0</mn><mo separator="true">,</mo><mtext> base</mtext><mo>+</mo><mn>0.15</mn><mo>⋅</mo><mtext>score</mtext><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">v = \min(9.0,\ \text{base} + 0.15 \cdot \text{score})</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.4306em;"></span><span class="mord mathnormal" style="margin-right:0.0359em;">v</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mop">min</span><span class="mopen">(</span><span class="mord">9.0</span><span class="mpunct">,</span><span class="mspace"> </span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord text"><span class="mord">base</span></span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">+</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">0.15</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">⋅</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord text"><span class="mord">score</span></span><span class="mclose">)</span></span></span></span> ออกมาเป็นกราฟ จะเห็นพฤติกรรมของ <code>min</code> ชัดเจน:</p>
<p><img src="img/shooter_difficulty.png" alt="" style="width:600px;" /></p>
<ul>
<li>เส้นน้ำเงิน = ความเร็วเฉลี่ย ค่อย ๆ ไต่ขึ้นตามคะแนน (นี่คือ &quot;wave&quot;)</li>
<li>แถบฟ้าจาง = ความสุ่ม <code>U(2.5, 4.5)</code> ของแต่ละตัว ไม่ตกเท่ากันเป๊ะ</li>
<li>เส้นแดง = <strong>เพดาน</strong> พอ <code>base + 0.15·score</code> แตะ 9.0 กราฟก็แบนราบ — <code>min</code> ตัดไม่ให้เกิน</li>
</ul>
<blockquote>
<p>สังเกตหัวเข่าของกราฟ (ราวคะแนน 37) ก่อนถึงตรงนั้นเกมท้าทายขึ้นเรื่อย ๆ หลังจากนั้นความยากคงที่ — ผู้เล่นเก่งสู้ต่อได้ ไม่ใช่ตายเพราะเกมเร่งจนเกินมนุษย์</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="15" style="--paginate:true;--theme:default;" data-marpit-pagination-total="31">
<h1 id="%E0%B9%80%E0%B8%AB%E0%B9%87%E0%B8%99%E0%B8%A0%E0%B8%B2%E0%B8%9E-wave--%E0%B8%A8%E0%B8%B1%E0%B8%95%E0%B8%A3%E0%B8%B9%E0%B8%95%E0%B8%81%E0%B9%80%E0%B8%A3%E0%B9%87%E0%B8%A7%E0%B8%82%E0%B8%B6%E0%B9%89%E0%B8%99%E0%B8%95%E0%B8%B2%E0%B8%A1%E0%B8%84%E0%B8%B0%E0%B9%81%E0%B8%99%E0%B8%99">เห็นภาพ wave · ศัตรูตกเร็วขึ้นตามคะแนน</h1>
<p><img src="img/shooter_wave.gif" alt="" style="width:560px;" /></p>
<p>มุมซ้ายบนคือ <code>score</code> มุมขวาบนคือ <code>v</code> ที่คำนวณจากสมการ wave เดียวกับโค้ดของเรา</p>
<blockquote>
<p>คะแนนยิ่งขึ้น ตัวเลข <code>v</code> ยิ่งโต ศัตรูร่วงไวขึ้นเห็น ๆ — นี่คือสมการ <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>v</mi><mo>=</mo><mi>min</mi><mo>⁡</mo><mo stretchy="false">(</mo><mn>9.0</mn><mo separator="true">,</mo><mtext>base</mtext><mo>+</mo><mn>0.15</mn><mo>⋅</mo><mtext>score</mtext><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">v=\min(9.0, \text{base}+0.15\cdot\text{score})</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.4306em;"></span><span class="mord mathnormal" style="margin-right:0.0359em;">v</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mop">min</span><span class="mopen">(</span><span class="mord">9.0</span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord text"><span class="mord">base</span></span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">+</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">0.15</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">⋅</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord text"><span class="mord">score</span></span><span class="mclose">)</span></span></span></span> ที่ &quot;มีชีวิต&quot; อยู่บนจอ ไม่ใช่แค่ตัวหนังสือ</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="16" style="--paginate:true;--theme:default;" data-marpit-pagination-total="31">
<h1 id="state-machine-%E0%B8%82%E0%B8%AD%E0%B8%87%E0%B9%80%E0%B8%81%E0%B8%A1">state machine ของเกม</h1>
<svg viewBox="0 0 760 200" width="100%" font-family="sans-serif" font-size="14">
  <rect x="40" y="80" width="130" height="50" rx="25" fill="#E3F2FD" stroke="#2196F3" />
  <text x="105" y="110" text-anchor="middle">PLAYING</text>
  <path d="M170 90 C 300 30, 430 30, 560 80" fill="none" stroke="#4CAF50" stroke-width="2" marker-end="url(#b)" />
  <text x="365" y="40" text-anchor="middle" fill="#4CAF50">hit → score+1, respawn</text>
  <path d="M560 105 C 460 140, 360 140, 175 118" fill="none" stroke="#4CAF50" stroke-width="2" marker-end="url(#b)" />
  <text x="540" y="135" text-anchor="middle" fill="#FF9800">enemy หลุดพื้น → lives−1</text>
  <ellipse cx="620" cy="90" rx="50" ry="25" fill="#FFF3E0" stroke="#FF9800" />
  <text x="620" y="95" text-anchor="middle">loop</text>
  <rect x="300" y="155" width="160" height="45" rx="10" fill="#FFEBEE" stroke="#F44336" />
  <text x="380" y="183" text-anchor="middle" font-weight="bold" fill="#F44336">GAME OVER</text>
  <path d="M105 130 V 175 H 300" fill="none" stroke="#F44336" stroke-width="2" marker-end="url(#b)" />
  <text x="180" y="170" text-anchor="middle" fill="#F44336">lives ≤ 0</text>
  <defs><marker markerUnits="userSpaceOnUse" id="b" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6 z" fill="#555" /></marker></defs>
</svg>
<blockquote>
<p><code>return False</code> จาก <code>on_frame</code> = บอก <code>game.run()</code> ให้หยุดลูป (เช่นตอน GAME OVER) ส่วนปุ่มระบบ เอนจินจัดการให้: <strong>Back = ออกจากเกม</strong> กลับหน้า Playground · <strong>Start = เริ่มเกมใหม่</strong></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="17" style="--paginate:true;--theme:default;" data-marpit-pagination-total="31">
<h1 id="%E0%B8%82%E0%B8%B1%E0%B9%89%E0%B8%99%E0%B8%9A%E0%B8%B1%E0%B8%99%E0%B9%84%E0%B8%94--step4-%E2%86%92-step5-%E2%86%92-%E0%B9%80%E0%B8%81%E0%B8%A1%E0%B9%80%E0%B8%95%E0%B9%87%E0%B8%A1">ขั้นบันได · step4 → step5 → เกมเต็ม</h1>
<p>เกม Shooter ไม่ได้กระโดดจาก step4 ไปเกมเต็มทีเดียว — มี <strong>step5</strong> คั่นกลางที่เพิ่มพอดี 2 เรื่อง: <strong>ปรับความยากได้</strong> และ <strong>ศัตรูมาเป็นคลื่นแทนตกพร้อมกัน</strong></p>
<div style="text-align:center">
<svg width="880" height="212" viewBox="0 0 880 212" font-family="DejaVu Sans, sans-serif">
  <defs>
    <marker markerUnits="userSpaceOnUse" id="arL" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#607d8b" /></marker>
  </defs>
  <text x="12" y="14" font-size="11" fill="#607d8b">ขั้นบันได: เกมเล่นจบได้ → ปรับความยาก+คลื่นศัตรู → เกมเต็ม (เอนจิน API เต็ม + ของตกแต่ง C-native)</text>
  
  <rect x="20" y="40" width="240" height="122" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" />
  <text x="140" y="66" text-anchor="middle" font-weight="700" fill="#2e7d32">step4 — เกมเต็มระดับเริ่มต้น</text>
  <text x="140" y="88" text-anchor="middle" font-size="12" fill="#555">ศัตรูตก · ชน · คะแนน · ชีวิต · GAME OVER</text>
  <text x="140" y="108" text-anchor="middle" font-size="12" fill="#555">ความเร็วคงที่ ตกพร้อมกันทั้งบ่อ</text>
  <text x="140" y="148" text-anchor="middle" font-size="11" fill="#999">shooter_step4.py :29-32, :70-90</text>
  <line x1="260" y1="101" x2="308" y2="101" stroke="#607d8b" stroke-width="2.4" marker-end="url(#arL)" />
  <text x="284" y="93" text-anchor="middle" font-size="11" fill="#1565c0">+โหมด +คลื่น</text>
  
  <rect x="312" y="40" width="256" height="122" rx="12" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" />
  <text x="440" y="66" text-anchor="middle" font-weight="700" fill="#1565c0">step5 — ปรับความยาก + wave</text>
  <text x="440" y="88" text-anchor="middle" font-size="12" fill="#555">MODES: FREE / EASY / DIFFICULT</text>
  <text x="440" y="108" text-anchor="middle" font-size="12" fill="#555">spawn timer ปล่อยศัตรูทีละตัวเป็นคลื่น</text>
  <text x="440" y="148" text-anchor="middle" font-size="11" fill="#999">shooter_step5.py :44-47, :49-50, :101-106</text>
  <line x1="568" y1="101" x2="616" y2="101" stroke="#607d8b" stroke-width="2.4" marker-end="url(#arL)" />
  <text x="592" y="93" text-anchor="middle" font-size="11" fill="#6a1b9a">+เอนจิน API</text>
  
  <rect x="620" y="40" width="240" height="122" rx="12" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="2" />
  <text x="740" y="66" text-anchor="middle" font-weight="700" fill="#6a1b9a">เกมเต็ม (full)</text>
  <text x="740" y="88" text-anchor="middle" font-size="12" fill="#555">game.menu เลือกโหมดบนจอ · Sprite · pool</text>
  <text x="740" y="108" text-anchor="middle" font-size="12" fill="#555">momentum · st{} · music/scanline (C skin)</text>
  <text x="740" y="148" text-anchor="middle" font-size="11" fill="#999">shooter_full.py + page_game_shooter.c</text>
</svg>
</div>
<div style="font-size:0.82em">
<table>
<thead>
<tr>
<th>ก้าว</th>
<th>ไฟล์</th>
<th>เพิ่มอะไร</th>
</tr>
</thead>
<tbody>
<tr>
<td>step4</td>
<td><code>solution_codes/shooter_step4.py</code></td>
<td>เกมเล่นจบได้ (beginner-complete) — ศัตรูความเร็วคงที่ ตกพร้อมกันทั้งบ่อ</td>
</tr>
<tr>
<td>step5</td>
<td><code>solution_codes/shooter_step5.py</code></td>
<td><code>MODES</code> FREE/EASY/DIFFICULT <code>:44-47</code> เลือกด้วย <code>MODE</code> <code>:49-50</code> + wave <code>spawn_timer</code> <code>:101-106</code> + ยานชนศัตรู=เสียชีวิต (ยกเว้น FREE) <code>:159-169</code></td>
</tr>
<tr>
<td>เกมเต็ม</td>
<td><code>full_games/shooter_full.py</code></td>
<td>เอนจิน API เต็ม: <code>game.menu</code> เลือกโหมดบนจอ · <code>game.Sprite</code> · <code>game.pool</code> · momentum · <code>st{}</code></td>
</tr>
</tbody>
</table>
</div>
<blockquote>
<p><strong>ทำไมต้องมี step5?</strong> step4 สนุกแล้ว แต่ศัตรูตกเท่ากันหมด เล่นซ้ำ ๆ ก็จำจังหวะได้. step5 เติมสองอย่างพอดี: (1) <strong>ตารางโหมด</strong> ให้เลือกความยาก — FREE ฝึกมือ (ไม่มีลงโทษ), EASY ช้า/บางตา (ชนยาน=เสีย แต่หลุดล่างไม่เสีย), DIFFICULT ของจริง (หลุดล่าง=เสีย, ชนยาน=เสีย) · (2) <strong>spawn timer</strong> ปล่อยศัตรูทีละตัวตามจังหวะ <code>SPAWN_DELAY</code> แทนที่จะเทลงมาพร้อมกัน จังหวะเกมจึงเหมือนเกมยิงจริง. เปิด <code>solution_codes/shooter_step5.py</code> แล้วลองเปลี่ยน <code>MODE</code> เป็น 0/1/2 ดูความต่างของแต่ละโหมด</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="18" style="--paginate:true;--theme:default;" data-marpit-pagination-total="31">
<h1 id="%E0%B9%80%E0%B8%9B%E0%B8%B4%E0%B8%94%E0%B8%9D%E0%B8%B2-shooter_fullpy--%E0%B9%80%E0%B8%81%E0%B8%A1%E0%B9%80%E0%B8%95%E0%B9%87%E0%B8%A1-279-%E0%B8%9A%E0%B8%A3%E0%B8%A3%E0%B8%97%E0%B8%B1%E0%B8%94%E0%B8%A1%E0%B8%B5%E0%B8%AD%E0%B8%B0%E0%B9%84%E0%B8%A3%E0%B8%9A%E0%B9%89%E0%B8%B2%E0%B8%87">เปิดฝา <code>shooter_full.py</code> — เกมเต็ม 279 บรรทัดมีอะไรบ้าง</h1>
<p>เกมเต็มใช้ pattern เดียวกับที่เราเขียน แต่ครบเครื่องกว่า — นี่คือแผนที่ว่าแต่ละก้อนอยู่บรรทัดไหน (<code>full_games/shooter_full.py</code>):</p>
<div style="font-size:0.72em">
<table>
<thead>
<tr>
<th>ส่วนประกอบ</th>
<th>บรรทัด</th>
<th>ทำอะไร</th>
</tr>
</thead>
<tbody>
<tr>
<td>ค่าคงที่ + โหมดความยาก <code>MODES</code></td>
<td><code>:14-45</code></td>
<td>3 โหมด <code>(ชื่อ, spawn_gap, vy_mul, lives, ...)</code> — ปรับความยากที่ตารางเดียว <code>:36-40</code></td>
</tr>
<tr>
<td><code>overlap()</code> — AABB</td>
<td><code>:48-50</code></td>
<td>ตรวจชนกล่อง (แบบ De Morgan) เรียกที่ <code>:237,250</code></td>
</tr>
<tr>
<td>เมนู outer loop</td>
<td><code>:57-64</code></td>
<td><code>game.menu(...)</code> เลือกโหมด → unpack <code>MODES[mode]</code></td>
</tr>
<tr>
<td>จัดฉาก + <strong>pool</strong></td>
<td><code>:66-77</code></td>
<td><code>game.Sprite</code> ยาน · บ่อกระสุน <code>Box</code> · <strong><code>game.pool(&quot;enemy&quot;,8)</code></strong> ศัตรู/ระเบิด <code>:75-76</code></td>
</tr>
<tr>
<td><strong>state dict <code>st{}</code></strong></td>
<td><code>:79-82</code></td>
<td>รวม state ทั้งเกม (sx, sy, svx, svy, score, lives, spawn) ไว้ dict เดียว</td>
</tr>
<tr>
<td>parallel arrays</td>
<td><code>:84-88</code></td>
<td><code>bx/by/bvx</code>, <code>ex/ey/evy</code>, <code>ekind</code> — index ผูกตรงกับช่องใน pool</td>
</tr>
<tr>
<td><code>fire()</code> + <strong>bvx momentum</strong></td>
<td><code>:137-148</code></td>
<td><code>bvx[j] = svx · BULLET_INHERIT</code> <code>:145</code> — กระสุนพกโมเมนตัมยานไปด้วย</td>
</tr>
<tr>
<td><code>update()</code> ต่อเฟรม</td>
<td><code>:172-262</code></td>
<td><strong><code>pressed_once</code></strong> <code>:174,195</code> · ยาน 2 แกน · spawn clock · ชน <code>overlap</code></td>
</tr>
</tbody>
</table>
</div>
<blockquote>
<p><strong>3 แนวคิดใหม่ในเกมเต็ม (ต่อยอดจากที่เราเขียน):</strong></p>
<ul>
<li><strong><code>st{}</code> state dict <code>:79-82</code></strong> — แทน <code>global</code> หลายตัว รวม state ไว้ก้อนเดียว ส่งเข้า closure ได้ ไม่ต้องประกาศ <code>global</code> ทุกฟังก์ชัน</li>
<li><strong><code>pressed_once(&quot;a&quot;, k)</code> <code>:195</code></strong> — ยิง <strong>ทีละนัดต่อการกด 1 ครั้ง</strong> (edge-trigger) กดค้างไม่รัว ต่างจาก <code>keys.a</code> ที่เป็นจริงทุกเฟรมที่กดค้าง (level)</li>
<li><strong><code>bvx</code> momentum <code>:145,210</code></strong> — กระสุนไม่ได้พุ่งตรงขึ้นอย่างเดียว แต่ <strong>เฉียงตามความเร็วยาน</strong> (<code>bx[j] += bvx[j]</code> <code>:210</code>) สไลด์ไปยิงไปได้</li>
</ul>
</blockquote>
</section>

<li>เปิด <a class="pc-gh-link" href="https://github.com/Advance-Innovation-Centre-AIC/embedded-systems-for-developer/blob/main/developer-i/practise_codes/shooter_step4.py" target="_blank" rel="noopener" title="เปิดไฟล์บน GitHub (แท็บใหม่)" style="text-decoration:none"><code>practise_codes/shooter_step4.py</code><sup style="color:#22d3ee;font-weight:800">&#8599;</sup></a> <strong>ใน BENTO IDE</strong></li>
<li>เติม 3 ช่อง TODO: บ่อศัตรู (1), <code>respawn_enemy</code> (2), ตรรกะตก+ชน+คะแนน+ชีวิต (3+4)</li>

<h1 id="%E0%B8%9C%E0%B8%A5%E0%B8%9A%E0%B8%99%E0%B8%9A%E0%B8%AD%E0%B8%A3%E0%B9%8C%E0%B8%94%E0%B8%88%E0%B8%A3%E0%B8%B4%E0%B8%87">ผลบนบอร์ดจริง</h1>
<p>ยานเขียวด้านล่าง · เลเซอร์ฟ้าจากบ่อ · กล่องสีตก = ศัตรู · มุมบน = Score/Lives</p>
<p style="text-align:center;margin:6px 0;"><img src="img/shooter_game.png" width="600" /></p>
<blockquote>
<p>ภาพนี้ถ่ายจากบอร์ดจริง ตรงกับสิ่งที่กลุ่มของเราจะเห็นเมื่อรัน <code>shooter_step4.py</code> เล่นไปเรื่อย ๆ ศัตรูจะตกเร็วขึ้นตาม wave</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="22" style="--paginate:true;--theme:default;" data-marpit-pagination-total="31">
<h1 id="%E0%B8%81%E0%B8%B1%E0%B8%9A%E0%B8%94%E0%B8%B1%E0%B8%81%E0%B8%97%E0%B8%B5%E0%B9%88%E0%B9%80%E0%B8%88%E0%B8%AD%E0%B8%9A%E0%B9%88%E0%B8%AD%E0%B8%A2">กับดักที่เจอบ่อย</h1>
<div style="font-size:0.92em;">
<table>
<thead>
<tr>
<th>อาการ</th>
<th>สาเหตุ</th>
<th>วิธีแก้</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>UnboundLocalError</code></td>
<td>ลืม <code>global</code></td>
<td><code>global score, lives, fire_cooldown, ...</code></td>
</tr>
<tr>
<td>ได้คะแนนรัวเป็นสิบ</td>
<td>ลืม <code>break</code></td>
<td><code>break</code> หลัง <code>game.hit</code> เป็นจริง</td>
</tr>
<tr>
<td>นัดในบ่อไปชนศัตรู</td>
<td>ไม่กรองนัดซ่อน</td>
<td>เช็ค <code>if bullet.y &gt;= -20</code> ก่อน</td>
</tr>
<tr>
<td>ศัตรูตกแล้วหาย</td>
<td>ลืม respawn</td>
<td>หลุดพื้น/โดนยิง → <code>respawn_enemy(index)</code></td>
</tr>
<tr>
<td>ชีวิตลดทีละหลายดวง</td>
<td>นับซ้ำ/ลืม continue</td>
<td>หลังเสียชีวิต <code>continue</code> ไปตัวถัดไป</td>
</tr>
<tr>
<td>เกมยากเกินทันที</td>
<td>wave เพิ่มแรงไป</td>
<td>ลดตัวคูณ 0.15 หรือลดเพดาน 9.0</td>
</tr>
</tbody>
</table>
</div>
<blockquote>
<p>กฎทองของ pool: ของว่าง/ของหมดอายุ <strong>reuse อย่า alloc</strong> จำนวน widget จึงคงที่ <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo>=</mo><mtext>MAX_BULLETS</mtext><mo>+</mo><mtext>MAX_ENEMIES</mtext><mo>=</mo><mn>12</mn></mrow><annotation encoding="application/x-tex">= \text{MAX\_BULLETS} + \text{MAX\_ENEMIES} = 12</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.3669em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.9933em;vertical-align:-0.31em;"></span><span class="mord text"><span class="mord">MAX_BULLETS</span></span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">+</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:0.9933em;vertical-align:-0.31em;"></span><span class="mord text"><span class="mord">MAX_ENEMIES</span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">12</span></span></span></span></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="23" style="--paginate:true;--theme:default;" data-marpit-pagination-total="31">
<h1 id="%E0%B9%80%E0%B8%8A%E0%B8%B7%E0%B9%88%E0%B8%AD%E0%B8%A1%E0%B9%82%E0%B8%A2%E0%B8%87%E0%B8%A3%E0%B8%B2%E0%B8%81%E0%B8%90%E0%B8%B2%E0%B8%99--%E0%B9%80%E0%B8%81%E0%B8%A1-shooter-%E0%B8%95%E0%B9%88%E0%B8%AD%E0%B8%81%E0%B8%B1%E0%B8%9A%E0%B8%A7%E0%B8%B4%E0%B8%A8%E0%B8%A7%E0%B8%81%E0%B8%A3%E0%B8%A3%E0%B8%A1%E0%B8%95%E0%B8%A3%E0%B8%87%E0%B9%84%E0%B8%AB%E0%B8%99">เชื่อมโยงรากฐาน · เกม Shooter ต่อกับวิศวกรรมตรงไหน</h1>
<p>เกมยิงที่เล่นจบรอบได้วันนี้ ซ่อนรากฐานที่ใช้ต่อได้กับงานจริงทั้งฝั่ง embedded และซอฟต์แวร์:</p>
<p><strong>ฝั่ง Algorithms / ฟิสิกส์เกม</strong></p>
<ul>
<li><strong>Object pool</strong> — reuse ของเดิมแทน alloc ใหม่ คือเทคนิคคุมหน่วยความจำ/ประสิทธิภาพที่เกมจริงใช้ทุกวัน</li>
<li><strong>Collision (AABB)</strong> — เช็คกรอบซ้อนทับด้วยอสมการ 4 ตัว เป็นพื้นฐานเดียวกับ broad-phase ในเอนจินใหญ่</li>
<li><strong>Smooth difficulty</strong> — <code>min(ceiling, base + k·score)</code> คือการ clamp ค่าให้อยู่ในพิสัยปลอดภัย แนวคิดเดียวกับการ saturate ค่าเซนเซอร์/มอเตอร์</li>
</ul>
<p><strong>ฝั่ง Python</strong></p>
<ul>
<li><strong>list + index</strong> — <code>enemies[i]</code>, <code>enemy_speed[i]</code> คู่ขนานกัน คือโครงสร้างข้อมูลแบบ array ที่ map กันด้วย index</li>
<li><strong>enumerate / nested loop</strong> — many-vs-many (<span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>6</mn><mo>×</mo><mn>6</mn></mrow><annotation encoding="application/x-tex">6\times6</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.7278em;vertical-align:-0.0833em;"></span><span class="mord">6</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">×</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">6</span></span></span></span>) คือ loop ซ้อน loop ที่เราจะเจอในงานประมวลผลข้อมูลตลอด</li>
<li><strong>global / state</strong> — <code>score</code>, <code>lives</code> คือ state ของเกมที่ทุกเฟรมอ่าน-เขียนร่วมกัน</li>
</ul>
<p><strong>ฝั่ง Embedded / Graphics</strong></p>
<ul>
<li><strong>เพดานความเร็วผูกกับ frame rate</strong> — <code>px/frame</code> แปลว่าความเร็วจริงขึ้นกับ FPS ของบอร์ด เป็นเหตุผลที่ระบบ real-time ต้องคุมจังหวะเวลา</li>
<li><strong>บ่อ widget = จำนวนวัตถุคงที่</strong> — บนบอร์ดที่ RAM จำกัด การไม่ alloc กลางลูปคือการออกแบบที่กันหน่วยความจำแตก</li>
</ul>
<p><strong>ดูคลิป (เสริม) — pool pattern แบบไม่ผูกกับเอนจินใดเอนจินหนึ่ง ตรงกับ &quot;บ่อศัตรู/บ่อกระสุน&quot; ของเรา:</strong></p>
<div style="text-align:center">
<iframe width="480" height="270" src="https://www.youtube.com/embed/K_66snljKbc" title="Object Pooling Explained in 11 Minutes" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe>
</div>
<p><em>Object Pooling Explained in 11 Minutes — Honlight</em></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="24" style="--paginate:true;--theme:default;" data-marpit-pagination-total="31">
<h1 id="%E0%B8%AA%E0%B8%A3%E0%B8%B8%E0%B8%9B--%E0%B8%97%E0%B8%B3%E0%B9%80%E0%B8%AD%E0%B8%87-30">สรุป + ทำเอง 30%</h1>
<div style="display:flex;gap:16px;">
<div style="flex:1;">
<p><strong>เช็คผ่าน (acceptance)</strong></p>
<ul>
<li>ศัตรูตกจากฟ้า ความเร็วต่างกัน</li>
<li>ยิงโดน +1 + respawn + เสียง</li>
<li>หลุดพื้น → ชีวิตลด → 0 = GAME OVER</li>
<li>เล่นไปนาน ๆ ศัตรูตกเร็วขึ้น (wave)</li>
</ul>
<p><strong>ส่งงาน</strong></p>
<ul>
<li>โชว์อาจารย์: เล่น 1 รอบ คะแนน ≥ 3 จนชีวิตหมด</li>
<li>ส่ง <code>shooter_step4.py</code></li>
</ul>
</div>
<div style="flex:1;">
<p><strong>ทำเอง 30% (เลือก 1)</strong></p>
<ul>
<li>ปรับ <code>MAX_ENEMIES</code> / ช่วงความเร็ว</li>
<li>เปลี่ยนสูตร wave ให้ยากแบบที่เราชอบ</li>
<li>เก็บ best score ข้ามรอบ</li>
<li>เพิ่มโบนัส: ยิงโดนติดกันได้คะแนนพิเศษ</li>
</ul>
</div>
</div>
<blockquote>
<p>จบคาบนี้เราก็ได้ <strong>MVP-2 เกม Shooter</strong> ที่เล่นจบรอบได้จริง ครบทั้ง spawn ศัตรู · many-vs-many collision · และ wave ที่ค่อย ๆ ยากขึ้น เก่งมากน้อง ๆ</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="25" style="--paginate:true;--theme:default;" data-marpit-pagination-total="31">
<h1 id="%E0%B9%80%E0%B8%89%E0%B8%A5%E0%B8%A2-shooter_step4py--%E0%B8%AD%E0%B9%88%E0%B8%B2%E0%B8%99%E0%B9%83%E0%B8%AB%E0%B9%89%E0%B9%80%E0%B8%82%E0%B9%89%E0%B8%B2%E0%B9%83%E0%B8%88-%E0%B9%81%E0%B8%A5%E0%B9%89%E0%B8%A7%E0%B8%9B%E0%B8%B4%E0%B8%94%E0%B9%84%E0%B8%9F%E0%B8%A5%E0%B9%8C%E0%B8%9E%E0%B8%B4%E0%B8%A1%E0%B8%9E%E0%B9%8C%E0%B9%80%E0%B8%AD%E0%B8%87">เฉลย <code>shooter_step4.py</code> — อ่านให้เข้าใจ แล้วปิดไฟล์พิมพ์เอง</h1>
<p>เฉลยนี้มีไว้ให้ <strong>เทียบ</strong> ไม่ได้มีไว้ให้ลอกวางส่ง คะแนนของเราอยู่ที่ใบงานกับการอธิบายด้วยคำพูดตัวเอง ไม่ใช่ที่โค้ดตรงกับเฉลย วิธีใช้ให้ได้ผลจริงคือ อ่านให้เข้าใจว่าทำไมแต่ละบรรทัดต้องเป็นแบบนี้ แล้ว <strong>ปิดไฟล์ กลับไปพิมพ์ใหม่ด้วยมือตัวเอง</strong> ตอนพิมพ์เองนั่นแหละที่สมองจำ pattern ได้จริง ต่อไปเราจะแกะทีละก้อน ไม่ดูรวดเดียว</p>
<p><strong>ก้อนแรก — ค่าคงที่ กับ state ของทั้งเกม (นอก <code>on_frame</code>):</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">ACCEL, MAX_SPEED, FRICTION = <span class="hljs-number">1.4</span>, <span class="hljs-number">13.0</span>, <span class="hljs-number">0.80</span>
MAX_BULLETS, MAX_ENEMIES = <span class="hljs-number">6</span>, <span class="hljs-number">6</span>                 <span class="hljs-comment"># บ่อกระสุน 6, บ่อศัตรู 6</span>
ENEMY_COLORS = [game.RED, game.ORANGE, game.PINK]
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">ship = game.Box(<span class="hljs-number">365</span>, <span class="hljs-number">352</span>, <span class="hljs-number">62</span>, <span class="hljs-number">24</span>, game.GREEN)
ship_x, ship_speed = <span class="hljs-number">365.0</span>, <span class="hljs-number">0.0</span>
score, lives, fire_cooldown = <span class="hljs-number">0</span>, <span class="hljs-number">3</span>, <span class="hljs-number">0</span>
hud = game.Text(<span class="hljs-string">&quot;Score: 0   Lives: 3&quot;</span>, <span class="hljs-number">10</span>, <span class="hljs-number">8</span>, game.WHITE)
</code></pre>
<ul>
<li><code>ACCEL, MAX_SPEED, FRICTION</code> และ <code>MAX_BULLETS, MAX_ENEMIES</code> วางบนสุดนอกลูป (<code>:14-15</code>) — แยก &quot;ค่าที่ปรับได้&quot; ออกจาก &quot;ตรรกะ&quot; อยากจูนความรู้สึกเกมก็แก้ที่เดียว ไม่ต้องไล่งมในลูป เป็นนิสัยเดียวกับตอนเราแยกค่าออกจากโครงในสไลด์ STEP 1</li>
<li><code>MAX_BULLETS, MAX_ENEMIES = 6, 6</code> (<code>:15</code>) คือขนาดบ่อสองใบ ผูกตรงกับ &quot;จำนวน widget คงที่&quot; ที่เราย้ำในกฎทองของ pool — 6 + 6 = 12 กล่องตายตัว ไม่งอกกลางเกม</li>
<li><code>score, lives, fire_cooldown = 0, 3, 0</code> (<code>:22</code>) ประกาศระดับโมดูล เพราะมันคือ state ของทั้งเกมที่ทุกเฟรมอ่าน-เขียนร่วมกัน ตรงกับ state machine PLAYING → GAME OVER ที่เราวาดไว้ นี่คือเหตุผลว่าทำไม <code>on_frame</code> ต้องขึ้นต้นด้วย <code>global</code></li>
<li><code>hud = game.Text(...)</code> (<code>:23</code>) เก็บลงตัวแปรเพราะต้อง <code>hud.set(...)</code> ทับข้อความทุกครั้งที่คะแนน/ชีวิตเปลี่ยน — ของที่ต้องแก้ทีหลังต้องมีชื่อไว้อ้างถึง</li>
</ul>
<blockquote>
<p>อย่าเพิ่งรีบพิมพ์ตาม ถามตัวเองก่อนว่า &quot;ทำไมค่าพวกนี้อยู่นอกลูป&quot; ตอบได้แล้วค่อยปิดไฟล์ พิมพ์ใหม่จากความเข้าใจ</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="26" style="--paginate:true;--theme:default;" data-marpit-pagination-total="31">
<h1 id="%E0%B9%80%E0%B8%89%E0%B8%A5%E0%B8%A2--%E0%B8%AA%E0%B8%AD%E0%B8%87%E0%B8%9C%E0%B8%B9%E0%B9%89%E0%B8%8A%E0%B9%88%E0%B8%A7%E0%B8%A2%E0%B8%82%E0%B8%AD%E0%B8%87%E0%B8%9A%E0%B9%88%E0%B8%AD--%E0%B8%AB%E0%B8%B2-%E0%B8%97%E0%B8%B5%E0%B9%88%E0%B8%A7%E0%B9%88%E0%B8%B2%E0%B8%87-%E0%B8%81%E0%B8%B1%E0%B8%9A-%E0%B8%AA%E0%B9%88%E0%B8%87%E0%B8%81%E0%B8%A5%E0%B8%B1%E0%B8%9A%E0%B8%82%E0%B8%B6%E0%B9%89%E0%B8%99%E0%B8%9A%E0%B8%99">เฉลย · สองผู้ช่วยของบ่อ — หา &quot;ที่ว่าง&quot; กับ &quot;ส่งกลับขึ้นบน&quot;</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">def</span> <span class="hljs-title function_">find_free_bullet</span>():
    <span class="hljs-keyword">for</span> bullet <span class="hljs-keyword">in</span> bullets:
        <span class="hljs-keyword">if</span> bullet.y &lt; -<span class="hljs-number">20</span>:
            <span class="hljs-keyword">return</span> bullet
    <span class="hljs-keyword">return</span> <span class="hljs-literal">None</span>
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">def</span> <span class="hljs-title function_">respawn_enemy</span>(<span class="hljs-params">index</span>):
    enemies[index].move_to(random.randint(<span class="hljs-number">0</span>, game.WIDTH - <span class="hljs-number">30</span>), -random.randint(<span class="hljs-number">20</span>, <span class="hljs-number">200</span>))
    enemies[index].set_color(random.choice(ENEMY_COLORS))
</code></pre>
<ul>
<li><code>find_free_bullet()</code> (<code>:34-38</code>) เดินหากระสุน &quot;ที่จอดอยู่&quot; ด้วยเงื่อนไข <code>bullet.y &lt; -20</code> คืนตัวแรกที่เจอ ถ้าเต็มบ่อคืน <code>None</code> — นี่คือหัวใจของ pool: ไม่ <code>game.Box(...)</code> ใหม่กลางเกม แต่ยืมของว่างมาใช้แล้วคืน</li>
<li>เลข <code>-20</code> ไม่ใช่ค่ามั่ว มันคือเส้นแบ่งเดียวกับตอนเช็คชนที่เราเขียน <code>bullet.y &gt;= -20</code> — y &lt; -20 คือจอดในบ่อ (ซ่อน), ≥ -20 คือกำลังลอย ทั้งไฟล์ใช้เกณฑ์เดียวกันตรรกะจึงไม่หลุด</li>
<li><code>respawn_enemy(index)</code> (<code>:41-43</code>) ทำกับศัตรูแบบเดียวกับที่บ่อกระสุนคาบที่แล้วทำ: <code>move_to</code> กลับขึ้นเหนือจอ + <code>set_color</code> สุ่มสีใหม่ ไม่ลบ ไม่สร้าง — นี่คือ REUSE, DON'T CREATE ในสไลด์ &quot;รีไซเคิลศัตรู&quot; ที่กลายเป็นฟังก์ชันจริง</li>
<li>สองฟังก์ชันนี้ยืม/คืนของจากบ่อที่ประกาศไว้แล้ว จำนวนกล่องบนจอจึงคงที่ทุกเฟรม บนบอร์ดที่ RAM จำกัด นี่คือสิ่งที่กัน memory แตกกลางเกม</li>
</ul>
<blockquote>
<p>จำคู่หูนี้ให้ขึ้นใจ: &quot;หาที่ว่าง&quot; กับ &quot;ส่งกลับที่จอด&quot; คือคู่ประจำของทุกบ่อ ไม่ว่าจะกระสุน ศัตรู หรือระเบิดในเกมที่ใหญ่กว่านี้</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="27" style="--paginate:true;--theme:default;" data-marpit-pagination-total="31">
<h1 id="%E0%B9%80%E0%B8%89%E0%B8%A5%E0%B8%A2--%E0%B8%81%E0%B9%89%E0%B8%AD%E0%B8%99-30-%E0%B8%82%E0%B8%AD%E0%B8%87%E0%B9%80%E0%B8%A3%E0%B8%B2--%E0%B8%95%E0%B8%81--%E0%B8%8A%E0%B8%99--%E0%B8%84%E0%B8%B0%E0%B9%81%E0%B8%99%E0%B8%99--%E0%B8%8A%E0%B8%B5%E0%B8%A7%E0%B8%B4%E0%B8%95">เฉลย · ก้อน 30% ของเรา — ตก · ชน · คะแนน · ชีวิต</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">    <span class="hljs-keyword">for</span> index, enemy <span class="hljs-keyword">in</span> <span class="hljs-built_in">enumerate</span>(enemies):
        enemy.move_to(enemy.x, enemy.y + enemy_speed[index])
        <span class="hljs-keyword">if</span> enemy.y &gt; game.HEIGHT:              <span class="hljs-comment"># ศัตรูหลุดถึงล่าง = เสีย 1 ชีวิต</span>
            lives -= <span class="hljs-number">1</span>
            hud.<span class="hljs-built_in">set</span>(<span class="hljs-string">&quot;Score: %d   Lives: %d&quot;</span> % (score, lives))
            respawn_enemy(index)
            <span class="hljs-keyword">if</span> lives &lt;= <span class="hljs-number">0</span>:
                game.sfx(<span class="hljs-string">&quot;gameover&quot;</span>)
                game.Text(<span class="hljs-string">&quot;GAME OVER&quot;</span>, <span class="hljs-number">320</span>, <span class="hljs-number">180</span>, game.RED)
                <span class="hljs-keyword">return</span> <span class="hljs-literal">False</span>
            <span class="hljs-keyword">continue</span>
        <span class="hljs-keyword">for</span> bullet <span class="hljs-keyword">in</span> bullets:                 <span class="hljs-comment"># กระสุนโดนศัตรู?</span>
            <span class="hljs-keyword">if</span> bullet.y &gt;= -<span class="hljs-number">20</span> <span class="hljs-keyword">and</span> game.hit(bullet, enemy):
                score += <span class="hljs-number">1</span>
                game.sfx(<span class="hljs-string">&quot;hit&quot;</span>)
                hud.<span class="hljs-built_in">set</span>(<span class="hljs-string">&quot;Score: %d   Lives: %d&quot;</span> % (score, lives))
                bullet.move_to(<span class="hljs-number">0</span>, -<span class="hljs-number">50</span>); bullet.hide()    <span class="hljs-comment"># กระสุนกลับบ่อ</span>
                respawn_enemy(index)            <span class="hljs-comment"># ศัตรูเกิดใหม่</span>
                <span class="hljs-keyword">break</span>
</code></pre>
<ul>
<li><code>for index, enemy in enumerate(enemies)</code> (<code>:71</code>) — เราขอทั้ง <code>index</code> (ไว้เรียก <code>enemy_speed[index]</code> และ <code>respawn_enemy(index)</code>) และตัว <code>enemy</code> เอง จึงใช้ <code>enumerate</code> ไม่ใช่ <code>for enemy in enemies</code> เฉย ๆ; <code>enemies[i]</code> กับ <code>enemy_speed[i]</code> คือ parallel array ที่ผูกกันด้วย index</li>
<li>สาขา &quot;หลุดล่าง&quot; (<code>:73-81</code>) ลด <code>lives</code>, respawn, แล้ว <code>continue</code> — <code>continue</code> สำคัญมาก ถ้าลืม โค้ดจะไหลลงไปเช็คชนกระสุนกับศัตรูตัวที่เพิ่ง respawn ต่อ ทำให้นับซ้อน นี่คือกับดัก &quot;ชีวิตลดทีละหลายดวง&quot; ที่เราเตือนในตารางกับดัก</li>
<li><code>if bullet.y &gt;= -20 and game.hit(bullet, enemy)</code> (<code>:83</code>) — เงื่อนไขซ้ายกรองนัดที่จอดในบ่อออกก่อน (short-circuit) แล้วค่อยเรียก <code>game.hit</code> ที่เป็น AABB 4 อสมการ; สลับลำดับไม่ได้ ไม่งั้นนัดที่ซ่อนอยู่ไปชนศัตรูจนได้คะแนนฟรี</li>
<li><code>break</code> หลังชน (<code>:89</code>) — กระสุนหนึ่งนัดจบศัตรูหนึ่งตัว ไม่วนให้นัดอื่นมาชนซ้ำ; ลืม <code>break</code> = คะแนนรัวเป็นสิบ (อีกกับดักที่เราเตือนไว้)</li>
<li><code>return False</code> ตอน <code>lives &lt;= 0</code> (<code>:80</code>) คือสัญญาณบอก <code>game.run()</code> ให้หยุดลูป ตรงกับ state machine PLAYING → GAME OVER; ปุ่ม Back/Start เอนจินจับให้เอง</li>
</ul>
<blockquote>
<p>สิบเก้าบรรทัดนี้คือ &quot;กติกาในหัวเรา&quot; ทั้ง 30% ทุกบรรทัดมีเหตุผลของมัน ถ้าตอบได้ว่าทำไมต้องมีทั้ง <code>continue</code> และ <code>break</code> แปลว่าเข้าใจจริง ไม่ใช่ท่องจำ</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="28" style="--paginate:true;--theme:default;" data-marpit-pagination-total="31">
<h1 id="%E0%B9%80%E0%B8%89%E0%B8%A5%E0%B8%A2--%E0%B8%8A%E0%B8%B4%E0%B9%89%E0%B8%99%E0%B8%AA%E0%B9%88%E0%B8%A7%E0%B8%99%E0%B9%84%E0%B8%95%E0%B9%88%E0%B8%A3%E0%B8%B0%E0%B8%94%E0%B8%B1%E0%B8%9A%E0%B8%A2%E0%B8%B1%E0%B8%87%E0%B9%84%E0%B8%87--step4-%E0%B8%95%E0%B9%88%E0%B8%AD%E0%B9%80%E0%B8%9B%E0%B9%87%E0%B8%99-step5">เฉลย · ชิ้นส่วนไต่ระดับยังไง — step4 ต่อเป็น step5</h1>
<p>step4 คือเกมเล่นจบได้แล้ว แต่ทุกชิ้นส่วนที่เราเพิ่งเขียนถูกออกแบบให้ <strong>ต่อยอด</strong> ได้ทันที step5 ไม่ได้รื้อของเดิม แค่ยกแต่ละชิ้นขึ้นอีกขั้น:</p>
<div style="font-size:0.78em">
<table>
<thead>
<tr>
<th>ชิ้นส่วน</th>
<th>step4 (ที่เราเพิ่งเขียน)</th>
<th>step5 ต่อยอดเป็น</th>
<th>บรรทัด</th>
</tr>
</thead>
<tbody>
<tr>
<td>บ่อ (pool)</td>
<td>บ่อกระสุน+บ่อศัตรู สร้างครั้งเดียว</td>
<td>บ่อศัตรูเริ่ม &quot;ซ่อน&quot; หมด แล้วปล่อยทีละตัว</td>
<td>step4 <code>:25-32</code> → step5 <code>:65-68</code></td>
</tr>
<tr>
<td>spawn</td>
<td>ศัตรูเกิดพร้อมกันทั้งบ่อตอนเริ่ม</td>
<td><code>spawn_timer</code> ปล่อยเป็น &quot;คลื่น&quot; ตามจังหวะโหมด</td>
<td>step5 <code>:101-106</code></td>
</tr>
<tr>
<td>ความยาก</td>
<td>ความเร็วสุ่มคงที่ <code>U(2.5, 4.5)</code></td>
<td>ตาราง <code>MODES</code> + <code>SPEED_MUL</code> คูณต่อโหมด</td>
<td>step5 <code>:44-50</code>, <code>:85</code></td>
</tr>
<tr>
<td>กติกาเสียชีวิต</td>
<td>หลุดล่าง = เสีย (ตายตัว)</td>
<td><code>LOSE_WHEN_PASS</code>/<code>LOSE_WHEN_HIT</code> ต่างกันต่อโหมด + ยานชนศัตรู</td>
<td>step5 <code>:135-142</code>, <code>:159-169</code></td>
</tr>
<tr>
<td>ชน</td>
<td><code>game.hit</code> กล่องเต็ม</td>
<td><code>boxes_overlap</code> hitbox หดให้ตรงฝั่ง C</td>
<td>step5 <code>:36-40</code>, <code>:148</code></td>
</tr>
</tbody>
</table>
</div>
<p>หัวใจของ step5 คือ <strong>ย้ายค่าปรับความยากทั้งหมดมาไว้ในตารางเดียว</strong> เลือกโหมดด้วยตัวแปร <code>MODE</code> บรรทัดเดียว:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">MODES = [
    (<span class="hljs-string">&quot;FREE SHOOTER&quot;</span>, <span class="hljs-number">16</span>, <span class="hljs-number">0.85</span>, <span class="hljs-number">99</span>, <span class="hljs-literal">False</span>, <span class="hljs-literal">False</span>),  <span class="hljs-comment"># ไม่มีอะไรลงโทษ — ฝึกมือ</span>
    (<span class="hljs-string">&quot;EASY&quot;</span>,         <span class="hljs-number">26</span>, <span class="hljs-number">0.70</span>,  <span class="hljs-number">5</span>, <span class="hljs-literal">False</span>, <span class="hljs-literal">True</span>),   <span class="hljs-comment"># ช้า+บางตา, หลุดล่างไม่เสีย แต่ชนยานเสีย</span>
    (<span class="hljs-string">&quot;DIFFICULT&quot;</span>,    <span class="hljs-number">12</span>, <span class="hljs-number">1.00</span>,  <span class="hljs-number">3</span>, <span class="hljs-literal">True</span>,  <span class="hljs-literal">True</span>),   <span class="hljs-comment"># ของจริง — หลุดล่าง=เสีย, ชนยาน=เสีย</span>
]
MODE = <span class="hljs-number">2</span>                                        <span class="hljs-comment"># เลือกโหมด (0/1/2) — C เลือกผ่านเมนูบนจอ</span>
MODE_NAME, SPAWN_DELAY, SPEED_MUL, START_LIVES, LOSE_WHEN_PASS, LOSE_WHEN_HIT = MODES[MODE]
</code></pre>
<ul>
<li>แต่ละแถวใน <code>MODES</code> คือชุดค่า <code>(ชื่อ, จังหวะปล่อย, ตัวคูณความเร็ว, ชีวิต, หลุดล่างเสีย?, ชนยานเสีย?)</code> — อยากเพิ่มโหมดใหม่ก็เพิ่มแถว ไม่ต้องแตะ <code>on_frame</code></li>
<li>นี่คือบทเรียนเดิมจากคาบแรกที่ขยายใหญ่ขึ้น: <strong>ขับพฤติกรรมด้วยข้อมูล</strong> (ตาราง) แทนที่จะฝัง <code>if</code> แยกโหมดกระจายทั่วโค้ด</li>
</ul>
<blockquote>
<p>สังเกตจังหวะไต่ระดับนี้ไว้: เกมทั้งเกมสร้างแบบนี้ เริ่มจากของเล็กที่สุดที่รันได้ (step4) แล้วยกทีละชิ้น ไม่กระโดดเขียนเกมเต็มรวดเดียว</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="29" style="--paginate:true;--theme:default;" data-marpit-pagination-total="31">
<h1 id="%E0%B9%80%E0%B8%8A%E0%B8%B7%E0%B9%88%E0%B8%AD%E0%B8%A1%E0%B8%88%E0%B8%B8%E0%B8%94--many-vs-many-%E0%B8%A1%E0%B8%B2%E0%B8%88%E0%B8%B2%E0%B8%81%E0%B9%84%E0%B8%AB%E0%B8%99-%E0%B9%81%E0%B8%A5%E0%B9%89%E0%B8%A7%E0%B8%88%E0%B8%B0%E0%B8%9E%E0%B8%B2%E0%B9%80%E0%B8%A3%E0%B8%B2%E0%B9%84%E0%B8%9B%E0%B9%84%E0%B8%AB%E0%B8%99">เชื่อมจุด — many-vs-many มาจากไหน แล้วจะพาเราไปไหน</h1>
<p>อยากให้หยุดคิดสักครู่ ไม่ใช่เรื่องโค้ด แต่เรื่องมองให้ทะลุว่า &quot;การเช็คกระสุนทุกนัดกับศัตรูทุกตัว&quot; ที่เราเพิ่งเขียน จริง ๆ แล้วมันคือชิ้นส่วนของอะไร</p>
<p><strong>ที่มา</strong> — <code>game.hit(a, b)</code> ที่เช็คชนสองกล่องนี้ ไม่ใช่ของใหม่วันนี้เลย เราใช้มันมาตั้งแต่ Catch (คาบ 3), Snake (คาบ 5), Flappy (คาบ 10) — สไลด์ &quot;many-vs-many&quot; ของคาบนี้ก็ชี้ไว้เอง ตอนนั้นเราเช็คแค่ &quot;1 คู่&quot; ต่อเฟรม วันนี้เราแค่เอา <code>game.hit</code> ตัวเดิมใส่ลูปซ้อนลูป ให้เช็ค 6×6 = 36 คู่ ตัวฟังก์ชันไม่เปลี่ยนแม้แต่นิดเดียว ก่อนหน้านั้นอีกชั้นคือ pool pattern จากบ่อกระสุน (Shooter #2) กับสไลด์ &quot;รีไซเคิลศัตรู&quot; วันนี้ — ของเดิมทั้งนั้น</p>
<p><strong>ที่ไป</strong> — pool + many-vs-many + state machine + <code>return False</code> ที่เราต่อกันวันนี้ คือโครงกระดูกของ <code>shooter_full.py</code> เกมเต็ม (<code>st{}</code> state dict, <code>game.pool</code>, <code>pressed_once</code>) และของเกมที่เหลือทุกเกม ยิ่งไปกว่านั้น <code>score</code> ที่วันนี้เก็บไว้ใน global เฉย ๆ คาบหน้าเราจะ &quot;ส่งออก&quot; ข้ามบอร์ดผ่าน WiFi + MQTT ทำเป็น leaderboard ของทั้งห้อง</p>
<p>ลองตอบสามข้อนี้ในใจ นี่แหละคือการเชื่อมจุดด้วยตัวเอง:</p>
<ul>
<li>จำ <code>game.hit(a, b)</code> ตอน Catch/Flappy ที่เช็คแค่ &quot;1 คู่&quot; ได้ไหม วันนี้เราแค่เอามันใส่ลูปซ้อนลูปให้เช็ค 36 คู่ โครงเปลี่ยนไปมากไหม? (ใบ้: ตัว <code>game.hit</code> ไม่เปลี่ยนเลย เปลี่ยนแค่ &quot;จำนวนครั้งที่เรียก&quot;)</li>
<li>ถ้าวันนี้เรารีไซเคิล &quot;ศัตรู 6 ตัว&quot; ในบ่อได้ พรุ่งนี้เราจะรีไซเคิล &quot;ระเบิด&quot; หรือ &quot;ก้อนหินตก&quot; ด้วย pattern เดียวกันได้ไหม? (ใบ้: <code>find_free_*</code> + <code>respawn_*</code>)</li>
<li>สังเกตไหมว่า <code>score</code> ที่เก็บใน global วันนี้ กับ &quot;คะแนนที่ต้องส่งขึ้น leaderboard คาบหน้า&quot; คือตัวแปรตัวเดียวกัน ต่างแค่ปลายทาง?</li>
</ul>
<div style="text-align:center">

<blockquote>
<p>ถ้าตอบสามข้อได้ว่า &quot;อ๋อ มันคือเรื่องเดียวกัน&quot; นั่นคือการหยั่งรู้ที่อาจารย์อยากให้เกิด: <code>game.hit</code> เดิม pool เดิม state เดิม แค่โตขึ้นเรื่อย ๆ ของที่ดูใหม่วันนี้ จริง ๆ คือของเก่าที่เราถือมาตลอด</p>
</blockquote>
</section>

  <text x="464" y="223" font-size="11" fill="#777">นับถึง 0 → ปล่อย 1 ตัว · อ่านเซนเซอร์ทุก N tick · debounce · heartbeat</text>
</svg>
</div>
<ul>
<li><strong>Object pool (<code>find_free_bullet</code> / <code>respawn_enemy</code>)</strong> ตรงกับ <strong>บัฟเฟอร์แพ็กเก็ตเครือข่าย</strong> และ <strong>DMA descriptor ring</strong>: จองช่องคงที่ล่วงหน้า ห้าม <code>malloc</code> ใน ISR เพราะทำ heap แตก — ยืมช่องว่างมาใช้ ใช้เสร็จคืน เหมือน <code>find_free_bullet</code></li>
<li><strong>many-vs-many AABB (ลูปซ้อนลูป 36 คู่/เฟรม)</strong> คือหัวใจของ <strong>ระบบสัมผัสหลายนิ้ว</strong> (นิ้ว N × ปุ่ม M) และ <strong>การเตือนชน</strong> ในรถ/โดรน (ยาน N × สิ่งกีดขวาง M) — โครงลูปเดียวกับที่เราเช็คกระสุน×ศัตรู</li>
<li><strong>Smooth difficulty clamp <code>min(9.0, base + 0.15·score)</code></strong> คือการ <strong>saturate ค่าใน embedded</strong>: จำกัด duty ของ PWM มอเตอร์/ความสว่างจอไม่ให้เกินพิกัด — สูตร clamp ตัวเดียวกัน กันค่าพุ่งจนฮาร์ดแวร์พัง</li>
<li><strong>spawn timer (<code>spawn_timer</code> ใน step5)</strong> ตรงกับ <strong>งานตามคาบเวลาใน RTOS</strong>: อ่านเซนเซอร์ทุก N tick, debounce ปุ่ม, ส่ง heartbeat — &quot;นับลงแล้วทำเมื่อถึงศูนย์&quot; แบบเดียวกับ <code>SPAWN_DELAY</code></li>
</ul>
<blockquote>
<p>เห็นไหมว่าทุกท่าที่เราเล่นวันนี้มีเครื่องจริงในโลกทำงานด้วยหลักการเดียวกันอยู่ เกมเป็นแค่ &quot;สนามซ้อม&quot; ที่เห็นผลไว</p>
</blockquote>
</section>

<h1 id="%E0%B8%95%E0%B9%88%E0%B8%AD%E0%B8%A2%E0%B8%AD%E0%B8%94--%E0%B8%84%E0%B8%B4%E0%B8%94%E0%B8%95%E0%B9%88%E0%B8%AD%E0%B9%80%E0%B8%AD%E0%B8%87">ต่อยอด — คิดต่อเอง</h1>
<p>ลองเอาโจทย์พวกนี้ไปคิดต่อ ไม่มีคำตอบเดียวตายตัว ทุกข้อโยงกลับไปหาของจริงได้:</p>
<div style="text-align:center">
<svg width="840" height="230" viewBox="0 0 840 230" font-family="DejaVu Sans, sans-serif">

  <text x="14" y="150" font-size="13" font-weight="700" fill="#2e7d32">แบบ broad-phase — เช็คเฉพาะที่อยู่ใกล้กัน</text>

<ul>
<li><strong>ศัตรูเป็นฟอร์เมชันแบบ Space Invaders</strong> — ถ้าอยากให้ศัตรูเรียงเป็น &quot;แถว&quot; ไล่ลงมาแทนที่จะสุ่มตำแหน่ง จะออกแบบบ่อศัตรู + ตำแหน่งเริ่มของแต่ละตัวยังไง โดยยังใช้ pool เดิมไม่สร้างกล่องใหม่?</li>
<li><strong>เมื่อคู่ที่ต้องเช็คเยอะเกินไป</strong> — ถ้าเกมโตเป็นศัตรู 50 ตัว × กระสุน 30 นัด = 1500 คู่/เฟรม การไล่เช็คทุกคู่จะเริ่มช้า จะลด &quot;จำนวนคู่ที่ต้องเช็ค&quot; ยังไง? (ใบ้: broad-phase — เช็คเฉพาะตัวที่อยู่ใกล้กันในแกน y ก่อน)</li>
<li><strong>ปรับความยากกลางเกม</strong> — ถ้าให้ผู้เล่นเร่ง/ผ่อนความยากเองระหว่างเล่น (ไม่ใช่เลือก <code>MODE</code> แค่ตอนเริ่ม) จะผูก <code>SPAWN_DELAY</code> / <code>SPEED_MUL</code> เข้ากับปุ่มยังไงให้เปลี่ยนได้ทันทีโดยไม่ต้องรีเซ็ตบ่อ?</li>
<li><strong>(สะพานสู่คาบหน้า) ส่งคะแนนออกจากบอร์ด</strong> — ถ้า <code>score</code> ที่เราเก็บใน global วันนี้ ต้องเด้งขึ้น &quot;กระดานคะแนนรวม&quot; ที่บอร์ดเพื่อน ๆ ทั้งห้องเห็นพร้อมกัน จะส่งเลขคะแนนออกจากบอร์ดยังไง? คาบหน้าเราต่อ WiFi + MQTT ทำ leaderboard เล่นข้ามบอร์ด — คำถามนี้คือประตูเข้าคาบ 13</li>
</ul>
<blockquote>
<p>เลือกมาสักข้อ แล้วเขียนลงใบงานว่า &quot;ถ้าเป็นเรา จะออกแบบยังไง&quot; ไม่ต้องมีคำตอบถูก ขอแค่คิดต่อจากโค้ดที่พิมพ์เองวันนี้ — ตรงนั้นแหละคือจุดที่น้องเริ่มเป็นวิศวกร ไม่ใช่แค่คนพิมพ์ตามเฉลย</p>
</blockquote>
