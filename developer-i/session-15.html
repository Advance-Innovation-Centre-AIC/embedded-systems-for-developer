<h1 id="%E0%B8%9A%E0%B8%97%E0%B9%80%E0%B8%A3%E0%B8%B5%E0%B8%A2%E0%B8%99%E0%B9%80%E0%B8%9A%E0%B8%B7%E0%B9%89%E0%B8%AD%E0%B8%87%E0%B8%AB%E0%B8%A5%E0%B8%B1%E0%B8%87-bonus">บทเรียนเบื้องหลัง (Bonus)</h1>
<h2 id="%E0%B8%97%E0%B8%B3%E0%B9%80%E0%B8%81%E0%B8%A1%E0%B9%83%E0%B8%AB%E0%B9%89%E0%B9%80%E0%B8%A5%E0%B9%88%E0%B8%99%E0%B9%84%E0%B8%94%E0%B9%89%E0%B8%88%E0%B8%A3%E0%B8%B4%E0%B8%87%E0%B8%9A%E0%B8%99%E0%B8%AE%E0%B8%B2%E0%B8%A3%E0%B9%8C%E0%B8%94%E0%B9%81%E0%B8%A7%E0%B8%A3%E0%B9%8C">ทำเกมให้เล่นได้จริงบนฮาร์ดแวร์</h2>
<div style="background:#0d1a2b;border-left:6px solid #4a90d9;border-radius:8px;padding:16px 22px;margin-top:14px;color:#e6edf3;">
<b style="color:#8ec5ff;">คาบพิเศษ — ไม่ได้มาจากตำรา แต่มาจากการนั่ง debug เกมบนบอร์ดจริงจนดึก</b>
<p>เกมทั้ง 4 ที่เราถอดกันมาทั้งคอร์ส (Snake / Flappy / Pong / Shooter) กว่าจะ &quot;เล่นได้ลื่นจริง&quot; บนบอร์ด PSoC Edge มันไม่ได้ราบรื่นตั้งแต่แรก มีอาการแปลก ๆ ที่ต้องไล่แก้ — จอเปื้อน นกตายก่อนเริ่ม เกมค้างกลางเฟรม Python หนืดกว่า C</p>
<p>วันนี้เราจะเปิดฝากล่องดู 4 บทเรียนวิศวกรรมที่ได้จากการแก้ของจริงเหล่านั้น</p>
</div>
<blockquote>
<p>ทุกบทเรียนในคาบนี้อ้างโค้ดจริงในไฟล์เกมที่น้อง ๆ ใช้อยู่ — <code>full_games/bentogame.py</code>, <code>flappy_full.py</code>, <code>shooter_full.py</code> เปิดตามได้เลย</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="2" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="2" style="--paginate:true;--theme:default;" data-marpit-pagination-total="18">
<h1 id="%E0%B8%81%E0%B9%88%E0%B8%AD%E0%B8%99%E0%B8%AD%E0%B8%B7%E0%B9%88%E0%B8%99--%E0%B8%9A%E0%B8%AD%E0%B8%A3%E0%B9%8C%E0%B8%94%E0%B8%82%E0%B8%AD%E0%B8%87%E0%B9%80%E0%B8%A3%E0%B8%B2%E0%B8%A1%E0%B8%B5%E0%B8%AA%E0%B8%AD%E0%B8%87%E0%B8%AA%E0%B8%A1%E0%B8%AD%E0%B8%87%E0%B8%97%E0%B8%B5%E0%B9%88%E0%B8%84%E0%B8%B8%E0%B8%A2%E0%B8%81%E0%B8%B1%E0%B8%99%E0%B8%94%E0%B9%89%E0%B8%A7%E0%B8%A2-%E0%B8%88%E0%B8%94%E0%B8%AB%E0%B8%A1%E0%B8%B2%E0%B8%A2">ก่อนอื่น — บอร์ดของเรามีสองสมองที่คุยกันด้วย &quot;จดหมาย&quot;</h1>
<p>บทเรียนทั้ง 4 มีรากเดียวกัน คือบอร์ด PSoC Edge เป็น SoC <strong>tri-core</strong> และเกมของเราวิ่งบน 2 คอร์ที่ทำงานคนละหน้าที่ แล้วส่งข้อความหากันข้าม core ผ่าน <strong>IPC</strong> (Inter-Processor Communication)</p>
<div style="text-align:center">
<svg width="820" height="210" viewBox="0 0 820 210" font-family="DejaVu Sans, sans-serif">
  <defs>
    <marker id="arR0" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="10" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#607d8b" /></marker>
  </defs>
  <rect x="30" y="55" width="250" height="100" rx="12" fill="#e3f2fd" stroke="#1565c0" stroke-width="2.5" />
  <text x="155" y="88" text-anchor="middle" font-size="18" font-weight="bold" fill="#0d47a1">CM33 — คอร์ Python</text>
  <text x="155" y="114" text-anchor="middle" font-size="13" fill="#333">รัน MicroPython + โค้ดเกมเรา</text>
  <text x="155" y="134" text-anchor="middle" font-size="13" fill="#333">`update()` / `move_to` / `keys()`</text>
  <rect x="540" y="55" width="250" height="100" rx="12" fill="#fff3e0" stroke="#ef6c00" stroke-width="2.5" />
  <text x="665" y="88" text-anchor="middle" font-size="18" font-weight="bold" fill="#e65100">CM55 — คอร์กราฟิก</text>
  <text x="665" y="114" text-anchor="middle" font-size="13" fill="#333">วาด LVGL widget ลงจอ</text>
  <text x="665" y="134" text-anchor="middle" font-size="13" fill="#333">แสดงผล 792×398 · เคลียร์พิกเซล</text>
  <path d="M282 88 H 536" stroke="#607d8b" stroke-width="2.4" marker-end="url(#arR0)" />
  <text x="409" y="78" text-anchor="middle" font-size="14" fill="#2e7d32" font-weight="bold">IPC message: "วาดกล่องนี้ที่ (x, y)"</text>
  <path d="M536 128 H 284" stroke="#607d8b" stroke-width="2.4" marker-end="url(#arR0)" />
  <text x="409" y="150" text-anchor="middle" font-size="13" fill="#c62828">ตอบกลับ: OK / "not ready" (ยังวาดไม่ทัน)</text>
</svg>
</div>
<ul>
<li><strong>CM33</strong> คิดกติกาเกม แต่วาดเองไม่ได้ — ต้อง &quot;ฝากจดหมาย&quot; ให้ CM55 วาดให้</li>
<li><strong>CM55</strong> เป็นคนวาดจริงลงจอ แต่มีจังหวะที่ยัง busy อยู่ ตอบกลับว่า <em>ยังไม่พร้อม</em></li>
</ul>
<blockquote>
<p>จำภาพนี้ไว้ทุกบทเรียน — <strong>การเรียก <code>move_to</code> / <code>resize</code> หนึ่งครั้ง = จดหมายข้าม core หนึ่งฉบับ</strong> ไม่ใช่การเขียนพิกเซลฟรี ๆ ในหน่วยความจำเดียวกัน นี่คือหัวใจที่ทำให้ embedded ต่างจากเขียนเกมบน PC</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="3" style="--paginate:true;--theme:default;" data-marpit-pagination-total="18">
<h1 id="%E0%B8%9A%E0%B8%97%E0%B9%80%E0%B8%A3%E0%B8%B5%E0%B8%A2%E0%B8%99-1--retry-%E0%B9%81%E0%B8%97%E0%B8%99-crash-%E0%B8%AE%E0%B8%B2%E0%B8%A3%E0%B9%8C%E0%B8%94%E0%B9%81%E0%B8%A7%E0%B8%A3%E0%B9%8C%E0%B8%A1%E0%B8%B5%E0%B8%88%E0%B8%B1%E0%B8%87%E0%B8%AB%E0%B8%A7%E0%B8%B0-%E0%B9%84%E0%B8%A1%E0%B9%88%E0%B8%9E%E0%B8%A3%E0%B9%89%E0%B8%AD%E0%B8%A1%E0%B8%8A%E0%B8%B1%E0%B9%88%E0%B8%A7%E0%B8%84%E0%B8%A3%E0%B8%B2%E0%B8%A7">บทเรียน 1 — Retry แทน Crash: ฮาร์ดแวร์มีจังหวะ &quot;ไม่พร้อมชั่วคราว&quot;</h1>
<p><strong>อาการที่เจอ:</strong> ฉากไหนที่ของเยอะ ๆ (เกิดศัตรู + ระเบิด + ดาว พร้อมกัน) บางเฟรม CM33 ส่งจดหมายไปวาดเร็วกว่าที่ CM55 จะรับไหว CM55 เลยตอบว่า <strong>&quot;not ready&quot;</strong> ถ้าเราปล่อยให้ error นี้เด้งขึ้นมา (<code>raise</code>) → <strong>เกมค้างตายกลางเฟรม</strong></p>
<p><strong>ความจริงของฮาร์ดแวร์:</strong> &quot;not ready&quot; ไม่ใช่ความผิดพลาด มันคือ <strong>backpressure</strong> — สัญญาณว่า &quot;ช้าลงหน่อย เดี๋ยวฉันตามทัน&quot; สภาวะแบบนี้เป็นเรื่อง<em>ปกติ</em>และ<em>ชั่วคราว</em> รอไม่กี่มิลลิวินาทีมันก็หายเอง</p>
<svg viewBox="0 0 720 150" width="88%" font-family="sans-serif">
  <defs><marker id="arL1" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="10" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#607d8b" /></marker></defs>
  <rect x="10" y="20" width="150" height="46" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" />
  <text x="85" y="40" text-anchor="middle" font-size="13" font-weight="bold" fill="#0d47a1">เรียก ui.pos()</text>
  <text x="85" y="57" text-anchor="middle" font-size="11" fill="#555">ส่งจดหมายไป CM55</text>
  <polygon points="290,10 360,43 290,76 220,43" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="2" />
  <text x="290" y="40" text-anchor="middle" font-size="12" font-weight="bold" fill="#6a1b9a">not ready?</text>
  <path d="M160 43 H 218" stroke="#607d8b" stroke-width="2.2" marker-end="url(#arL1)" />
  <rect x="420" y="8" width="180" height="42" rx="10" fill="#fff3e0" stroke="#ef6c00" stroke-width="2" />
  <text x="510" y="27" text-anchor="middle" font-size="12" font-weight="bold" fill="#e65100">รอ 15ms แล้วลองใหม่</text>
  <text x="510" y="43" text-anchor="middle" font-size="11" fill="#555">สูงสุด 40 ครั้ง (~0.6s)</text>
  <path d="M290 10 C 340 -6 380 -2 430 8" fill="none" stroke="#607d8b" stroke-width="2.2" marker-end="url(#arL1)" />
  <text x="360" y="-2" text-anchor="middle" font-size="11" fill="#e65100">ใช่ (ชั่วคราว)</text>
  <path d="M420 40 C 380 60 340 70 292 74" fill="none" stroke="#9e9e9e" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arL1)" />
  <rect x="420" y="96" width="180" height="42" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" />
  <text x="510" y="115" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b5e20">วาดสำเร็จ → คืนค่า</text>
  <text x="510" y="131" text-anchor="middle" font-size="11" fill="#555">เกมเดินต่อ ไม่ crash</text>
  <path d="M290 76 V 117 H 418" stroke="#607d8b" stroke-width="2.2" marker-end="url(#arL1)" />
  <text x="250" y="106" font-size="11" fill="#2e7d32">ไม่ (พร้อมแล้ว)</text>
</svg>
<blockquote>
<p>error จริง ๆ (เช่นชื่อ widget ผิด) ยังต้อง <code>raise</code> เหมือนเดิม เรา retry <strong>เฉพาะ</strong> อาการ &quot;not ready&quot; ที่รู้ว่าเป็นของชั่วคราวเท่านั้น — ไม่ใช่กลืน error ทุกชนิด</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="4" style="--paginate:true;--theme:default;" data-marpit-pagination-total="18">
<h1 id="%E0%B8%9A%E0%B8%97%E0%B9%80%E0%B8%A3%E0%B8%B5%E0%B8%A2%E0%B8%99-1-%E0%B8%95%E0%B9%88%E0%B8%AD--%E0%B9%82%E0%B8%84%E0%B9%89%E0%B8%94%E0%B8%88%E0%B8%A3%E0%B8%B4%E0%B8%87-helper-_r-%E0%B9%83%E0%B8%99-bentogamepy">บทเรียน 1 (ต่อ) — โค้ดจริง: helper <code>_r()</code> ใน <code>bentogame.py</code></h1>
<p>ทุกคำสั่งที่ engine ส่งไป CM55 ถูกห่อด้วย helper ตัวเดียวชื่อ <code>_r()</code> (<code>bentogame.py:117</code>) — คำว่า <code>_r</code> ย่อจาก <em>retry</em>:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">def</span> <span class="hljs-title function_">_r</span>(<span class="hljs-params">fn, *a, **k</span>):
    <span class="hljs-string">&quot;&quot;&quot;Retry a ui call while CM55 signals transient &quot;not ready&quot; backpressure
    (the same tolerance start() already uses for ui.screen). A heavy scene can
    briefly outrun the CM55 graphics core; retrying instead of raising keeps the
    game from crashing mid-frame.&quot;&quot;&quot;</span>
    <span class="hljs-keyword">for</span> _ <span class="hljs-keyword">in</span> <span class="hljs-built_in">range</span>(<span class="hljs-number">40</span>):                    <span class="hljs-comment"># ลองใหม่ได้สูงสุด 40 ครั้ง = bounded loop</span>
        <span class="hljs-keyword">try</span>:
            <span class="hljs-keyword">return</span> fn(*a, **k)             <span class="hljs-comment"># สำเร็จ → คืนค่าออกทันที</span>
        <span class="hljs-keyword">except</span> Exception <span class="hljs-keyword">as</span> _e:
            <span class="hljs-keyword">if</span> <span class="hljs-string">&quot;not ready&quot;</span> <span class="hljs-keyword">in</span> <span class="hljs-built_in">str</span>(_e):     <span class="hljs-comment"># เฉพาะ backpressure ชั่วคราวเท่านั้น</span>
                time.sleep_ms(<span class="hljs-number">15</span>)          <span class="hljs-comment"># ถอยหลัง 15ms ให้ CM55 ตามทัน</span>
                <span class="hljs-keyword">continue</span>
            <span class="hljs-keyword">raise</span>                          <span class="hljs-comment"># error อื่น ๆ = ของจริง ปล่อยให้เด้ง</span>
    <span class="hljs-keyword">return</span> fn(*a, **k)                     <span class="hljs-comment"># ครบ 40 ครั้งยังไม่ได้ = ยอมให้ error จริง</span>
</code></pre>
<p>เวลาเราเรียก <code>box.move_to(x, y)</code> ข้างในมันคือ <code>_r(self._panel.pos, ...)</code> (<code>bentogame.py:234</code>) — เท่ากับว่า <strong>ทุกการขยับ widget ผ่านตาข่ายนิรภัยตัวนี้หมด</strong> โดยที่โค้ดเกม (30% ที่เราเขียน) ไม่ต้องรู้เรื่องเลย</p>
<div style="background:#e8f5e9;border-left:6px solid #2e7d32;padding:10px 16px;margin-top:8px;">
<b>บทเรียนที่พกกลับบ้าน:</b> บนฮาร์ดแวร์ สภาวะ "ไม่พร้อมชั่วคราว" (bus busy, buffer full, device warming up) เป็นเรื่องปกติ — จัดการด้วย <b>bounded retry</b> (ลองซ้ำแบบมีเพดาน) อย่ามองว่ามันคือความล้มเหลวที่ต้อง crash ทันที
</div>
<blockquote>
<p>ทำไมต้อง &quot;bounded&quot; (<code>range(40)</code>) ไม่ใช่ <code>while True</code>? เพราะถ้า CM55 ตายจริง ๆ เราต้องยอมให้ error หลุดออกมา ไม่ใช่ค้างวนไม่รู้จบ — retry ที่ดีต้องมีเพดานเสมอ</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="5" style="--paginate:true;--theme:default;" data-marpit-pagination-total="18">
<h1 id="%E0%B8%9A%E0%B8%97%E0%B9%80%E0%B8%A3%E0%B8%B5%E0%B8%A2%E0%B8%99-2--ipc-%E0%B8%A1%E0%B8%B5%E0%B8%A3%E0%B8%B2%E0%B8%84%E0%B8%B2-%E0%B8%97%E0%B8%B3%E0%B9%84%E0%B8%A1-python-%E0%B8%8A%E0%B9%89%E0%B8%B2%E0%B8%81%E0%B8%A7%E0%B9%88%E0%B8%B2-c-%E0%B8%9A%E0%B8%99%E0%B8%9A%E0%B8%AD%E0%B8%A3%E0%B9%8C%E0%B8%94%E0%B9%80%E0%B8%94%E0%B8%B5%E0%B8%A2%E0%B8%A7%E0%B8%81%E0%B8%B1%E0%B8%99">บทเรียน 2 — IPC มีราคา: ทำไม Python ช้ากว่า C บนบอร์ดเดียวกัน</h1>
<p><strong>อาการที่เจอ:</strong> เกม Shooter เวอร์ชัน Python รู้สึก <strong>&quot;หนืด&quot;</strong> — ทั้งที่เกม C บนบอร์ดเดียวกันลื่นปรื๊ด ทำไม? มันคือ CPU เดียวกันนี่นา</p>
<p><strong>สาเหตุที่แท้จริง:</strong> ไม่ใช่ Python คำนวณช้า — แต่เป็น<strong>จำนวนจดหมายข้าม core ต่อเฟรม</strong> ทุก <code>move_to</code> หนึ่งครั้ง = IPC หนึ่งฉบับ CM33→CM55 เกมมีศัตรู + กระสุน + ระเบิด ยิ่งของบนจอเยอะ จดหมายต่อเฟรมยิ่งเยอะ → คอขวดอยู่ที่ <strong>จำนวน IPC round-trip ไม่ใช่ที่ความเร็ว CPU</strong></p>
<svg viewBox="0 0 740 170" width="94%" font-family="sans-serif">
  <defs><marker id="arL2" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="10" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#ef6c00" /></marker></defs>
  <rect x="20" y="45" width="200" height="80" rx="12" fill="#e3f2fd" stroke="#1565c0" stroke-width="2.5" />
  <text x="120" y="78" text-anchor="middle" font-size="15" font-weight="bold" fill="#0d47a1">CM33 (Python)</text>
  <text x="120" y="102" text-anchor="middle" font-size="12" fill="#555">วน move_to ทุก object</text>
  <rect x="520" y="45" width="200" height="80" rx="12" fill="#fff3e0" stroke="#ef6c00" stroke-width="2.5" />
  <text x="620" y="78" text-anchor="middle" font-size="15" font-weight="bold" fill="#e65100">CM55 (จอ)</text>
  <text x="620" y="102" text-anchor="middle" font-size="12" fill="#555">วาดทีละใบตามจดหมาย</text>
  <path d="M222 62 H 518" stroke="#ef6c00" stroke-width="2" marker-end="url(#arL2)" />
  <path d="M222 78 H 518" stroke="#ef6c00" stroke-width="2" marker-end="url(#arL2)" />
  <path d="M222 94 H 518" stroke="#ef6c00" stroke-width="2" marker-end="url(#arL2)" />
  <path d="M222 110 H 518" stroke="#ef6c00" stroke-width="2" marker-end="url(#arL2)" />
  <text x="370" y="38" text-anchor="middle" font-size="13" fill="#c62828" font-weight="bold">~10–15 IPC msg / เฟรม (ยิ่งวัตถุมาก ยิ่งเยอะ)</text>
  <text x="370" y="148" text-anchor="middle" font-size="12" fill="#666" font-style="italic">C วิ่ง LVGL บน CM55 ตรง ๆ → ไม่มี IPC ต่อ object เลย จึงถือ 8/6 ไหว</text>
</svg>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="6" style="--paginate:true;--theme:default;" data-marpit-pagination-total="18">
<h1 id="%E0%B8%9A%E0%B8%97%E0%B9%80%E0%B8%A3%E0%B8%B5%E0%B8%A2%E0%B8%99-2-%E0%B8%95%E0%B9%88%E0%B8%AD--%E0%B8%A7%E0%B8%B4%E0%B8%98%E0%B8%B5%E0%B9%81%E0%B8%81%E0%B9%89-%E0%B8%A5%E0%B8%94-%E0%B8%88%E0%B8%B3%E0%B8%99%E0%B8%A7%E0%B8%99-object-%E0%B9%84%E0%B8%A1%E0%B9%88%E0%B9%83%E0%B8%8A%E0%B9%88%E0%B9%80%E0%B8%82%E0%B8%B5%E0%B8%A2%E0%B8%99%E0%B9%82%E0%B8%84%E0%B9%89%E0%B8%94%E0%B9%83%E0%B8%AB%E0%B9%89%E0%B9%80%E0%B8%A3%E0%B9%87%E0%B8%A7%E0%B8%82%E0%B8%B6%E0%B9%89%E0%B8%99">บทเรียน 2 (ต่อ) — วิธีแก้: ลด &quot;จำนวน object&quot; ไม่ใช่เขียนโค้ดให้เร็วขึ้น</h1>
<p>fix จริงอยู่ที่ <code>shooter_full.py:30</code> — ลดจำนวนศัตรูกับกระสุนสูงสุดลง:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-comment"># ก่อนแก้:  EMAX, BMAX = 8, 6   ← เท่าเกม C (แต่ Python ส่ง IPC ต่อ object ไม่ไหว → หนืด)</span>
EMAX, BMAX, BOOMMAX, STARS = <span class="hljs-number">5</span>, <span class="hljs-number">4</span>, <span class="hljs-number">3</span>, <span class="hljs-number">5</span>   <span class="hljs-comment"># จุดสมดุล: object น้อยพอให้ลื่น แต่ยังมี action</span>
</code></pre>
<p>comment ในไฟล์ยังคำนวณ &quot;งบ widget&quot; ไว้ให้เห็น (<code>shooter_full.py:25–29</code>) — เกม C ถือได้ <em>ศัตรู 8 + กระสุน 6</em> เพราะมันวาดเองบน CM55 ไม่ต้องส่ง IPC ต่อชิ้น แต่ Python ต้องส่ง เราจึงเลือก <strong>budget จำนวน object บนจอ</strong> ให้พอดีกับ IPC ที่ไหวใน 1 เฟรม</p>
<div style="display:flex;gap:16px;margin-top:6px;">
<div style="flex:1;border:2px solid #c62828;border-radius:10px;padding:10px 14px;background:#ffebee;">
<b>เข้าใจผิด</b><br />"เกมหนืด = Python คำนวณช้า → ต้อง optimize เลข"
</div>
<div style="flex:1;border:2px solid #2e7d32;border-radius:10px;padding:10px 14px;background:#e8f5e9;">
<b>ความจริง</b><br />"เกมหนืด = ส่งจดหมายข้าม core เยอะเกิน → ลดจำนวนวัตถุบนจอ"
</div>
</div>
<blockquote>
<p><strong>โยงกับคาบ 11 (Object Pool):</strong> pool ช่วยไม่ให้ <em>สร้าง</em> object ใหม่ทุกเฟรม (ประหยัด RAM) ส่วนบทเรียนนี้บอกให้ <em>budget จำนวน</em> object ที่ขยับพร้อมกัน (ประหยัด IPC) — สองเรื่องนี้ทำงานคู่กัน: จำนวน widget คงที่ <strong>และ</strong> ไม่มากเกินงบ IPC ต่อเฟรม</p>
</blockquote>
<div style="background:#e8f5e9;border-left:6px solid #2e7d32;padding:10px 16px;margin-top:8px;">
<b>บทเรียนที่พกกลับบ้าน:</b> บนระบบ message-passing สองคอร์ คอขวดมักคือ <b>จำนวน cross-core call ต่อเฟรม</b> ไม่ใช่ความเร็ว CPU — วัดที่ "กี่ครั้งต่อเฟรม" ก่อนจะไปไล่ optimize อย่างอื่น
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="7" style="--paginate:true;--theme:default;" data-marpit-pagination-total="18">
<h1 id="%E0%B8%9A%E0%B8%97%E0%B9%80%E0%B8%A3%E0%B8%B5%E0%B8%A2%E0%B8%99-3--%E0%B8%AD%E0%B8%A2%E0%B9%88%E0%B8%B2-resize-%E0%B8%97%E0%B8%B8%E0%B8%81%E0%B9%80%E0%B8%9F%E0%B8%A3%E0%B8%A1-%E0%B8%A3%E0%B8%AD%E0%B8%A2%E0%B9%80%E0%B8%9B%E0%B8%B7%E0%B9%89%E0%B8%AD%E0%B8%99-render-trail">บทเรียน 3 — อย่า resize ทุกเฟรม: รอยเปื้อน (render trail)</h1>
<p><strong>อาการที่เจอ:</strong> ท่อในเกม Flappy เคยถูก <code>resize()</code> ทุกเฟรม เพื่อ &quot;ตัด&quot; ความสูงให้พอดีขอบจอ ผลคือ CM55 วาดท่อขนาดใหม่ทับ แต่ <strong>ไม่ได้เคลียร์พิกเซลเดิมที่ท่อเคยกินไว้</strong> → เกิด <strong>รอยเขียวลากเฉียง + เส้นดำขวางจอ</strong> (scanline)</p>
<svg viewBox="0 0 720 200" width="92%" font-family="sans-serif">
  
  <text x="180" y="20" text-anchor="middle" font-size="14" font-weight="bold" fill="#c62828">resize() ทุกเฟรม → เปื้อน</text>
  <rect x="40" y="30" width="280" height="150" rx="8" fill="#0d1117" stroke="#30363d" />
  
  <rect x="70" y="40" width="34" height="70" fill="#2e7d32" opacity="0.25" />
  <rect x="110" y="40" width="34" height="90" fill="#2e7d32" opacity="0.4" />
  <rect x="150" y="40" width="34" height="60" fill="#2e7d32" opacity="0.6" />
  <rect x="190" y="40" width="34" height="100" fill="#43a047" />
  <line x1="48" y1="95" x2="312" y2="120" stroke="#00e676" stroke-width="2" opacity="0.5" />
  <line x1="48" y1="150" x2="312" y2="150" stroke="#111" stroke-width="3" />
  <text x="180" y="172" text-anchor="middle" font-size="11" fill="#8b949e">พิกเซลเก่าไม่ถูกเคลียร์ = ghost</text>
  
  <text x="540" y="20" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e7d32">กล่องสูงเต็มจอ + move_to → สะอาด</text>
  <rect x="400" y="30" width="280" height="150" rx="8" fill="#0d1117" stroke="#30363d" />
  <rect x="540" y="30" width="40" height="55" fill="#43a047" />
  <rect x="540" y="125" width="40" height="55" fill="#43a047" />
  <text x="560" y="110" text-anchor="middle" font-size="11" fill="#8ec5ff">ช่องว่าง</text>
  <text x="540" y="172" text-anchor="middle" font-size="11" fill="#8b949e">ท่อยาวพ้นขอบ → ฮาร์ดแวร์ตัดให้เอง</text>
</svg>
<p><strong>เหตุใด <code>resize</code> จึงเปื้อน:</strong> <code>resize()</code> เรียก <code>ui.size</code> (<code>bentogame.py:254</code>) เปลี่ยนขนาด widget — พื้นที่ที่ widget &quot;หด&quot; ออกไป CM55 ไม่ได้ถือว่าเป็นหน้าที่ต้องทาสีพื้นหลังทับให้ พิกเซลเก่าจึงค้างเป็นรอย</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="8" style="--paginate:true;--theme:default;" data-marpit-pagination-total="18">
<h1 id="%E0%B8%9A%E0%B8%97%E0%B9%80%E0%B8%A3%E0%B8%B5%E0%B8%A2%E0%B8%99-3-%E0%B8%95%E0%B9%88%E0%B8%AD--%E0%B8%A7%E0%B8%B4%E0%B8%98%E0%B8%B5%E0%B9%81%E0%B8%81%E0%B9%89-fixed-size--reposition-%E0%B9%80%E0%B8%97%E0%B9%88%E0%B8%B2%E0%B8%99%E0%B8%B1%E0%B9%89%E0%B8%99">บทเรียน 3 (ต่อ) — วิธีแก้: fixed-size + reposition เท่านั้น</h1>
<p>fix ใน <code>flappy_full.py</code> เปลี่ยนวิธีคิดเรื่องท่อทั้งหมด — ท่อเป็นกล่อง <strong>&quot;สูงเต็มสนาม&quot; สร้างครั้งเดียว ไม่ resize อีกเลย</strong> (<code>flappy_full.py:22, 66</code>):</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">PIPE_W = <span class="hljs-number">64</span>   <span class="hljs-comment"># ความกว้างท่อ (คงที่ — ท่อเป็นกล่องสูงเต็มจอ ไม่ resize เลย)</span>

<span class="hljs-comment"># ท่อบน/ล่างเป็นกล่อง &quot;สูงเต็มสนาม&quot; (PIPE_W x PLAY_H) สร้างครั้งเดียว ไม่ resize อีกเลย</span>
parts = {<span class="hljs-string">&quot;top&quot;</span>: game.Box(-<span class="hljs-number">200</span>, <span class="hljs-number">0</span>, PIPE_W, PLAY_H, game.GB_DARK),
         <span class="hljs-string">&quot;bot&quot;</span>: game.Box(-<span class="hljs-number">200</span>, <span class="hljs-number">0</span>, PIPE_W, PLAY_H, game.GB_DARK), ...}
</code></pre>
<p>ช่องว่างระหว่างท่อไม่ได้เกิดจากการ <em>ย่อ</em> ท่อ แต่เกิดจากการ <em>เลื่อน</em> ท่อยาว ๆ ให้โผล่จากขอบบน/ขอบล่าง แล้วส่วนที่ล้นออกนอกจอ <strong>ปล่อยให้ฮาร์ดแวร์ clip ทิ้ง</strong> — ทุกเฟรมทำแค่ <code>move_to</code> (<code>flappy_full.py:113–128</code>):</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">def</span> <span class="hljs-title function_">render_pipe</span>(<span class="hljs-params">pipe</span>):
    <span class="hljs-comment"># ต่อเฟรม: &quot;เลื่อนอย่างเดียว&quot; ไม่ resize — ท่อสูงเต็มจอ ส่วนพ้นขอบให้ฮาร์ดแวร์ตัด</span>
    pipe[<span class="hljs-string">&quot;top&quot;</span>].move_to(x, pipe[<span class="hljs-string">&quot;gap_top&quot;</span>] - PLAY_H)   <span class="hljs-comment"># ขอบล่างของท่อบน = ขอบช่องบน</span>
    pipe[<span class="hljs-string">&quot;bot&quot;</span>].move_to(x, pipe[<span class="hljs-string">&quot;gap_bot&quot;</span>])            <span class="hljs-comment"># ขอบบนของท่อล่าง = ขอบช่องล่าง</span>
</code></pre>
<div style="background:#e8f5e9;border-left:6px solid #2e7d32;padding:10px 16px;margin-top:8px;">
<b>บทเรียนที่พกกลับบ้าน:</b> การ <b>ย้าย</b> widget (move_to) ราคาถูกและสะอาด · การ <b>resize ทุกเฟรม</b> อาจทิ้งรอยเพราะพื้นที่ที่หดไปไม่ถูกทาทับ — เลือก <b>fixed-size + reposition</b> แล้วให้ hardware clip ที่ขอบจอ
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="9" style="--paginate:true;--theme:default;" data-marpit-pagination-total="18">
<h1 id="%E0%B8%9A%E0%B8%97%E0%B9%80%E0%B8%A3%E0%B8%B5%E0%B8%A2%E0%B8%99-4--%E0%B9%80%E0%B8%9C%E0%B8%B7%E0%B9%88%E0%B8%AD%E0%B9%80%E0%B8%A7%E0%B8%A5%E0%B8%B2%E0%B9%83%E0%B8%AB%E0%B9%89%E0%B8%88%E0%B8%AD%E0%B8%A7%E0%B8%B2%E0%B8%94-hover--grace-period">บทเรียน 4 — เผื่อเวลาให้จอวาด: hover + grace period</h1>
<p><strong>อาการที่เจอ:</strong> พอปิดเมนูเลือกโหมด ฉากเกมต้อง recomposite ใหม่ใช้เวลา ~3–4 วินาที ระหว่างนั้นถ้าเกมเริ่มนับฟิสิกส์ทันที <strong>นกจะร่วง + ตายก่อนที่ผู้เล่นจะทันเห็นจอด้วยซ้ำ</strong> — แพ้แบบงง ๆ ทั้งที่ยังไม่ได้เล่น</p>
<p><strong>วิธีแก้ 2 ชั้น</strong> ใน <code>flappy_full.py</code>:</p>
<ol>
<li><strong>hover</strong> — นกลอยนิ่งกลางจอ <em>ไม่มีแรงโน้มถ่วง</em> จนกว่าจะกระพือครั้งแรก (<code>started</code> flag, <code>flappy_full.py:150, 180</code>)</li>
<li><strong>grace period</strong> — 4 วินาทีแรกหลังออกตัว นกจะ <em>ตายไม่ได้</em> ครอบช่วงที่จอกำลังวาดพอดี (<code>flappy_full.py:186</code>)</li>
</ol>
<svg viewBox="0 0 740 150" width="94%" font-family="sans-serif">
  <defs><marker id="arL4" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="10" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#607d8b" /></marker></defs>
  <line x1="30" y1="80" x2="710" y2="80" stroke="#607d8b" stroke-width="2.5" marker-end="url(#arL4)" />
  
  <rect x="30" y="55" width="200" height="50" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" />
  <text x="130" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#0d47a1">HOVER (ไม่จำกัดเวลา)</text>
  <text x="130" y="94" text-anchor="middle" font-size="11" fill="#555">นกลอยรอ · ไม่มี gravity</text>
  
  <rect x="230" y="55" width="230" height="50" rx="8" fill="#fff3e0" stroke="#ef6c00" stroke-width="2" />
  <text x="345" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#e65100">GRACE 4 วินาที</text>
  <text x="345" y="94" text-anchor="middle" font-size="11" fill="#555">บินได้ · แต่ตายไม่ได้ (จอกำลังวาด)</text>
  
  <rect x="460" y="55" width="250" height="50" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" />
  <text x="585" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b5e20">เล่นจริง (ตายได้)</text>
  <text x="585" y="94" text-anchor="middle" font-size="11" fill="#555">ชนท่อ/ตกพื้น = จบ</text>
  <text x="230" y="128" text-anchor="middle" font-size="12" fill="#1565c0">↑ กระพือครั้งแรก = ออกตัว</text>
  <text x="460" y="128" text-anchor="middle" font-size="12" fill="#ef6c00">↑ ครบ 4 วิ = ความเสี่ยงเปิด</text>
</svg>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="10" style="--paginate:true;--theme:default;" data-marpit-pagination-total="18">
<h1 id="%E0%B8%9A%E0%B8%97%E0%B9%80%E0%B8%A3%E0%B8%B5%E0%B8%A2%E0%B8%99-4-%E0%B8%95%E0%B9%88%E0%B8%AD--%E0%B9%82%E0%B8%84%E0%B9%89%E0%B8%94%E0%B8%88%E0%B8%A3%E0%B8%B4%E0%B8%87-started--grace">บทเรียน 4 (ต่อ) — โค้ดจริง: <code>started</code> + <code>grace</code></h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">started = <span class="hljs-literal">False</span>       <span class="hljs-comment"># ยังไม่เริ่มบิน — นกลอยรอจนกระพือครั้งแรก  (:150)</span>
start_ms = <span class="hljs-number">0</span>          <span class="hljs-comment"># เวลาที่ออกตัว — ใช้คุมช่วง grace 4 วิแรก (นกตายไม่ได้)</span>

<span class="hljs-keyword">def</span> <span class="hljs-title function_">update</span>():
    ...
    <span class="hljs-keyword">if</span> <span class="hljs-keyword">not</span> started:                    <span class="hljs-comment"># ยังไม่ออกตัว: นกลอยรอกลางจอ ไม่มีแรงโน้มถ่วง</span>
        <span class="hljs-keyword">if</span> <span class="hljs-keyword">not</span> (flap_a <span class="hljs-keyword">or</span> flap_up):
            <span class="hljs-keyword">return</span>                       <span class="hljs-comment"># ให้ผู้เล่นพร้อม (ฉากวาดครบตั้งแต่หน้าเมนูแล้ว)</span>
        started = <span class="hljs-literal">True</span>                    <span class="hljs-comment"># กระพือครั้งแรก = ออกบิน</span>
        start_ms = now                     <span class="hljs-comment"># เริ่มจับเวลา grace 4 วิ</span>

    grace = time.ticks_diff(now, start_ms) &lt; <span class="hljs-number">4000</span>   <span class="hljs-comment"># 4 วิแรก: นกตายไม่ได้ (ครอบช่วงจอกำลังวาด)</span>
    ...
    <span class="hljs-keyword">if</span> bird_y &gt; PLAY_H - BIRD_BOX / <span class="hljs-number">2</span>:     <span class="hljs-comment"># ร่วงถึงพื้น</span>
        <span class="hljs-keyword">if</span> grace:                          <span class="hljs-comment"># ช่วง grace: ไม่ตาย แค่หยุดที่พื้น</span>
            bird_y, velocity_y = PLAY_H - BIRD_BOX / <span class="hljs-number">2</span>, <span class="hljs-number">0.0</span>
        <span class="hljs-keyword">else</span>:
            <span class="hljs-keyword">return</span> <span class="hljs-literal">False</span>                   <span class="hljs-comment"># หมด grace แล้วถึงตายจริง</span>
    ...
    <span class="hljs-keyword">if</span> hit_pipe(pipe) <span class="hljs-keyword">and</span> <span class="hljs-keyword">not</span> grace:       <span class="hljs-comment"># ช่วง grace 4 วิแรก: ชนท่อไม่ตาย  (:220)</span>
        <span class="hljs-keyword">return</span> <span class="hljs-literal">False</span>
</code></pre>
<p>นี่คือดีไซน์ Flappy คลาสสิก <strong>&quot;tap to start&quot;</strong> — เกมไม่เริ่มเดินจนกว่าผู้เล่นจะพร้อม แล้วให้ช่วงผ่อนผันตอนต้นเกม เพื่อกลบ latency ของจอจริง</p>
<div style="background:#e8f5e9;border-left:6px solid #2e7d32;padding:10px 16px;margin-top:8px;">
<b>บทเรียนที่พกกลับบ้าน:</b> จอจริงมี latency — ออกแบบ <b>วินาทีแรกของเกมให้ให้อภัย</b> (hover จนผู้เล่นสั่งเริ่ม + grace period กันตายช่วงจอกำลังวาด) อย่าให้ผู้เล่นแพ้เพราะฮาร์ดแวร์ยังวาดไม่เสร็จ
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="11" style="--paginate:true;--theme:default;" data-marpit-pagination-total="18">
<h1 id="%E0%B8%AA%E0%B8%A3%E0%B8%B8%E0%B8%9B-4-%E0%B8%9A%E0%B8%97%E0%B9%80%E0%B8%A3%E0%B8%B5%E0%B8%A2%E0%B8%99--%E0%B8%AD%E0%B8%B2%E0%B8%81%E0%B8%B2%E0%B8%A3-%E2%86%92-%E0%B8%AA%E0%B8%B2%E0%B9%80%E0%B8%AB%E0%B8%95%E0%B8%B8-%E2%86%92-%E0%B8%A7%E0%B8%B4%E0%B8%98%E0%B8%B5%E0%B9%81%E0%B8%81%E0%B9%89-%E2%86%92-%E0%B8%9A%E0%B8%97%E0%B9%80%E0%B8%A3%E0%B8%B5%E0%B8%A2%E0%B8%99">สรุป 4 บทเรียน — อาการ → สาเหตุ → วิธีแก้ → บทเรียน</h1>
<div style="font-size:0.92em;">
<table>
<thead>
<tr>
<th>อาการ (symptom)</th>
<th>สาเหตุจริง (root cause)</th>
<th>วิธีแก้ (fix)</th>
<th>บทเรียนที่ใช้ต่อได้</th>
</tr>
</thead>
<tbody>
<tr>
<td>เกมค้างตายกลางเฟรมตอนฉากหนัก</td>
<td>CM55 ส่ง backpressure &quot;not ready&quot; ชั่วคราว แล้วโค้ด <code>raise</code></td>
<td><code>_r()</code> bounded retry 40 ครั้ง × 15ms เฉพาะ &quot;not ready&quot; (<code>bentogame.py:117</code>)</td>
<td>สภาวะ &quot;ไม่พร้อมชั่วคราว&quot; ของ HW เป็นเรื่องปกติ → <strong>bounded retry</strong> ไม่ใช่ crash</td>
</tr>
<tr>
<td>Shooter Python หนืด แต่ C ลื่น</td>
<td>IPC ต่อ object เยอะเกินงบต่อเฟรม (ไม่ใช่ CPU ช้า)</td>
<td>ลด <code>EMAX,BMAX</code> 8,6 → 5,4 (<code>shooter_full.py:30</code>)</td>
<td>คอขวดคือ <strong>จำนวน cross-core call ต่อเฟรม</strong> → budget จำนวน object</td>
</tr>
<tr>
<td>จอเปื้อนรอยเขียวเฉียง + เส้นดำ</td>
<td><code>resize()</code> ทุกเฟรม → พิกเซลเก่าไม่ถูกเคลียร์</td>
<td>ท่อกล่องสูงเต็มจอ สร้างครั้งเดียว + <code>move_to</code> เท่านั้น (<code>flappy_full.py:66,113</code>)</td>
<td><strong>fixed-size + reposition</strong> สะอาดกว่า resize ทุกเฟรม ให้ HW clip</td>
</tr>
<tr>
<td>นกตกตายก่อนผู้เล่นเห็นจอ</td>
<td>จอ recomposite ~4s หลังปิดเมนู (latency)</td>
<td><code>started</code> hover + <code>grace</code> 4s กันตาย (<code>flappy_full.py:150,186</code>)</td>
<td>จอมี latency → <strong>ออกแบบวินาทีแรกให้ให้อภัย</strong> (tap to start)</td>
</tr>
</tbody>
</table>
</div>
<div style="background:#0d1a2b;border-left:6px solid #4a90d9;border-radius:8px;padding:12px 20px;margin-top:10px;color:#e6edf3;">
เส้นด้ายเดียวกันของทั้ง 4 บทเรียน: <b>ฮาร์ดแวร์จริงไม่ใช่ตัวจำลองในอุดมคติ</b> — มันมีสองคอร์ที่ต้องคุยกัน มี latency มีจังหวะไม่พร้อม และมีงบที่จำกัด วิศวกรที่ดีไม่ได้เขียนโค้ดให้ "ถูกต้องบนกระดาษ" แต่เขียนให้ "ทำงานได้จริงกับฮาร์ดแวร์ที่มีอยู่จริง"
</div>
<blockquote>
<p>ครั้งหน้าที่น้อง ๆ เจอเกม (หรือระบบ embedded อะไรก็ตาม) ทำงานแปลก ๆ ลองถามตัวเอง 4 คำถามนี้: มีจังหวะ <em>ไม่พร้อมชั่วคราว</em> ไหม? · ส่งข้าม core <em>กี่ครั้งต่อเฟรม</em>? · วาดทับแล้ว <em>เคลียร์ของเก่าหรือยัง</em>? · เผื่อ <em>latency</em> ให้จอแล้วหรือยัง?</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="12" style="--paginate:true;--theme:default;" data-marpit-pagination-total="18">
<h1 id="%E0%B9%80%E0%B8%9B%E0%B8%B4%E0%B8%94%E0%B8%9D%E0%B8%B2%E0%B8%81%E0%B8%A5%E0%B9%88%E0%B8%AD%E0%B8%87%E0%B9%80%E0%B8%84%E0%B8%A3%E0%B8%B7%E0%B9%88%E0%B8%AD%E0%B8%87%E0%B8%A1%E0%B8%B7%E0%B8%AD--bentogamepy-%E0%B8%84%E0%B8%B7%E0%B8%AD-%E0%B9%80%E0%B8%89%E0%B8%A5%E0%B8%A2-%E0%B8%97%E0%B8%B5%E0%B9%88%E0%B9%80%E0%B8%A3%E0%B8%B2%E0%B9%83%E0%B8%8A%E0%B9%89%E0%B8%AD%E0%B8%A2%E0%B8%B9%E0%B9%88%E0%B8%97%E0%B8%B8%E0%B8%81%E0%B8%84%E0%B8%B2%E0%B8%9A">เปิดฝากล่องเครื่องมือ — <code>bentogame.py</code> คือ &quot;เฉลย&quot; ที่เราใช้อยู่ทุกคาบ</h1>
<p>ทั้งคอร์สเราเขียนเกมด้วยของแค่หกอย่าง: <code>start()</code>, <code>Box</code>, <code>Text</code>, <code>keys()</code>, <code>hit()</code>, <code>run()</code> (<code>bentogame.py:6-7</code>) หกคำนี้ทำให้นิสิตปี 2 ที่ยังไม่แข็ง C ก็ทำเกมจริงเล่นบนบอร์ดได้ คำถามของคาบนี้คือ ใต้หกคำนั้นมีอะไรอยู่ และทำไมมันถึงไม่พังเวลาเจอฮาร์ดแวร์จริง</p>
<ul>
<li>เฉลยชุดนี้ต่างจากไฟล์ฝึกคาบอื่น — <code>bentogame.py</code> ไม่ใช่ 30% ที่ต้องเติม แต่เป็น <strong>engine ที่รองอยู่ใต้เกมของน้องทุกเกม</strong> &quot;เฉลย&quot; ที่นี่คือการอ่านให้เข้าใจว่ามันเลือกออกแบบแบบนี้ทำไม</li>
<li>วิธีใช้ยังเหมือนเฉลยทุกครั้ง (<code>solution_codes/README.md</code>): อ่านให้เข้าใจ <strong>ปิดไฟล์ แล้วอธิบายด้วยคำพูดตัวเอง</strong> ว่าแต่ละท่อนแก้ปัญหาฮาร์ดแวร์ตัวไหน ไม่ใช่ท่องโค้ด</li>
<li>พออ่านจบ น้องจะ <strong>ต่อยอดเองได้</strong> — เพิ่ม sprite ใหม่ ปรับ retry เขียน service ของทีมเอง เพราะเข้าใจโครง ไม่ใช่แค่เรียกใช้</li>
<li>โยงกับสไลด์ <strong>&quot;สองสมองที่คุยกันด้วยจดหมาย&quot;</strong> ต้นคาบ: เกือบทุกบรรทัดในไฟล์นี้มีอยู่เพื่อจัดการ &quot;จดหมายข้าม core&quot; ให้เนียน จนโค้ดเกมข้างบนไม่ต้องรับรู้เลย</li>
</ul>
<blockquote>
<p>เฉลยที่ดีไม่ได้ให้คำตอบ มันให้เหตุผล — วันนี้เราอ่าน engine ไม่ใช่เพื่อลอก แต่เพื่อวันหนึ่งจะเขียน engine ของเราเองได้</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="13" style="--paginate:true;--theme:default;" data-marpit-pagination-total="18">
<h1 id="%E0%B9%80%E0%B8%89%E0%B8%A5%E0%B8%A2%E0%B8%AA%E0%B9%88%E0%B8%A7%E0%B8%99%E0%B8%97%E0%B8%B5%E0%B9%88-1--%E0%B8%A3%E0%B8%B9%E0%B9%89%E0%B8%81%E0%B9%88%E0%B8%AD%E0%B8%99%E0%B9%83%E0%B8%8A%E0%B9%89-%E0%B8%96%E0%B8%B2%E0%B8%A1%E0%B8%9A%E0%B8%AD%E0%B8%A3%E0%B9%8C%E0%B8%94%E0%B8%A7%E0%B9%88%E0%B8%B2%E0%B8%A1%E0%B8%B5%E0%B8%AD%E0%B8%B0%E0%B9%84%E0%B8%A3-%E0%B9%81%E0%B8%A5%E0%B9%89%E0%B8%A7%E0%B8%84%E0%B9%88%E0%B8%AD%E0%B8%A2%E0%B9%80%E0%B8%A3%E0%B8%B5%E0%B8%A2%E0%B8%81">เฉลยส่วนที่ 1 — &quot;รู้ก่อนใช้&quot;: ถามบอร์ดว่ามีอะไร แล้วค่อยเรียก</h1>
<p>บอร์ดในคอร์สมีหลายรุ่น (AI Kit / Eva / Game Console / Dev Kit) ฮาร์ดแวร์ไม่เท่ากันเลย แต่เราอยากให้ <strong>เกมไฟล์เดียวรันได้ทุกบอร์ด</strong> (<code>bentogame.py:12-16</code>) เคล็ดอยู่ที่ตอนโหลดโมดูล ให้ถาม firmware ก่อนว่ามีความสามารถไหนบ้าง:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">_HAS_SOUND = <span class="hljs-built_in">hasattr</span>(ui, <span class="hljs-string">&quot;sfx&quot;</span>)
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">try</span>:
    <span class="hljs-keyword">import</span> pots <span class="hljs-keyword">as</span> _pots
    _HAS_POTS = <span class="hljs-literal">True</span>
<span class="hljs-keyword">except</span> ImportError:
    _HAS_POTS = <span class="hljs-literal">False</span>
</code></pre>
<p>แล้วทุกฟังก์ชันที่แตะฮาร์ดแวร์จะเช็ก flag นั้นก่อน ถ้าไม่มีก็ <strong>เงียบ ๆ คืนออกไป ไม่ crash</strong>:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">def</span> <span class="hljs-title function_">sfx</span>(<span class="hljs-params">name</span>):
    <span class="hljs-string">&quot;&quot;&quot;Play a built-in sound effect — by name (&quot;eat&quot;,&quot;die&quot;,&quot;gameover&quot;,...) or number.&quot;&quot;&quot;</span>
    <span class="hljs-keyword">if</span> <span class="hljs-keyword">not</span> _HAS_SOUND:
        <span class="hljs-keyword">return</span>
    <span class="hljs-keyword">try</span>:
        ui.sfx(SFX.get(name, name) <span class="hljs-keyword">if</span> <span class="hljs-built_in">isinstance</span>(name, <span class="hljs-built_in">str</span>) <span class="hljs-keyword">else</span> <span class="hljs-built_in">int</span>(name))
    <span class="hljs-keyword">except</span> Exception:
        <span class="hljs-keyword">pass</span>
</code></pre>
<ul>
<li><code>hasattr(ui, &quot;sfx&quot;)</code> (<code>:48</code>) กับ <code>try/import</code> (<code>:476-480</code>) คือ <strong>capability probe</strong> — ถามว่า &quot;ทำได้ไหม&quot; แทนการเดาจากชื่อรุ่นบอร์ด ถ้า firmware เก่าไม่มี <code>ui.sfx</code> เกมก็ยังเล่น แค่ไม่มีเสียง</li>
<li><code>sfx()</code> (<code>:73-80</code>) เจอ &quot;ไม่มีเสียง&quot; ก็ <code>return</code> เฉย ๆ ไม่โยน error เพราะ <strong>เสียงหายไม่ควรทำให้ทั้งเกมล้ม</strong> นี่คือหลัก graceful degradation: ฟีเจอร์รองหายได้ ฟีเจอร์หลักต้องรอด</li>
<li>ทำไมเช็กตอนโหลดโมดูลครั้งเดียว (<code>_HAS_SOUND</code>) ไม่เช็กทุกเฟรม? เพราะความสามารถของ firmware ไม่เปลี่ยนระหว่างรัน จ่ายค่าตรวจครั้งเดียว แล้วเฟรมต่อ ๆ ไปแค่ดู flag</li>
<li>โครงนี้เป็นพี่น้องกับ <strong>บทเรียน 1 (<code>_r()</code>)</strong>: ทั้งคู่ห่อการเรียกฮาร์ดแวร์ด้วย <code>try</code> แล้วตัดสินใจว่า &quot;อาการนี้ยอมได้ หรือต้องเด้ง&quot; ต่างกันแค่ <code>_r()</code> ยอมกับ &quot;not ready&quot; ส่วนนี่ยอมกับ &quot;ไม่มีฮาร์ดแวร์&quot;</li>
</ul>
<blockquote>
<p>โปรแกรมฝังตัวที่ดีไม่ถามว่า &quot;บอร์ดรุ่นอะไร&quot; แต่ถามว่า &quot;ทำสิ่งนี้ได้ไหม&quot; แล้วเตรียมทางลงไว้เสมอเผื่อคำตอบคือไม่ได้</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="14" style="--paginate:true;--theme:default;" data-marpit-pagination-total="18">
<h1 id="%E0%B9%80%E0%B8%89%E0%B8%A5%E0%B8%A2%E0%B8%AA%E0%B9%88%E0%B8%A7%E0%B8%99%E0%B8%97%E0%B8%B5%E0%B9%88-2--%E0%B8%AB%E0%B8%81%E0%B8%84%E0%B8%B3%E0%B8%AA%E0%B8%B1%E0%B9%88%E0%B8%87%E0%B8%87%E0%B9%88%E0%B8%B2%E0%B8%A2-%E0%B9%86-%E0%B8%97%E0%B8%B5%E0%B9%88%E0%B8%8B%E0%B9%88%E0%B8%AD%E0%B8%99-%E0%B8%88%E0%B8%94%E0%B8%AB%E0%B8%A1%E0%B8%B2%E0%B8%A2%E0%B8%82%E0%B9%89%E0%B8%B2%E0%B8%A1-core-%E0%B9%84%E0%B8%A7%E0%B9%89%E0%B8%82%E0%B9%89%E0%B8%B2%E0%B8%87%E0%B9%83%E0%B8%99">เฉลยส่วนที่ 2 — หกคำสั่งง่าย ๆ ที่ซ่อน &quot;จดหมายข้าม core&quot; ไว้ข้างใน</h1>
<p><code>game.Box</code> คือสไปรต์ที่ง่ายที่สุด ข้างในมันคือ <code>ui.Panel</code> หนึ่งใบบน CM55 แต่โค้ดเกมไม่ต้องรู้เลย ทุกการขยับผ่านสองเมท็อดนี้ (<code>bentogame.py:234-252</code>):</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">    <span class="hljs-keyword">def</span> <span class="hljs-title function_">move_to</span>(<span class="hljs-params">self, x, y</span>):
        <span class="hljs-string">&quot;&quot;&quot;Put the box at an exact position.&quot;&quot;&quot;</span>
        <span class="hljs-variable language_">self</span>.x = x
        <span class="hljs-variable language_">self</span>.y = y
        _r(<span class="hljs-variable language_">self</span>._panel.pos, <span class="hljs-built_in">int</span>(x), <span class="hljs-built_in">int</span>(y))

    <span class="hljs-keyword">def</span> <span class="hljs-title function_">move</span>(<span class="hljs-params">self, delta_x, delta_y</span>):
        <span class="hljs-string">&quot;&quot;&quot;Move the box by some amount, staying on screen.&quot;&quot;&quot;</span>
        next_x = <span class="hljs-variable language_">self</span>.x + delta_x
        next_y = <span class="hljs-variable language_">self</span>.y + delta_y
        <span class="hljs-keyword">if</span> next_x &lt; <span class="hljs-number">0</span>:
            next_x = <span class="hljs-number">0</span>
        <span class="hljs-keyword">if</span> next_y &lt; <span class="hljs-number">0</span>:
            next_y = <span class="hljs-number">0</span>
        <span class="hljs-keyword">if</span> next_x &gt; WIDTH - <span class="hljs-variable language_">self</span>.w:
            next_x = WIDTH - <span class="hljs-variable language_">self</span>.w
        <span class="hljs-keyword">if</span> next_y &gt; HEIGHT - <span class="hljs-variable language_">self</span>.h:
            next_y = HEIGHT - <span class="hljs-variable language_">self</span>.h
        <span class="hljs-variable language_">self</span>.move_to(next_x, next_y)
</code></pre>
<p>และการชน — คณิตศาสตร์กล่องทับกล่องบรรทัดเดียว (<code>bentogame.py:466-469</code>):</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">def</span> <span class="hljs-title function_">hit</span>(<span class="hljs-params">a, b</span>):
    <span class="hljs-string">&quot;&quot;&quot;True if Box a overlaps Box b (axis-aligned bounding-box test).&quot;&quot;&quot;</span>
    <span class="hljs-keyword">return</span> (a.x &lt; b.x + b.w <span class="hljs-keyword">and</span> a.x + a.w &gt; b.x <span class="hljs-keyword">and</span>
            a.y &lt; b.y + b.h <span class="hljs-keyword">and</span> a.y + a.h &gt; b.y)
</code></pre>
<ul>
<li><code>move_to</code> จบด้วย <code>_r(self._panel.pos, ...)</code> — จุดนี้เองที่ &quot;จดหมายข้าม core&quot; ถูกส่งจริง โยงตรงกับสไลด์ <strong>สองสมอง</strong> และ <strong>บทเรียน 1</strong>: ทุกการขยับ = IPC หนึ่งฉบับ ที่ผ่านตาข่าย <code>_r()</code> ให้แล้ว โค้ดเกมจึงเขียน <code>box.move_to(x, y)</code> เฉย ๆ ได้โดยไม่ต้องรู้จัก retry เลย</li>
<li><code>move()</code> ตรึงกล่องไว้ในจออัตโนมัติ (clamp <code>0..WIDTH - self.w</code>) ผู้เล่นสั่งเดินชนขอบก็ไม่หลุดจอ เก็บ <strong>เงื่อนไขขอบเขต</strong> ไว้ที่เดียว ไม่ให้เกมแต่ละเกมเขียนซ้ำ</li>
<li><code>keys()</code> คืน <code>Keys</code> ที่รวม D-pad กับ analog stick เป็น <code>.left/.right/...</code> (<code>:305-319</code>) ซ่อนว่า input มาจากปุ่มหรือแกนอนาล็อก เกมสนใจแค่ &quot;ซ้ายหรือขวา&quot;</li>
<li><code>hit()</code> เป็น <strong>AABB</strong> ล้วน ไม่แตะฮาร์ดแวร์ เร็ว ทำนายง่าย พอสำหรับเกมกล่อง นี่คือ &quot;จ่ายเท่าที่จำเป็น&quot; ไม่ยกเรขาคณิตทั้งวิชามาทั้งที่เกมไม่ได้ใช้</li>
</ul>
<blockquote>
<p>ผิวที่เรียบง่ายไม่ได้แปลว่าข้างในง่าย — หกคำสั่งนี้เรียบเพราะมันแบกความยุ่งของ IPC เอาไว้ให้ ไม่ใช่เพราะไม่มีความยุ่ง</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="15" style="--paginate:true;--theme:default;" data-marpit-pagination-total="18">
<h1 id="%E0%B9%80%E0%B8%89%E0%B8%A5%E0%B8%A2%E0%B8%AA%E0%B9%88%E0%B8%A7%E0%B8%99%E0%B8%97%E0%B8%B5%E0%B9%88-3--%E0%B8%A7%E0%B8%99%E0%B9%80%E0%B8%9F%E0%B8%A3%E0%B8%A1%E0%B9%83%E0%B8%AB%E0%B9%89%E0%B8%95%E0%B8%A3%E0%B8%87%E0%B8%88%E0%B8%B1%E0%B8%87%E0%B8%AB%E0%B8%A7%E0%B8%B0-%E0%B9%81%E0%B8%A5%E0%B9%89%E0%B8%A7%E0%B8%A1%E0%B8%AD%E0%B8%87%E0%B8%A0%E0%B8%B2%E0%B8%9E%E0%B8%A3%E0%B8%A7%E0%B8%A1%E0%B8%97%E0%B8%B1%E0%B9%89%E0%B8%87-engine">เฉลยส่วนที่ 3 — วนเฟรมให้ตรงจังหวะ แล้วมองภาพรวมทั้ง engine</h1>
<p>หัวใจสุดท้ายคือ <code>run()</code> — game loop ที่เรียก <code>update()</code> ของน้องทุกเฟรม แล้ว <strong>หลับเท่าที่เหลือจริงของคาบ</strong> เพื่อคุมให้เกมเดินตรง fps (<code>bentogame.py:993-999</code>; จับเวลาต้นเฟรมไว้ที่ <code>t0 = time.ticks_ms()</code>, <code>:965</code>):</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">        <span class="hljs-keyword">if</span> paused:                  <span class="hljs-comment"># ระหว่างพัก: ไม่เรียก update() ปุ่มทิศทางไม่มีผล</span>
            time.sleep_ms(delay)
            <span class="hljs-keyword">continue</span>
        <span class="hljs-keyword">if</span> update() <span class="hljs-keyword">is</span> <span class="hljs-literal">False</span>:
            <span class="hljs-keyword">return</span> <span class="hljs-literal">True</span>
        <span class="hljs-comment"># หลับเฉพาะเวลาที่เหลือของเฟรม (ticks_diff ปลอดภัยตอนตัวเลขนาฬิกาวน)</span>
        time.sleep_ms(<span class="hljs-built_in">max</span>(<span class="hljs-number">0</span>, delay - time.ticks_diff(time.ticks_ms(), t0)))
</code></pre>
<p>เฟรมไหนงานหนัก (IPC เยอะ) จะหลับสั้นลงเอง จังหวะเกมเลยนิ่งไม่ว่าจอจะยุ่งแค่ไหน โยงกับ <strong>บทเรียน 2</strong>: <code>run()</code> คุมได้แค่จังหวะ ส่วนจำนวน object ต่อเฟรมเป็นหน้าที่ <code>pool()</code> (<code>:176-184</code>) กับการ budget ที่เราคุยกันไปแล้ว</p>
<p><strong>มองทั้งไฟล์เป็นชั้น ๆ — แต่ละชั้นซ่อนความจริงของฮาร์ดแวร์ไว้คนละอย่าง:</strong></p>
<div style="font-size:0.9em;">
<table>
<thead>
<tr>
<th>ชั้น (layer)</th>
<th>ตัวอย่างใน <code>bentogame.py</code></th>
<th>ความจริงของ HW ที่มันซ่อนให้</th>
<th>โยงบทเรียนในคาบนี้</th>
</tr>
</thead>
<tbody>
<tr>
<td>ผิวนอก 6 แนวคิด</td>
<td><code>Box</code> <code>keys()</code> <code>hit()</code> <code>run()</code> (<code>:6-7</code>)</td>
<td>ต้องรู้ <code>ui.Panel</code> / <code>joystick</code> / IPC</td>
<td>เขียนเกมโดยไม่ต้องแตะ IPC เอง</td>
</tr>
<tr>
<td>ตาข่ายนิรภัย</td>
<td><code>_r()</code> (<code>:117</code>), <code>move_to</code>→<code>_r</code> (<code>:234</code>)</td>
<td>CM55 ตอบ &quot;not ready&quot; ชั่วคราว</td>
<td>บทเรียน 1 — Retry แทน Crash</td>
</tr>
<tr>
<td>งบต่อเฟรม</td>
<td><code>run()</code> pacing (<code>:999</code>), <code>pool()</code> (<code>:176</code>)</td>
<td>IPC round-trip จำกัดต่อเฟรม</td>
<td>บทเรียน 2 + คาบ 11 Object Pool</td>
</tr>
<tr>
<td>ล้มแบบไม่ตาย</td>
<td><code>_HAS_SOUND</code> / <code>_HAS_SPRITE</code> (<code>:48,:98</code>)</td>
<td>บอร์ดต่างรุ่นมี HW ไม่เท่ากัน</td>
<td>ไฟล์เดียวรันได้ทุกบอร์ด</td>
</tr>
</tbody>
</table>
</div>
<blockquote>
<p>อ่านจากล่างขึ้นบน: ฮาร์ดแวร์มีจังหวะไม่พร้อม มีงบจำกัด มีของไม่ครบ — สามความจริงนี้ถูกห่อทีละชั้นจนบนสุดเหลือแค่หกคำที่นิสิตปี 2 เรียกใช้ได้สบาย นั่นแหละคืองานของ engine</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="16" style="--paginate:true;--theme:default;" data-marpit-pagination-total="18">
<h1 id="%E0%B9%80%E0%B8%8A%E0%B8%B7%E0%B9%88%E0%B8%AD%E0%B8%A1%E0%B8%88%E0%B8%B8%E0%B8%94--%E0%B8%88%E0%B8%B2%E0%B8%81-%E0%B8%AB%E0%B9%88%E0%B8%AD%E0%B8%84%E0%B8%A7%E0%B8%B2%E0%B8%A1%E0%B8%A2%E0%B8%B8%E0%B9%88%E0%B8%87%E0%B9%84%E0%B8%A7%E0%B9%89%E0%B9%83%E0%B8%AB%E0%B9%89-%E0%B9%84%E0%B8%9B%E0%B8%96%E0%B8%B6%E0%B8%87%E0%B8%81%E0%B8%B2%E0%B8%A3%E0%B9%80%E0%B8%82%E0%B8%B5%E0%B8%A2%E0%B8%99-hal-%E0%B8%82%E0%B8%AD%E0%B8%87%E0%B8%95%E0%B8%B1%E0%B8%A7%E0%B9%80%E0%B8%AD%E0%B8%87">เชื่อมจุด — จาก &quot;ห่อความยุ่งไว้ให้&quot; ไปถึงการเขียน HAL ของตัวเอง</h1>
<p><strong>ที่มา</strong> — ความคิด &quot;ห่อฮาร์ดแวร์ที่เอาแน่เอานอนไม่ได้ไว้ใต้ผิวเรียบ ๆ&quot; ไม่ได้เพิ่งเกิดในไฟล์นี้ มันเริ่มตั้งแต่สไลด์ <strong>&quot;สองสมองที่คุยกันด้วยจดหมาย&quot;</strong> ที่บอกว่า <code>move_to</code> หนึ่งครั้งคือจดหมายข้าม core หนึ่งฉบับ แล้ว <strong>บทเรียน 1 (<code>_r()</code>)</strong> ก็ตอบคำถามต่อว่า &quot;ถ้าปลายทางยังไม่พร้อมล่ะ&quot; — <code>bentogame.py</code> คือการเอาคำตอบเหล่านั้นมาประกอบเป็นกำแพงชั้นเดียว ให้โค้ดเกมข้างบนไม่ต้องเห็นความจริงที่ยุ่งของบอร์ดเลย</p>
<p><strong>ที่ไป</strong> — ทักษะ &quot;อ่าน engine ให้ออกว่ามันซ่อนอะไรไว้&quot; คือก้าวแรกของการ <strong>เขียน engine เอง</strong> README ของเฉลยบอกไว้ว่าหกแนวคิดนี้ map 1:1 ไปที่ C game SDK ในคอร์สถัดไป วันที่น้องเขียนฝั่ง C น้องจะเป็นคน <strong>สร้าง <code>_r()</code> เอง สร้าง capability probe เอง</strong> ตัดสินใจเองว่าอะไรยอมได้อะไรต้องเด้ง นี่คือหน้าที่จริงของคนเขียน driver/HAL ในงานฝังตัว</p>
<div style="text-align:center">
<svg width="860" height="118" viewBox="0 0 860 118" font-family="DejaVu Sans, sans-serif">
  <defs><marker id="arP2" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="10" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#9e9e9e" /></marker></defs>
  <line x1="60" y1="60" x2="800" y2="60" stroke="#cfd8dc" stroke-width="3" />
  <g text-anchor="middle">
    <circle cx="150" cy="60" r="8" fill="#607d8b" />
    <text x="150" y="40" font-size="13" font-weight="700" fill="#455a64">ที่มา</text>
    <text x="150" y="86" font-size="12" fill="#777">IPC + `_r()` retry</text>
    <text x="150" y="102" font-size="11" fill="#999">(สองสมอง / บทเรียน 1)</text>
    <circle cx="430" cy="60" r="10" fill="#2e7d32" />
    <text x="430" y="40" font-size="13" font-weight="700" fill="#2e7d32">วันนี้</text>
    <text x="430" y="86" font-size="12" fill="#777">bentogame ห่อ HW ใต้ 6 คำ</text>
    <text x="430" y="102" font-size="11" fill="#999">(อ่าน engine ให้ขาด)</text>
    <circle cx="740" cy="60" r="8" fill="#6a1b9a" />
    <text x="740" y="40" font-size="13" font-weight="700" fill="#6a1b9a">ที่ไป</text>
    <text x="740" y="86" font-size="12" fill="#777">เขียน HAL / C SDK เอง</text>
    <text x="740" y="102" font-size="11" fill="#999">(สร้าง engine ของเรา)</text>
  </g>
  <line x1="163" y1="60" x2="415" y2="60" stroke="#9e9e9e" stroke-width="2" marker-end="url(#arP2)" />
  <line x1="445" y1="60" x2="725" y2="60" stroke="#9e9e9e" stroke-width="2" marker-end="url(#arP2)" />
</svg>
</div>
<p>ลองตอบในใจ นี่คือการเชื่อมจุดด้วยตัวเอง:</p>
<ul>
<li>จำ <code>_r()</code> ใน <strong>บทเรียน 1</strong> ได้ไหม ถ้าให้น้องเขียนฟังก์ชันห่อการเรียก I2C ที่ &quot;บางทีบัสไม่ว่าง&quot; น้องจะออกแบบเพดาน retry กับเงื่อนไข &quot;ยอมได้/ต้องเด้ง&quot; ยังไง หน้าตาจะต่างจาก <code>_r()</code> มากไหม</li>
<li>ถ้าวันนี้เราอ่าน <code>sfx()</code> ออกว่ามันเลือก &quot;เงียบดีกว่าล้ม&quot; ได้ พรุ่งนี้พอเจอ sensor ที่บางบอร์ดไม่มี เราจะออกแบบให้มัน &quot;คืนค่ากลาง&quot; แทน crash เองได้ไหม</li>
<li>สังเกตไหมว่า <code>_HAS_SOUND</code> / <code>_HAS_SPRITE</code> มันคือเรื่องเดียวกับ <strong>BSP feature flag</strong> ของฝั่ง C ที่บอกว่าบอร์ดรุ่นนี้มีเซนเซอร์ตัวไหน ต่างกันแค่ Python ถามตอนรัน C กำหนดตอน build</li>
</ul>
<blockquote>
<p>การหยั่งรู้ที่อยากให้เกิด: engine ไม่ใช่กล่องดำ มันคือชุดการตัดสินใจของวิศวกรคนหนึ่ง — พออ่านออกว่าเขาตัดสินใจแบบนั้นทำไม น้องก็พร้อมเป็นคนตัดสินใจเองในเครื่องถัดไป</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="17" style="--paginate:true;--theme:default;" data-marpit-pagination-total="18">
<h1 id="%E0%B9%83%E0%B8%8A%E0%B9%89%E0%B8%88%E0%B8%A3%E0%B8%B4%E0%B8%87%E0%B8%97%E0%B8%B5%E0%B9%88%E0%B9%84%E0%B8%AB%E0%B8%99--abstraction-layer-%E0%B8%97%E0%B8%B5%E0%B9%88%E0%B8%8B%E0%B9%88%E0%B8%AD%E0%B8%99%E0%B8%AE%E0%B8%B2%E0%B8%A3%E0%B9%8C%E0%B8%94%E0%B9%81%E0%B8%A7%E0%B8%A3%E0%B9%8C">ใช้จริงที่ไหน — abstraction layer ที่ซ่อนฮาร์ดแวร์</h1>
<p>รูปแบบทั้งสี่ในไฟล์นี้ไม่ใช่ของเล่นในคอร์ส มันคือแกนของ firmware ระดับ production:</p>
<div style="text-align:center">
<svg width="880" height="240" viewBox="0 0 880 240" font-family="DejaVu Sans, sans-serif">
  <defs>
    <marker id="arU1" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="10" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#607d8b" /></marker>
  </defs>
  
  <rect x="12" y="8" width="420" height="106" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" />
  <text x="28" y="28" font-size="13" font-weight="700" fill="#1565c0">Capability probe — ถามก่อนใช้</text>
  <rect x="28" y="47" width="150" height="24" rx="6" fill="#ffffff" stroke="#1565c0" stroke-width="1.5" />
  <text x="103" y="63" text-anchor="middle" font-size="11" fill="#1565c0">hasattr(ui,"sfx")?</text>
  <rect x="232" y="41" width="190" height="22" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5" />
  <text x="242" y="56" font-size="11" fill="#2e7d32">มี → ui.sfx() เล่นเสียง</text>
  <rect x="232" y="75" width="190" height="22" rx="6" fill="#cfd8dc" stroke="#607d8b" stroke-width="1.5" />
  <text x="242" y="90" font-size="11" fill="#455a64">ไม่มี → return เงียบ ไม่ crash</text>
  <path d="M178 54 H 228" stroke="#607d8b" stroke-width="2" marker-end="url(#arU1)" />
  <path d="M178 62 C 205 86, 210 86, 228 86" fill="none" stroke="#607d8b" stroke-width="2" marker-end="url(#arU1)" />
  
  <rect x="448" y="8" width="420" height="106" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" />
  <text x="464" y="28" font-size="13" font-weight="700" fill="#2e7d32">Bounded retry — ลองซ้ำแบบมีเพดาน</text>
  <rect x="470" y="48" width="70" height="28" rx="6" fill="#fff3e0" stroke="#ef6c00" stroke-width="1.5" />
  <text x="505" y="66" text-anchor="middle" font-size="11" fill="#ef6c00">busy</text>
  <rect x="574" y="48" width="70" height="28" rx="6" fill="#fff3e0" stroke="#ef6c00" stroke-width="1.5" />
  <text x="609" y="66" text-anchor="middle" font-size="11" fill="#ef6c00">busy</text>
  <rect x="678" y="48" width="70" height="28" rx="6" fill="#ffffff" stroke="#2e7d32" stroke-width="1.5" />
  <text x="713" y="66" text-anchor="middle" font-size="11" fill="#2e7d32">OK</text>
  <path d="M540 62 H 572" stroke="#607d8b" stroke-width="2" marker-end="url(#arU1)" />
  <path d="M644 62 H 676" stroke="#607d8b" stroke-width="2" marker-end="url(#arU1)" />
  <text x="592" y="44" text-anchor="middle" font-size="10" fill="#777">+15 ms</text>
  <text x="464" y="101" font-size="11" fill="#607d8b">เพดาน ≤ 40 ครั้ง — ครบแล้วยอมให้ error เด้ง</text>
  
  <rect x="12" y="126" width="420" height="106" rx="10" fill="#fff3e0" stroke="#ef6c00" stroke-width="2" />
  <text x="28" y="146" font-size="13" font-weight="700" fill="#ef6c00">Fixed-timestep — เดินตรงจังหวะ</text>
  <text x="28" y="169" font-size="11" fill="#607d8b">เฟรมเบา</text>
  <rect x="96" y="160" width="40" height="13" fill="#ef6c00" />
  <rect x="136" y="160" width="200" height="13" fill="#ffffff" stroke="#ef6c00" stroke-width="1" />
  <text x="28" y="193" font-size="11" fill="#607d8b">เฟรมหนัก</text>
  <rect x="96" y="184" width="170" height="13" fill="#ef6c00" />
  <rect x="266" y="184" width="70" height="13" fill="#ffffff" stroke="#ef6c00" stroke-width="1" />
  <line x1="336" y1="152" x2="336" y2="202" stroke="#ef6c00" stroke-width="1" stroke-dasharray="3 3" />
  <text x="343" y="169" font-size="10" fill="#777">compute</text>
  <text x="343" y="193" font-size="10" fill="#777">+ sleep</text>
  <text x="28" y="218" font-size="11" fill="#777">รวมต่อเฟรมเท่ากันเสมอ → fps นิ่ง</text>
  
  <rect x="448" y="126" width="420" height="106" rx="10" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="2" />
  <text x="464" y="146" font-size="13" font-weight="700" fill="#6a1b9a">Graceful degradation — firmware ก้อนเดียว</text>
  <rect x="464" y="160" width="92" height="50" rx="6" fill="#ffffff" stroke="#6a1b9a" stroke-width="1.5" />
  <text x="510" y="182" text-anchor="middle" font-size="11" fill="#6a1b9a">1 binary</text>
  <text x="510" y="198" text-anchor="middle" font-size="10" fill="#777">bentogame.py</text>
  <rect x="620" y="156" width="238" height="18" rx="5" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="1" />
  <text x="628" y="169" font-size="10" fill="#6a1b9a">AI Kit — เสียง + sprite ครบ</text>
  <rect x="620" y="178" width="238" height="18" rx="5" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="1" />
  <text x="628" y="191" font-size="10" fill="#6a1b9a">Eva — ไม่มี sprite ก็ซ่อนฟีเจอร์</text>
  <rect x="620" y="200" width="238" height="18" rx="5" fill="#cfd8dc" stroke="#607d8b" stroke-width="1" />

  <path d="M556 170 H 616" stroke="#607d8b" stroke-width="2" marker-end="url(#arU1)" />
  <path d="M556 185 H 616" stroke="#607d8b" stroke-width="2" marker-end="url(#arU1)" />

</svg>
</div>
<ul>
<li><strong>Capability probe = feature detection ในทุก OS/ไดรเวอร์</strong> — ก่อนใช้ GPU/กล้อง/บลูทูธ โปรแกรมถามระบบก่อนว่า &quot;มีของนี้ไหม&quot; แล้วปิดปุ่มที่ทำไม่ได้ ตรงกับ <code>_HAS_SOUND</code> / <code>_HAS_SPRITE</code> เป๊ะ — binary เดียวรันได้หลายเครื่องที่สเปกไม่เท่ากัน</li>
<li><strong>Bounded retry = หัวใจของ driver บัสทุกตัว</strong> — I2C/SPI/แฟลช/network เจอ &quot;อุปกรณ์ไม่ว่างชั่วคราว&quot; ตลอด โค้ดจริงจึง retry แบบมีเพดาน (มักมี backoff) เหมือน <code>_r()</code> ใน <strong>บทเรียน 1</strong> — ไม่ retry คือเปราะ, retry ไม่มีเพดานคือค้างตาย</li>
<li><strong>Fixed-timestep loop = game engine + งาน RTOS จริง</strong> — Unity/Unreal และ control loop หุ่นยนต์ คุมลูปให้ &quot;เดินตรงจังหวะ&quot; ด้วยการวัดเวลาที่เหลือแล้วหลับพอดี เหมือน <code>run()</code> (<code>:999</code>) ใน <strong>บทเรียน 2</strong> — จังหวะนิ่งคือความต่างระหว่างเกมลื่นกับเกมกระตุก มอเตอร์นิ่งกับมอเตอร์สั่น</li>
<li><strong>Graceful degradation = สินค้าตระกูลเดียวหลายรุ่น</strong> — รุ่นท็อปกับรุ่นเริ่มต้นมักใช้ firmware ก้อนเดียวกัน รุ่นที่ไม่มีเซนเซอร์บางตัวก็แค่ซ่อนฟีเจอร์นั้น ไม่ทำ firmware แยก คือหลักเดียวกับที่ <code>bentogame.py</code> รันได้ทั้ง AI Kit / Eva / Game Console / Dev Kit</li>
</ul>
<blockquote>
<p>จำหลักไว้: layer ที่ดีเปลี่ยน &quot;ของยากข้างใต้&quot; ให้กลายเป็น &quot;ของง่ายข้างบน&quot; — ทั้งอุตสาหกรรมฝังตัวสร้างขึ้นบนความคิดนี้ ไม่ใช่แค่เกมของเรา</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="18" style="--paginate:true;--theme:default;" data-marpit-pagination-total="18">
<h1 id="%E0%B8%95%E0%B9%88%E0%B8%AD%E0%B8%A2%E0%B8%AD%E0%B8%94--%E0%B8%84%E0%B8%B4%E0%B8%94%E0%B8%95%E0%B9%88%E0%B8%AD%E0%B9%80%E0%B8%AD%E0%B8%87">ต่อยอด — คิดต่อเอง</h1>
<p>เอาโจทย์เหล่านี้ไปคิดต่อ ไม่มีคำตอบเดียว ทุกข้อเริ่มจากโค้ดที่น้องเพิ่งอ่านวันนี้:</p>
<div style="text-align:center">
<svg width="840" height="224" viewBox="0 0 840 224" font-family="DejaVu Sans, sans-serif">
  <defs>
    <marker id="arDn2" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="10" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#607d8b" /></marker>
  </defs>
  <text x="14" y="22" font-size="13" font-weight="700" fill="#1565c0">วันนี้ — เราเป็น "ผู้ใช้" engine</text>
  <rect x="120" y="32" width="320" height="30" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" />
  <text x="280" y="52" text-anchor="middle" font-size="12" fill="#1565c0">box.move_to(x, y) — ผิวเรียบ 6 คำ</text>
  <text x="452" y="52" font-size="11" fill="#777">เราแค่เรียกใช้</text>
  <rect x="120" y="66" width="600" height="28" rx="6" fill="#cfd8dc" stroke="#607d8b" stroke-width="2" />
  <text x="132" y="84" font-size="12" fill="#455a64">ข้างใต้ที่ถูกซ่อนไว้ให้: _r() retry · IPC ข้าม core · capability probe</text>
  <line x1="420" y1="100" x2="420" y2="126" stroke="#607d8b" stroke-width="2" marker-end="url(#arDn2)" />
  <text x="436" y="118" font-size="11" fill="#777">เปลี่ยนบทบาท</text>
  <text x="14" y="150" font-size="13" font-weight="700" fill="#2e7d32">ก้าวต่อไป (คอร์ส C) — เราเป็น "ผู้เขียน" engine</text>
  <rect x="120" y="162" width="180" height="30" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" />
  <text x="210" y="182" text-anchor="middle" font-size="12" fill="#2e7d32">สร้าง _r() เอง</text>
  <rect x="312" y="162" width="196" height="30" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" />
  <text x="410" y="182" text-anchor="middle" font-size="12" fill="#2e7d32">capability probe เอง</text>
  <rect x="520" y="162" width="200" height="30" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" />
  <text x="620" y="182" text-anchor="middle" font-size="12" fill="#2e7d32">ตัดสิน ยอมได้ / ต้องเด้ง</text>
  <text x="420" y="210" text-anchor="middle" font-size="11" fill="#2e7d32">ข้างใต้ผิวเรียบกลายเป็นงานของเรา — engine ไม่ใช่กล่องดำอีกต่อไป</text>
</svg>
</div>
<ul>
<li><strong>ถ้าจะเพิ่ม &quot;ความสามารถใหม่&quot; เข้า engine</strong> เช่น สั่นมอเตอร์ (rumble) จะออกแบบ capability probe + ทางลงเมื่อบอร์ดไม่มีมอเตอร์ยังไง ให้เกมเก่าที่ไม่รู้จัก rumble ยังรันได้เหมือนเดิม</li>
<li><strong>ถ้า <code>_r()</code> ยังไม่พอ</strong> — บางคำสั่งต้อง retry นานกว่า บางคำสั่งห้ามรอเลย จะออกแบบให้ <code>_r()</code> รับ &quot;เพดาน/เงื่อนไข&quot; ต่างกันต่อการเรียกยังไง โดยไม่ทำให้โค้ดเกมข้างบนยุ่งขึ้น</li>
<li><strong>ถ้าอยากวัดว่าเฟรมไหนหนัก</strong> — จะแอบเก็บสถิติ &quot;เฟรมนี้ส่ง IPC กี่ครั้ง / หลับเหลือกี่ ms&quot; ใน <code>run()</code> ออกมาโชว์เป็น HUD debug ได้ไหม โดยไม่กระทบจังหวะเกม (โยง <strong>บทเรียน 2</strong>: ก่อน optimize ต้องวัดให้เห็นก่อน)</li>
<li><strong>ถ้าต้องเขียนชั้นเดียวกันนี้ด้วย C</strong> — ลองร่างว่า <code>Box.move_to</code> เวอร์ชัน C หน้าตายังไง ใครส่ง IPC ใคร retry ใครกัน object ให้อยู่ในจอ นี่คือสิ่งที่คอร์สถัดไป (ฝั่ง C game SDK) จะให้น้องลงมือทำจริง วันนี้อ่าน engine ให้ขาด พรุ่งนี้จะได้สร้างมันเอง</li>
</ul>
<blockquote>
<p>เลือกมาสักข้อ เขียนลงใบงานว่า &quot;ถ้าเป็นเรา จะออกแบบยังไง&quot; — คนที่เขียน engine เก่งไม่ได้เริ่มจากเขียนเป็น เริ่มจากอ่าน engine ของคนอื่นออกก่อน แล้วถามว่า &quot;ถ้าเราทำ จะทำต่างจากนี้ตรงไหน&quot;</p>
</blockquote>
