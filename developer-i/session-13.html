<h2 id="leaderboard--%E0%B9%80%E0%B8%A5%E0%B9%88%E0%B8%99%E0%B8%82%E0%B9%89%E0%B8%B2%E0%B8%A1%E0%B8%9A%E0%B8%AD%E0%B8%A3%E0%B9%8C%E0%B8%94">leaderboard / เล่นข้ามบอร์ด</h2>

<p>วันนี้เราจะพาบอร์ดจาก <strong>&quot;เล่นคนเดียวบนจอตัวเอง&quot;</strong> ไปสู่ <strong>&quot;ส่งคะแนนขึ้นกระดานกลาง + รับคะแนนของเพื่อนมาดูได้&quot;</strong></p>
<div style="display:flex;gap:16px;margin-top:12px">
<div style="flex:1;border:3px solid #2a7;border-radius:12px;padding:14px">

<code>wifi.connect()</code> → <code>wifi.is_connected()</code> → <code>wifi.ip()</code><br />

ส่งคะแนนขึ้น leaderboard + รับคะแนนเพื่อนมาแสดง
</div>
</div>

<text x="665" y="116" text-anchor="middle" font-size="12">board-02</text>
<line x1="170" y1="90" x2="303" y2="90" stroke="#27a" stroke-width="3" marker-end="url(#ar)" />
<text x="236" y="80" text-anchor="middle" font-size="12">publish</text>

<text x="380" y="185" text-anchor="middle" font-size="12" fill="#555">ทุกบอร์ดที่ subscribe topic เดียวกัน จะได้รับโปสการ์ดของทุกคน</text>

<p>หัวใจของ MQTT คือ <strong>topic</strong>: ถ้าใช้ชื่อ topic เดียวกัน ก็เหมือนอยู่ห้องเดียวกัน ได้ยินกันหมด</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="4" style="--paginate:true;--theme:default;" data-marpit-pagination-total="24">
<h1 id="publish--subscribe--%E0%B8%AA%E0%B9%88%E0%B8%87%E0%B8%84%E0%B8%A3%E0%B8%B1%E0%B9%89%E0%B8%87%E0%B9%80%E0%B8%94%E0%B8%B5%E0%B8%A2%E0%B8%A7-%E0%B8%96%E0%B8%B6%E0%B8%87%E0%B8%97%E0%B8%B8%E0%B8%81%E0%B8%9A%E0%B8%AD%E0%B8%A3%E0%B9%8C%E0%B8%94">publish / subscribe — ส่งครั้งเดียว ถึงทุกบอร์ด</h1>
<p>จุดที่ทำให้ leaderboard ของทั้งห้องทำงานได้ คือ <strong>บอร์ดเราส่ง 1 ครั้ง แต่ broker กระจายให้ทุกคนที่ subscribe topic เดียวกัน</strong> เราไม่ต้องรู้เลยว่ามีใครฟังอยู่บ้าง</p>
<p><img src="img/mqtt_fanout.png" alt="" style="width:680px;" /></p>
<ul>
<li><strong>publisher</strong> (คนส่ง) กับ <strong>subscriber</strong> (คนฟัง) ไม่ต้องรู้จักกันตรง ๆ — broker เป็นตัวกลาง เรียกว่า <strong>decouple</strong></li>
<li>เพิ่มบอร์ดเข้าห้องอีกกี่เครื่องก็ได้ โค้ดฝั่งคนส่ง <strong>ไม่ต้องแก้</strong> แค่บอร์ดใหม่ subscribe topic เดิม</li>
</ul>
<blockquote>
<p>นี่คือเหตุผลที่ MQTT เหมาะกับ IoT จริง ๆ ลองนึกถึงเซ็นเซอร์อุณหภูมิ 100 ตัวในโรงงาน ส่งขึ้น topic เดียว แดชบอร์ดตัวเดียว subscribe ก็เห็นครบ — โครงเดียวกับ leaderboard ของเราเป๊ะ</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="5" style="--paginate:true;--theme:default;" data-marpit-pagination-total="24">
<h1 id="%E0%B9%80%E0%B8%AB%E0%B9%87%E0%B8%99%E0%B8%A0%E0%B8%B2%E0%B8%9E%E0%B9%80%E0%B8%84%E0%B8%A5%E0%B8%B7%E0%B9%88%E0%B8%AD%E0%B8%99%E0%B9%84%E0%B8%AB%E0%B8%A7--publish-%E0%B8%AB%E0%B8%99%E0%B8%B6%E0%B9%88%E0%B8%87%E0%B8%84%E0%B8%A3%E0%B8%B1%E0%B9%89%E0%B8%87-%E0%B8%A7%E0%B8%B4%E0%B9%88%E0%B8%87%E0%B8%96%E0%B8%B6%E0%B8%87%E0%B8%97%E0%B8%B8%E0%B8%81%E0%B8%84%E0%B8%99">เห็นภาพเคลื่อนไหว — publish หนึ่งครั้ง วิ่งถึงทุกคน</h1>
<p><img src="img/mqtt_pubsub_anim.gif" alt="" style="width:560px;" /></p>
<p>บอร์ด A <code>publish</code> คะแนนขึ้น broker <strong>ครั้งเดียว</strong> จากนั้น broker ก็ส่งต่อให้บอร์ด B และ C ที่ subscribe topic นั้นไว้ <strong>พร้อมกัน</strong> — รวมถึงส่งกลับให้บอร์ด A เองด้วย (เพราะ A ก็ subscribe อยู่)</p>
<blockquote>
<p>สังเกตว่า A ไม่ได้ส่งตรงไปหา B หรือ C เลย มันส่งให้ &quot;ห้อง&quot; (topic) เฉย ๆ ใครอยู่ในห้องก็ได้ยินเอง — แยกหน้าที่ &quot;ส่ง&quot; ออกจาก &quot;ใครรับ&quot; ชัดเจน</p>
</blockquote>
<blockquote>
<p><strong>เชื่อมโยงรากฐาน — embedded + Python ที่อยู่ใต้เกมนี้:</strong> (1) <em>ฮาร์ดแวร์</em> — บอร์ดสื่อสารผ่านชิปวิทยุแยก (AIROC) ผ่านบัส SDIO/UART ทุกอุปกรณ์ IoT จริงก็คือ MCU + radio แบบนี้ (2) <em>Python</em> — <code>get_message()</code> คืน <code>None</code> เมื่อยังไม่มีของ นี่คือ <strong>non-blocking polling</strong> เกมจึงวนเช็กได้โดยไม่ค้าง และ payload ที่รับมาเป็น <code>bytes</code> ต้อง <code>.decode()</code> เป็น <code>str</code> ก่อน (เรื่อง type เดิมจากคาบต้น ๆ) — เมื่อจับสองอย่างนี้ได้ คุณก็ต่อเซ็นเซอร์จริงขึ้นคลาวด์ได้ด้วยหลักการเดียวกัน</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="6" style="--paginate:true;--theme:default;" data-marpit-pagination-total="24">
<h1 id="%E0%B8%81%E0%B9%89%E0%B8%B2%E0%B8%A7%E0%B8%97%E0%B8%B5%E0%B9%88-1--%E0%B8%95%E0%B9%88%E0%B8%AD-wifi-%E0%B9%81%E0%B8%A5%E0%B9%89%E0%B8%A7%E0%B9%80%E0%B8%8A%E0%B9%87%E0%B8%81%E0%B8%A7%E0%B9%88%E0%B8%B2%E0%B8%95%E0%B8%B4%E0%B8%94%E0%B8%88%E0%B8%A3%E0%B8%B4%E0%B8%87">ก้าวที่ 1 — ต่อ WiFi แล้วเช็กว่าติดจริง</h1>
<p>WiFi มี 3 ฟังก์ชันหลักที่เราใช้วันนี้ จำง่าย ๆ คือ <strong>ต่อ / เช็ก / ถาม IP</strong></p>
<p><img src="img/wifi_connect_flow.png" alt="" style="width:620px;" /></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">import</span> wifi
<span class="hljs-keyword">import</span> time

<span class="hljs-comment"># ต่อ WiFi (ห้องเราเป็น 2.4GHz) — ลองสูงสุด 6 ครั้ง (ครั้งแรกมักยังไม่ติด)</span>
ok = <span class="hljs-literal">False</span>
<span class="hljs-keyword">for</span> i <span class="hljs-keyword">in</span> <span class="hljs-built_in">range</span>(<span class="hljs-number">6</span>):
    <span class="hljs-keyword">if</span> wifi.connect(<span class="hljs-string">&quot;YOUR_WIFI_SSID&quot;</span>, <span class="hljs-string">&quot;YOUR_WIFI_PASSWORD&quot;</span>):   <span class="hljs-comment"># คืน True เมื่อสำเร็จ</span>
        ok = <span class="hljs-literal">True</span>
        <span class="hljs-keyword">break</span>
    <span class="hljs-built_in">print</span>(<span class="hljs-string">&quot;  ยังไม่ติด ลองใหม่ %d/6 ...&quot;</span> % (i + <span class="hljs-number">1</span>))
    time.sleep(<span class="hljs-number">2</span>)                       <span class="hljs-comment"># พัก 2 วิ ให้ WCM ตั้งตัว</span>
<span class="hljs-keyword">if</span> <span class="hljs-keyword">not</span> ok:                              <span class="hljs-comment"># ลองครบ 6 ครั้งแล้วยังไม่ติด → อย่าไปต่อ</span>
    <span class="hljs-built_in">print</span>(<span class="hljs-string">&quot;ต่อ WiFi ไม่ได้ ลองเช็ค SSID/รหัสอีกที&quot;</span>)
    <span class="hljs-keyword">raise</span> SystemExit

<span class="hljs-built_in">print</span>(<span class="hljs-string">&quot;IP ของบอร์ดเรา:&quot;</span>, wifi.ip())               <span class="hljs-comment"># เช่น 192.168.1.42</span>
</code></pre>
<p>ทำไมต้องเป็น <strong>loop ลองใหม่</strong> ไม่ใช่ยิงครั้งเดียว? เพราะการจับ AP + ขอ IP ใช้เวลาไม่แน่นอน ครั้งแรกจึงมัก &quot;ยังไม่ติด&quot; — วนลองพร้อมหน่วง <code>time.sleep(2)</code> คือแพตเทิร์น retry มาตรฐานของงานเครือข่ายจริง (ตรงกับ <code>s13_net.py:25–33</code>)</p>
<p>ข้อควรระวัง:</p>
<ul>
<li><code>SSID</code> / <code>PASSWORD</code> วันนี้เป็น <strong>ค่า placeholder</strong> ต้องแก้ให้ตรงของห้องเราก่อน</li>
<li>WiFi บอร์ดต่อได้เฉพาะคลื่น <strong>2.4GHz</strong> (อย่าใช้ชื่อ network ที่เป็น 5GHz)</li>
</ul>
<blockquote>
<p>ทางลัดที่แนะนำ: ต่อ WiFi ผ่านเมนู <strong>Wi-Fi บนจอ</strong> ครั้งเดียว (เซฟรหัสไว้ → บอร์ด auto-connect ทุกครั้งที่เปิด) แล้วโค้ดนี้จะโฟกัสที่ MQTT ล้วน ๆ — บรรทัด <code>wifi.connect()</code> จะผ่านทันทีเพราะต่ออยู่แล้ว</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="7" style="--paginate:true;--theme:default;" data-marpit-pagination-total="24">
<h1 id="%E0%B9%80%E0%B8%82%E0%B9%89%E0%B8%B2%E0%B9%83%E0%B8%88%E0%B8%AE%E0%B8%B2%E0%B8%A3%E0%B9%8C%E0%B8%94%E0%B9%81%E0%B8%A7%E0%B8%A3%E0%B9%8C--wifi-%E0%B8%97%E0%B8%B3%E0%B8%87%E0%B8%B2%E0%B8%99%E0%B8%A2%E0%B8%B1%E0%B8%87%E0%B9%84%E0%B8%87">เข้าใจฮาร์ดแวร์ · WiFi ทำงานยังไง</h1>
<p>ชิป PSoC Edge <strong>ไม่มีวิทยุในตัว</strong> — มันจับคู่กับชิปวิทยุแยกชื่อ <strong>AIROC CYW55513</strong> (Wi-Fi 6/6E + Bluetooth) คุยกันผ่าน SDIO + UART</p>
<p><span style="display:inline-block;vertical-align:middle"><img src="img/hw_board_block.png" alt="" style="width:300px;" /></span> <span style="display:inline-block;vertical-align:middle;margin-left:14px"><img src="img/airoc_m2_radio_card.jpg" alt="" style="width:215px;" /></span></p>
<p><sub>&quot;ชิปวิทยุแยก&quot; ในรูปขวาคือการ์ดวิทยุแบบ M.2 (Wi-Fi 6) ตัวจริง — สังเกตขั้วต่อเสาอากาศ MAIN/AUX และโลหะคลุมชิป RF · ที่มา: &quot;Intel Wi-Fi 6 AX200NGW card&quot; — Siarhei Besarab, CC BY-SA 4.0, Wikimedia Commons</sub></p>
<ul>
<li><code>wifi.connect()</code> = ส่ง SSID/รหัสให้ชิปวิทยุไปต่อ <strong>AP</strong> (router/แอคเซสพอยต์ของห้อง) แล้วได้ <strong>IP address</strong> กลับมา</li>
<li><strong>MQTT</strong> = ที่ทำการไปรษณีย์ (<strong>broker</strong>): บอร์ดหนึ่ง <strong>publish</strong> ข้อความไปที่ <strong>topic</strong> · บอร์ดที่ <strong>subscribe</strong> topic นั้นก็ได้รับ</li>
<li>หลายบอร์ดคุยผ่าน broker ตัวเดียว = หัวใจของ IoT</li>
</ul>
<blockquote>
<p><code>mqtt.publish(&quot;score&quot;, &quot;42&quot;)</code> = หย่อนจดหมายติดป้าย &quot;score&quot; ที่ไปรษณีย์ — ทุกบอร์ดที่สมัครรับป้ายนี้ได้อ่านหมด (payload ต้องเป็น <code>str</code> หรือ <code>bytes</code> — ถ้าเป็นตัวเลขให้ครอบด้วย <code>str(...)</code> ก่อน)</p>
</blockquote>
<div style="text-align:center">
<iframe width="480" height="270" src="https://www.youtube.com/embed/jTeJxQFD8Ak" title="What is MQTT | MQTT Essentials Part 1" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe>
</div>
<p><em>What is MQTT | MQTT Essentials Part 1 — HiveMQ</em> — publish/subscribe, topic, broker อธิบายภาพรวมตรงกับที่เราต่อในคาบนี้</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="8" style="--paginate:true;--theme:default;--marpit-advanced-background-split:32%;" data-marpit-pagination-total="24" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;img/ins_wifi_router.jpg&quot;);background-size:88% auto;"></figure></div></section></foreignObject><foreignObject width="68%" height="720"><section id="8" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="8" style="--paginate:true;--theme:default;--marpit-advanced-background-split:32%;" data-marpit-pagination-total="24" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h1 id="%E0%B9%80%E0%B8%81%E0%B8%A3%E0%B9%87%E0%B8%94-ap-%E0%B8%95%E0%B8%B1%E0%B8%A7%E0%B8%88%E0%B8%A3%E0%B8%B4%E0%B8%87%E0%B8%97%E0%B8%B5%E0%B9%88%E0%B8%9A%E0%B8%AD%E0%B8%A3%E0%B9%8C%E0%B8%94%E0%B9%80%E0%B8%A3%E0%B8%B2%E0%B8%95%E0%B9%88%E0%B8%AD%E0%B8%AB%E0%B8%B2">เกร็ด: AP ตัวจริงที่บอร์ดเราต่อหา</h1>

<p><code>wifi.connect()</code> ปลายทางไม่ใช่ของลึกลับ มันคือกล่อง <strong>access point / router</strong> แบบในรูปนี้ ที่กระจายคลื่น 2.4GHz อยู่ในห้องเรา</p>
<ul>
<li>บอร์ดส่งชื่อ (<strong>SSID</strong>) + รหัสไปขอเข้าร่วมเครือข่าย เมื่อผ่าน AP จะแจก <strong>IP address</strong> ให้ — เหมือนได้เลขห้องในตึก</li>
<li>AP ส่วนมากกระจายทั้ง 2.4GHz และ 5GHz แต่ชิปวิทยุของบอร์ดต่อได้เฉพาะ <strong>2.4GHz</strong> จึงต้องเลือกชื่อ network ให้ถูกคลื่น</li>
<li>พอได้ IP แล้ว บอร์ดถึงจะวิ่งออกอินเทอร์เน็ตไปหา MQTT broker ที่อยู่ไกลออกไปได้</li>
</ul>
<blockquote>
<p>ในผลิตภัณฑ์จริง อุปกรณ์ IoT ทุกตัวก็เริ่มจากก้าวนี้เป๊ะ — จับ AP ให้ได้ IP ก่อน แล้วค่อยคุย protocol ที่อยู่ชั้นบน (MQTT/HTTP) ทีหลัง</p>
</blockquote>
<p><sub>ที่มา: &quot;ELECOM WRC-300FEBK WPS WiFi router&quot; — Syced, CC0, Wikimedia Commons</sub></p>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="8" style="" data-marpit-pagination-total="24" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="9" style="--paginate:true;--theme:default;" data-marpit-pagination-total="24">
<h1 id="%E0%B8%81%E0%B9%89%E0%B8%B2%E0%B8%A7%E0%B8%97%E0%B8%B5%E0%B9%88-2--%E0%B8%95%E0%B9%88%E0%B8%AD-mqtt-broker--%E0%B8%AA%E0%B8%A1%E0%B8%B1%E0%B8%84%E0%B8%A3%E0%B8%A3%E0%B8%B1%E0%B8%9A-topic">ก้าวที่ 2 — ต่อ MQTT broker + สมัครรับ topic</h1>
<p>ต่อ WiFi ติดแล้ว ค่อยต่อ broker ลำดับนี้ห้ามสลับ เพราะ MQTT วิ่งบนเน็ตอีกที</p>
<svg viewBox="0 0 420 230" width="46%" style="display:block;margin:2px auto 6px">
<rect x="40" y="10" width="120" height="32" rx="8" fill="#e8f0ff" stroke="#27a" stroke-width="2" />
<text x="100" y="31" text-anchor="middle" font-size="14" font-weight="bold">บอร์ดเรา</text>
<rect x="262" y="10" width="120" height="32" rx="8" fill="#fff3d6" stroke="#e90" stroke-width="2" />
<text x="322" y="26" text-anchor="middle" font-size="13" font-weight="bold">broker</text>
<text x="322" y="38" text-anchor="middle" font-size="9" fill="#666">mosquitto:1883</text>
<line x1="100" y1="42" x2="100" y2="240" stroke="#27a" stroke-width="1.5" stroke-dasharray="4 4" />
<line x1="322" y1="42" x2="322" y2="240" stroke="#e90" stroke-width="1.5" stroke-dasharray="4 4" />
<line x1="100" y1="70" x2="318" y2="70" stroke="#444" stroke-width="2" marker-end="url(#sa)" />
<text x="210" y="64" text-anchor="middle" font-size="12" fill="#222">1 · CONNECT</text>
<line x1="322" y1="96" x2="104" y2="96" stroke="#2a7" stroke-width="2" marker-end="url(#sg)" />
<text x="210" y="90" text-anchor="middle" font-size="12" fill="#185">2 · CONNACK (ok)</text>
<text x="210" y="120" text-anchor="middle" font-size="10" fill="#999">— ต่อสำเร็จแล้วค่อย subscribe —</text>
<line x1="100" y1="148" x2="318" y2="148" stroke="#444" stroke-width="2" marker-end="url(#sa)" />
<text x="210" y="142" text-anchor="middle" font-size="12" fill="#222">3 · SUBSCRIBE (topic)</text>
<line x1="322" y1="174" x2="104" y2="174" stroke="#2a7" stroke-width="2" marker-end="url(#sg)" />
<text x="210" y="168" text-anchor="middle" font-size="12" fill="#185">4 · SUBACK (ok)</text>
<rect x="120" y="198" width="180" height="32" rx="8" fill="#eafaf0" stroke="#2a7" stroke-width="2" />
<text x="210" y="219" text-anchor="middle" font-size="12" font-weight="bold" fill="#185">พร้อม publish / รับข้อความ</text>
<defs>
<marker id="sa" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#444" /></marker>
<marker id="sg" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2a7" /></marker>
</defs>
</svg>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">import</span> mqtt

BROKER = <span class="hljs-string">&quot;test.mosquitto.org&quot;</span>            <span class="hljs-comment"># broker สาธารณะ ทดสอบได้เลย (placeholder)</span>
TOPIC  = <span class="hljs-string">&quot;tesaiot/class/leaderboard&quot;</span>    <span class="hljs-comment"># ทุกบอร์ดในห้องใช้ topic นี้ร่วมกัน</span>
PLAYER = <span class="hljs-string">&quot;board-01&quot;</span>                      <span class="hljs-comment"># ชื่อบอร์ดเรา แต่ละคนตั้งไม่ให้ซ้ำ</span>

<span class="hljs-comment"># พอร์ต MQTT ปกติคือ 1883 — คืน True เมื่อต่อสำเร็จ</span>
<span class="hljs-keyword">if</span> <span class="hljs-keyword">not</span> mqtt.connect(BROKER, <span class="hljs-number">1883</span>, client_id=PLAYER):
    <span class="hljs-built_in">print</span>(<span class="hljs-string">&quot;ต่อ broker ไม่ได้&quot;</span>)
    <span class="hljs-keyword">raise</span> SystemExit

mqtt.subscribe(TOPIC)                    <span class="hljs-comment"># สมัครรับ = &quot;ขอฟังห้องนี้ด้วย&quot;</span>
<span class="hljs-built_in">print</span>(<span class="hljs-string">&quot;ต่อ broker แล้ว&quot;</span>)
</code></pre>
<p><code>subscribe</code> คือการบอก broker ว่า &quot;เวลามีใครส่งเข้า topic นี้ ส่งมาให้ผมด้วย&quot;</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="10" style="--paginate:true;--theme:default;" data-marpit-pagination-total="24">
<h1 id="%E0%B8%81%E0%B9%89%E0%B8%B2%E0%B8%A7%E0%B8%97%E0%B8%B5%E0%B9%88-2-%E0%B8%95%E0%B9%88%E0%B8%AD--publish-%E0%B8%84%E0%B8%B0%E0%B9%81%E0%B8%99%E0%B8%99--%E0%B8%A3%E0%B8%B1%E0%B8%9A%E0%B8%84%E0%B8%B0%E0%B9%81%E0%B8%99%E0%B8%99%E0%B9%80%E0%B8%9E%E0%B8%B7%E0%B9%88%E0%B8%AD%E0%B8%99">ก้าวที่ 2 (ต่อ) — publish คะแนน + รับคะแนนเพื่อน</h1>
<p>ส่งคะแนนด้วย <code>publish</code>, รับคะแนนคนอื่นด้วย <code>get_message</code> ซึ่ง <strong>ไม่บล็อก</strong> (ไม่มีของก็คืน <code>None</code>)</p>
<p><img src="img/mqtt_poll_loop.png" alt="" style="width:560px;" /></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">import</span> time

my_score = <span class="hljs-number">1250</span>                              <span class="hljs-comment"># สมมุติเพิ่งเล่นจบได้เท่านี้</span>
payload = <span class="hljs-string">&quot;%s:%d&quot;</span> % (PLAYER, my_score)       <span class="hljs-comment"># รูปแบบง่าย ๆ &quot;ชื่อ:คะแนน&quot;</span>
mqtt.publish(TOPIC, payload)                 <span class="hljs-comment"># ส่งคะแนนขึ้นกระดาน</span>
<span class="hljs-built_in">print</span>(<span class="hljs-string">&quot;ส่งคะแนนแล้ว -&gt;&quot;</span>, payload)

deadline = time.time() + <span class="hljs-number">15</span>                  <span class="hljs-comment"># วนรับคะแนนเพื่อน 15 วินาที</span>
<span class="hljs-keyword">while</span> time.time() &lt; deadline:
    msg = mqtt.get_message()                 <span class="hljs-comment"># คืน (topic, payload) bytes หรือ None</span>
    <span class="hljs-keyword">if</span> msg <span class="hljs-keyword">is</span> <span class="hljs-keyword">not</span> <span class="hljs-literal">None</span>:
        topic, data = msg
        <span class="hljs-built_in">print</span>(<span class="hljs-string">&quot;ได้คะแนนใหม่:&quot;</span>, data.decode())  <span class="hljs-comment"># payload เป็น bytes ต้อง .decode()</span>
    time.sleep(<span class="hljs-number">0.2</span>)                          <span class="hljs-comment"># พักนิดให้ระบบหายใจ</span>

mqtt.disconnect()                            <span class="hljs-comment"># ปิดการเชื่อมต่อเมื่อจบ</span>
</code></pre>
<p><code>get_message()</code> คืน <code>None</code> เมื่อยังไม่มีของ — เกมจึงไม่ค้าง วนเช็กไปเรื่อย ๆ ได้</p>
<p><strong>สะพานทฤษฎี → โค้ด (3 จุดสำคัญ):</strong></p>
<ul>
<li><strong>รูปแบบข้อความ (application protocol)</strong> — เราออกแบบเองเป็น <code>&quot;ชื่อ:คะแนน&quot;</code> ด้วย <code>&quot;%s:%d&quot; % (PLAYER, my_score)</code> (<code>s13_net.py:48</code>) ฝั่งรับ <code>.decode()</code> แล้ว <code>split(&quot;:&quot;)</code> แยกกลับ (<code>:57–58</code>) → นี่คือ &quot;protocol เล็ก ๆ&quot; ที่ทั้งห้องตกลงกัน ถ้าอยากส่งหลายฟิลด์ให้เป็นระเบียบกว่านี้ ใช้ <code>json.dumps({&quot;name&quot;:PLAYER,&quot;score&quot;:my_score})</code> แล้วฝั่งรับ <code>json.loads(...)</code> ได้เลย</li>
<li><strong>QoS ของ <code>mqtt.publish</code></strong> (<code>s13_net.py:49</code>) — MQTT มี 3 ระดับความมั่นใจว่าข้อความถึงปลายทาง: <strong>QoS 0</strong> (&quot;ส่งแล้วแล้วกัน&quot; เร็วสุด — ค่าปริยายของ leaderboard นี้), <strong>QoS 1</strong> (&quot;อย่างน้อย 1 ครั้ง&quot; อาจซ้ำ), <strong>QoS 2</strong> (&quot;ครั้งเดียวเป๊ะ&quot; ช้าสุด) สำหรับคะแนนเกม QoS 0 พอ เพราะเดี๋ยวก็ส่งค่าใหม่ทับอยู่ดี</li>
<li><strong>เช็กผลก่อนไปต่อ</strong> — ทุก step คืน <code>True/False</code> ถ้า <code>not ok</code> ก็ <code>raise SystemExit</code> ทันที (WiFi <code>:31–33</code>, broker <code>:39–40</code>) ไม่ปล่อยให้พังเงียบ ๆ ตอนหลัง</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="11" style="--paginate:true;--theme:default;" data-marpit-pagination-total="24">

  <g font-size="14" text-anchor="middle">

<h1 id="leaderboard-%E0%B8%97%E0%B8%B3%E0%B8%87%E0%B8%B2%E0%B8%99%E0%B8%AD%E0%B8%A2%E0%B9%88%E0%B8%B2%E0%B8%87%E0%B9%84%E0%B8%A3-%E0%B8%A3%E0%B8%B9%E0%B8%9B%E0%B9%81%E0%B8%9A%E0%B8%9A%E0%B8%82%E0%B9%89%E0%B8%AD%E0%B8%84%E0%B8%A7%E0%B8%B2%E0%B8%A1">leaderboard ทำงานอย่างไร (รูปแบบข้อความ)</h1>
<p>เราตกลงกัน <strong>รูปแบบเดียวทั้งห้อง</strong> เพื่อให้ทุกบอร์ดอ่านของกันออก: <code>&quot;ชื่อ:คะแนน&quot;</code></p>
<svg viewBox="0 0 720 150" width="92%">
<rect x="30" y="40" width="240" height="60" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="2" />
<text x="150" y="76" text-anchor="middle" font-size="18" fill="#a5d6ff" font-family="monospace">"board-01:1250"</text>
<text x="150" y="120" text-anchor="middle" font-size="12" fill="#555">payload ที่เราส่ง (str)</text>
<text x="300" y="76" text-anchor="middle" font-size="22">→</text>
<rect x="340" y="20" width="160" height="35" rx="6" fill="#e8f0ff" stroke="#27a" />
<text x="420" y="43" text-anchor="middle" font-size="14" font-family="monospace">board-01 · 1250</text>
<rect x="340" y="62" width="160" height="35" rx="6" fill="#fde8f3" stroke="#c39" />
<text x="420" y="85" text-anchor="middle" font-size="14" font-family="monospace">board-02 · 980</text>
<rect x="340" y="104" width="160" height="35" rx="6" fill="#eafaf0" stroke="#2a7" />
<text x="420" y="127" text-anchor="middle" font-size="14" font-family="monospace">board-03 · 1410</text>
<text x="610" y="74" text-anchor="middle" font-size="13" fill="#555">กระดานรวม</text>
<text x="610" y="92" text-anchor="middle" font-size="13" fill="#555">ของทั้งห้อง</text>
</svg>
<p>ตอนรับมาเป็น <code>bytes</code> เราจึงต้อง <code>.decode()</code> ก่อนเสมอ แล้วค่อย <code>split(&quot;:&quot;)</code> ถ้าจะแยกชื่อกับคะแนน</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="14" style="--paginate:true;--theme:default;" data-marpit-pagination-total="24">
<h1 id="%E0%B9%82%E0%B8%84%E0%B9%89%E0%B8%94%E0%B8%82%E0%B8%AD%E0%B8%87%E0%B8%A7%E0%B8%B1%E0%B8%99%E0%B8%99%E0%B8%B5%E0%B9%89-practise-vs-solution">โค้ดของวันนี้: practise vs solution</h1>
<div style="display:flex;gap:16px;margin-top:8px">
<div style="flex:1;border:3px solid #2a7;border-radius:12px;padding:14px;background:#eafaf0">
<b><a class="pc-gh-link" href="https://github.com/Advance-Innovation-Centre-AIC/embedded-systems-for-developer/blob/main/developer-i/practise_codes/s13_net.py" target="_blank" rel="noopener" title="เปิดไฟล์บน GitHub (แท็บใหม่)" style="text-decoration:none"><code>practise_codes/s13_net.py</code><sup style="color:#22d3ee;font-weight:800">&#8599;</sup></a></b><br />
ฉบับ "เล่นตาม-เว้นช่อง" มี <b>4 จุดให้เติม</b>:<br />
(1) <code>wifi.connect</code> · (2) <code>wifi.ip()</code><br />
(3) <code>mqtt.connect</code> · (4) <code>mqtt.publish</code><br />
น้อง ๆ เติมเองในคาบ
</div>
<div style="flex:1;border:3px solid #27a;border-radius:12px;padding:14px;background:#e8f0ff">
<b>ฉบับเฉลย (เปิดในห้อง)</b><br />
ต่อ WiFi + MQTT + leaderboard ครบ<br />
ใช้เทียบหลังลองเองแล้ว<br />
<b>อย่าเพิ่งเปิดก่อนลอง</b>
</div>
</div>
<p><strong>วิธีรัน:</strong> เปิดไฟล์ใน BENTO IDE แล้วกดปุ่ม <strong>Program to Device</strong> (ปุ่มสีเขียวมุมซ้ายบน — ดูรูป) บอร์ดจะรันให้ทันที (ดูผลที่คอนโซลด้านล่าง)</p>
<p><img src="img/Bento_IDE_Program_to_Device.png" alt="" style="width:560px;" /></p>
<p><sub>ปุ่ม <b>Program to Device</b> อยู่บนแถบเครื่องมือ BENTO IDE (มุมซ้ายบน) · กดแล้ว IDE จะเซฟเป็น <code>main.py</code> แล้วสั่งบอร์ดรัน — ผลลัพธ์ขึ้นที่ Terminal ด้านล่าง</sub></p>
<blockquote>
<p>เกมเต็มที่ดึงคะแนนจริงมาต่อ leaderboard อยู่ใน <code>full_games/</code> ไว้ดูเป็นปลายทางได้</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="15" style="--paginate:true;--theme:default;" data-marpit-pagination-total="24">
<h1 id="%E0%B8%AA%E0%B9%88%E0%B8%87%E0%B8%84%E0%B8%B0%E0%B9%81%E0%B8%99%E0%B8%99%E0%B8%96%E0%B8%B5%E0%B9%88%E0%B9%81%E0%B8%84%E0%B9%88%E0%B9%84%E0%B8%AB%E0%B8%99%E0%B8%9E%E0%B8%AD%E0%B8%94%E0%B8%B5">ส่งคะแนนถี่แค่ไหนพอดี?</h1>
<p>leaderboard ไม่ใช่วิดีโอสด เราอยากเห็นคะแนน <strong>ล่าสุด</strong> ไม่ใช่คะแนนทุกเสี้ยววินาที — ดังนั้นอย่า <code>publish</code> ในทุกเฟรมของเกม</p>
<p><img src="img/mqtt_publish_rate.png" alt="" style="width:660px;" /></p>
<p>ถ้าเกมรันที่ <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>f</mi></mrow><annotation encoding="application/x-tex">f</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8889em;vertical-align:-0.1944em;"></span><span class="mord mathnormal" style="margin-right:0.1076em;">f</span></span></span></span> เฟรมต่อวินาที แล้ว <code>publish</code> ทุกเฟรม ภาระต่อ 1 นาทีคือ</p>
<p><span is="marp-span" data-auto-scaling="downscale-only" class="katex-display"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><msub><mi>N</mi><mtext>msg/min</mtext></msub><mo>=</mo><mi>f</mi><mo>×</mo><mn>60</mn><mo>=</mo><mn>60</mn><mo>×</mo><mn>60</mn><mo>=</mo><mn>3,600</mn><mtext> ข้อความ/นาที</mtext></mrow><annotation encoding="application/x-tex">N_{\text{msg/min}} = f \times 60 = 60 \times 60 = 3{,}600 \ \text{ข้อความ/นาที} 
</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1.0385em;vertical-align:-0.3552em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.109em;">N</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3448em;"><span style="top:-2.5198em;margin-left:-0.109em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord text mtight"><span class="mord mtight">msg/min</span></span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.3552em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.8889em;vertical-align:-0.1944em;"></span><span class="mord mathnormal" style="margin-right:0.1076em;">f</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">×</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">60</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.7278em;vertical-align:-0.0833em;"></span><span class="mord">60</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">×</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">60</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord">3</span><span class="mord"><span class="mpunct">,</span></span><span class="mord">600</span><span class="mspace"> </span><span class="mord text"><span class="mord brahmic_fallback">ข้อความ</span><span class="mord">/</span><span class="mord brahmic_fallback">นาที</span></span></span></span></span></span></p><p>เทียบกับส่ง <strong>เมื่อคะแนนเปลี่ยน</strong> ซึ่งในเกมจริงเกิดไม่กี่ครั้งต่อนาที ภาระต่างกันเป็นหลักร้อยเท่า:</p>
<p><span is="marp-span" data-auto-scaling="downscale-only" class="katex-display"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mfrac><msub><mi>N</mi><mtext>ทุกเฟรม</mtext></msub><msub><mi>N</mi><mtext>เมื่อเปลี่ยน</mtext></msub></mfrac><mo>≈</mo><mfrac><mn>3,600</mn><mn>5</mn></mfrac><mo>≈</mo><mn>700</mn><mo>×</mo></mrow><annotation encoding="application/x-tex">\frac{N_{\text{ทุกเฟรม}}}{N_{\text{เมื่อเปลี่ยน}}} \approx \frac{3{,}600}{5} \approx 700\times 
</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:2.1963em;vertical-align:-0.836em;"></span><span class="mord"><span class="mopen nulldelimiter"></span><span class="mfrac"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:1.3603em;"><span style="top:-2.314em;"><span class="pstrut" style="height:3em;"></span><span class="mord"><span class="mord"><span class="mord mathnormal" style="margin-right:0.109em;">N</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3283em;"><span style="top:-2.55em;margin-left:-0.109em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord text mtight"><span class="mord brahmic_fallback mtight">เมื่อเปลี่ยน</span></span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span></span></span><span style="top:-3.23em;"><span class="pstrut" style="height:3em;"></span><span class="frac-line" style="border-bottom-width:0.04em;"></span></span><span style="top:-3.677em;"><span class="pstrut" style="height:3em;"></span><span class="mord"><span class="mord"><span class="mord mathnormal" style="margin-right:0.109em;">N</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3283em;"><span style="top:-2.55em;margin-left:-0.109em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord text mtight"><span class="mord brahmic_fallback mtight">ทุกเฟรม</span></span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.836em;"><span></span></span></span></span></span><span class="mclose nulldelimiter"></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">≈</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:2.0074em;vertical-align:-0.686em;"></span><span class="mord"><span class="mopen nulldelimiter"></span><span class="mfrac"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:1.3214em;"><span style="top:-2.314em;"><span class="pstrut" style="height:3em;"></span><span class="mord"><span class="mord">5</span></span></span><span style="top:-3.23em;"><span class="pstrut" style="height:3em;"></span><span class="frac-line" style="border-bottom-width:0.04em;"></span></span><span style="top:-3.677em;"><span class="pstrut" style="height:3em;"></span><span class="mord"><span class="mord">3</span><span class="mord"><span class="mpunct">,</span></span><span class="mord">600</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.686em;"><span></span></span></span></span></span><span class="mclose nulldelimiter"></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">≈</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.7278em;vertical-align:-0.0833em;"></span><span class="mord">700</span><span class="mord">×</span></span></span></span></span></p><blockquote>
<p>เก็บคะแนนล่าสุดที่ส่งไปไว้ในตัวแปร แล้ว <code>publish</code> ก็ต่อเมื่อ <code>score != last_sent</code> เท่านั้น — ลดภาระ broker, ลดเน็ตหน่วง, และคะแนนบนกระดานก็ยังสด นี่คือเทคนิคเดียวกับที่ใช้คุมอัตราส่งของเซ็นเซอร์จริงในงาน IoT</p>
</blockquote>
<blockquote>
<p><strong>หมายเหตุ:</strong> ไฟล์เดโม <code>s13_net.py</code> ส่งคะแนน<strong>ค่าคงที่ครั้งเดียว</strong> (<code>my_score = 1250</code> แล้ว <code>publish</code> ที่ <code>:47–50</code>) เพื่อให้ทดสอบง่าย — การ์ด <code>score != last_sent</code> ด้านบนคือแพตเทิร์นที่ควรใส่<strong>เมื่อนำไปต่อในลูปเกมจริง</strong> ที่คะแนนเปลี่ยนได้</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="16" style="--paginate:true;--theme:default;" data-marpit-pagination-total="24">
<h1 id="%E0%B8%81%E0%B8%B1%E0%B8%9A%E0%B8%94%E0%B8%B1%E0%B8%81%E0%B8%97%E0%B8%B5%E0%B9%88%E0%B9%80%E0%B8%88%E0%B8%AD%E0%B8%9A%E0%B9%88%E0%B8%AD%E0%B8%A2">กับดักที่เจอบ่อย</h1>
<table>
<thead>
<tr>
<th>อาการ</th>
<th>สาเหตุ</th>
<th>วิธีแก้</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>wifi.connect</code> คืน False</td>
<td>SSID/รหัสผิด หรือเป็น 5GHz</td>
<td>ใช้ network 2.4GHz + เช็กรหัสอีกครั้ง</td>
</tr>
<tr>
<td><code>wifi.ip()</code> ได้ค่าแปลก ๆ</td>
<td>เรียกก่อนต่อสำเร็จ</td>
<td>เช็ก <code>is_connected()</code> ให้ True ก่อน</td>
</tr>
<tr>
<td><code>mqtt.connect</code> ติดบ้างไม่ติดบ้าง</td>
<td><code>client_id</code> ซ้ำกับเพื่อน</td>
<td>ตั้ง <code>PLAYER</code> ให้ไม่ซ้ำทั้งห้อง</td>
</tr>
<tr>
<td><code>get_message()</code> คืน None ตลอด</td>
<td>topic ไม่ตรงกัน</td>
<td><code>TOPIC</code> ต้องเป๊ะ ตัวเดียวกันทุกบอร์ด</td>
</tr>
<tr>
<td><code>data</code> แสดงเป็น <code>b'...'</code></td>
<td>ลืม <code>.decode()</code></td>
<td>payload เป็น bytes ต้อง decode ก่อน</td>
</tr>
<tr>
<td>ส่งคะแนนทุกเฟรม เน็ตหน่วง</td>
<td>publish ถี่เกิน</td>
<td>ส่งเมื่อคะแนน &quot;เปลี่ยน&quot; พอ ไม่ใช่ทุกเฟรม</td>
</tr>
</tbody>
</table>
</section>

<h1 id="%E0%B9%80%E0%B8%8A%E0%B9%87%E0%B8%81%E0%B8%9C%E0%B9%88%E0%B8%B2%E0%B8%99--%E0%B8%97%E0%B8%B3%E0%B9%80%E0%B8%AD%E0%B8%87-30">เช็กผ่าน + ทำเอง 30%</h1>
<p><strong>เกณฑ์ผ่านคาบ 13:</strong></p>
<ol>
<li><strong>ต่อเน็ตได้จริง</strong> — รันแล้ว <code>wifi.is_connected()</code> เป็น True และเห็น IP ของบอร์ดเรา</li>
<li><strong>ส่งคะแนนขึ้นกระดานได้</strong> — <code>mqtt.publish</code> คะแนนขึ้น topic ของห้อง</li>
<li><strong>รับคะแนนเพื่อนมาแสดงได้</strong> — เห็นคะแนนของบอร์ดอื่นวิ่งเข้าคอนโซล (decode ถูก)</li>
<li><strong>อธิบายได้</strong> — ทุกคนเล่าได้ว่า topic คืออะไร และทำไมต้องต่อ WiFi ก่อน MQTT</li>
</ol>
<p><strong>ส่วนทำเอง 30% (ต่อยอดเลือก 1 อย่าง):</strong></p>
<ul>
<li>เก็บคะแนนที่รับมาใส่ <code>dict</code> แล้ว print เป็นกระดานเรียงจากมากไปน้อย</li>
<li>ส่ง state มากกว่าคะแนน เช่น <code>&quot;ชื่อ:คะแนน:ด่าน&quot;</code> แล้วแยกด้วย <code>split(&quot;:&quot;)</code></li>
<li>ลองสองบอร์ดส่งคะแนนหากันจริง โดยตั้ง <code>PLAYER</code> คนละชื่อแต่ <code>TOPIC</code> เดียวกัน</li>
</ul>
<blockquote>
<p>คาบหน้า (คาบ 14) เราจะรวมทุกอย่างที่ฝึกมาทั้งคอร์สเป็นโปรเจกต์ปิดท้ายของตัวเอง เน็ตที่ทำวันนี้จะเป็นของพิเศษชิ้นสำคัญที่ทำให้งานเราโดดเด่น</p>
</blockquote>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="17" style="" data-marpit-pagination-total="24" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="18" style="--paginate:true;--theme:default;" data-marpit-pagination-total="24">
<h1 id="%E0%B9%80%E0%B8%89%E0%B8%A5%E0%B8%A2-s13_netpy--%E0%B8%AD%E0%B9%88%E0%B8%B2%E0%B8%99%E0%B9%83%E0%B8%AB%E0%B9%89%E0%B9%80%E0%B8%82%E0%B9%89%E0%B8%B2%E0%B9%83%E0%B8%88-%E0%B9%81%E0%B8%A5%E0%B9%89%E0%B8%A7%E0%B8%9B%E0%B8%B4%E0%B8%94%E0%B9%84%E0%B8%9F%E0%B8%A5%E0%B9%8C%E0%B8%9E%E0%B8%B4%E0%B8%A1%E0%B8%9E%E0%B9%8C%E0%B9%80%E0%B8%AD%E0%B8%87">เฉลย <code>s13_net.py</code> — อ่านให้เข้าใจ แล้วปิดไฟล์พิมพ์เอง</h1>
<p>เฉลยนี้ไม่ได้มีไว้ลอกวางส่ง คะแนนคาบนี้อยู่ที่ใบงานกับการอธิบายด้วยคำพูดของน้องเอง วิธีใช้ให้ได้ผลจริงคือ <strong>อ่านให้เข้าใจ ปิดไฟล์ แล้วพิมพ์ใหม่ด้วยมือ</strong> ตอนพิมพ์เองนี่แหละสมองจะจำ pattern การต่อเน็ตได้ ต่อไปเราจะแกะเฉลยทีละส่วน ไม่ใช่ดูรวดเดียว เพราะทุกบรรทัดมีเหตุผลของมัน</p>
<p><strong>ส่วนแรก — ตั้งค่าให้ครบก่อนลงมือ:</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">import</span> wifi
<span class="hljs-keyword">import</span> mqtt
<span class="hljs-keyword">import</span> time

<span class="hljs-comment"># --- ตั้งค่า: แก้ 4 บรรทัดนี้ให้ตรงกับของจริงก่อนรัน ---</span>
SSID    = <span class="hljs-string">&quot;YOUR_WIFI_SSID&quot;</span>          <span class="hljs-comment"># ชื่อ WiFi (2.4GHz) ของห้องเรา</span>
PASSWORD = <span class="hljs-string">&quot;YOUR_WIFI_PASSWORD&quot;</span>     <span class="hljs-comment"># รหัส WiFi</span>
BROKER  = <span class="hljs-string">&quot;test.mosquitto.org&quot;</span>       <span class="hljs-comment"># MQTT broker สาธารณะ (ทดสอบได้เลย)</span>
TOPIC   = <span class="hljs-string">&quot;tesaiot/class/leaderboard&quot;</span>   <span class="hljs-comment"># ห้องเดียวกันทั้งคาบ ทุกคนใช้ topic นี้</span>

PLAYER  = <span class="hljs-string">&quot;board-01&quot;</span>                <span class="hljs-comment"># ชื่อผู้เล่น/บอร์ดของเรา (แต่ละคนตั้งไม่ซ้ำ)</span>
</code></pre>
<ul>
<li>ทำไมกองค่าที่ต้องแก้ไว้ <strong>บนสุดที่เดียว</strong> (<code>:15-20</code>) แทนที่จะโปรยตามโค้ด? เพราะเปิดไฟล์มาแก้ SSID/PASSWORD/TOPIC/PLAYER ให้จบในหน้าจอเดียว ไม่ต้องไล่หาทีละจุด — ตรงกับสไลด์ practise ที่บอกว่ามี 4 จุดต้องเติม ถ้าฝังค่าลึกในโค้ด เพื่อนที่หยิบไฟล์ไปรันต่อจะแก้ผิดจุดทันที</li>
<li><code>TOPIC</code> (<code>:18</code>) คือ &quot;ห้อง&quot; จากสไลด์ node/broker — ทั้งห้องต้องพิมพ์เป๊ะตัวเดียวกัน พิมพ์ต่างแม้แต่ตัวเดียว จะเข้าคนละห้อง ตรงกับกับดัก &quot;topic ไม่ตรง get_message คืน None ตลอด&quot;</li>
<li><code>PLAYER</code> (<code>:20</code>) ต้องไม่ซ้ำทั้งห้อง เพราะมันไปเป็น <code>client_id</code> ของ broker — จำกับดัก &quot;client_id ซ้ำ ต่อบ้างไม่ติดบ้าง&quot; ได้ไหม สองบอร์ดใช้ชื่อเดียว broker จะเตะตัวเก่าออก</li>
<li><code>import wifi / mqtt / time</code> (<code>:10-12</code>) สามโมดูลพอดีกับงานวันนี้: <code>wifi</code> ต่อเน็ต, <code>mqtt</code> คุย broker, <code>time</code> คุมจังหวะทั้ง retry และ poll</li>
</ul>
<blockquote>
<p>ค่าที่ต้องแก้ก่อนรัน ให้อยู่ที่เดียว มองเห็นหมดในตาเดียว นี่เป็นนิสัยเล็ก ๆ ที่ช่วยทั้งตัวเราและคนที่หยิบโค้ดไปใช้ต่อ</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="19" style="--paginate:true;--theme:default;" data-marpit-pagination-total="24">
<h1 id="%E0%B9%80%E0%B8%89%E0%B8%A5%E0%B8%A2--%E0%B8%AA%E0%B9%88%E0%B8%A7%E0%B8%99%E0%B8%97%E0%B8%B5%E0%B9%88%E0%B8%AA%E0%B8%AD%E0%B8%87--%E0%B8%95%E0%B9%88%E0%B8%AD-wifi-%E0%B9%81%E0%B8%9A%E0%B8%9A%E0%B8%A7%E0%B8%99%E0%B8%A5%E0%B8%AD%E0%B8%87%E0%B9%83%E0%B8%AB%E0%B8%A1%E0%B9%88">เฉลย · ส่วนที่สอง — ต่อ WiFi แบบวนลองใหม่</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-comment"># --- 1) ต่อ WiFi ---</span>
<span class="hljs-built_in">print</span>(<span class="hljs-string">&quot;กำลังต่อ WiFi ...&quot;</span>)
ok = <span class="hljs-literal">False</span>
<span class="hljs-keyword">for</span> i <span class="hljs-keyword">in</span> <span class="hljs-built_in">range</span>(<span class="hljs-number">6</span>):                       <span class="hljs-comment"># ลองสูงสุด 6 ครั้ง (ครั้งแรกมักยังไม่ติด)</span>
    <span class="hljs-keyword">if</span> wifi.connect(SSID, PASSWORD):     <span class="hljs-comment"># คืน True เมื่อต่อสำเร็จ</span>
        ok = <span class="hljs-literal">True</span>
        <span class="hljs-keyword">break</span>
    <span class="hljs-built_in">print</span>(<span class="hljs-string">&quot;  ยังไม่ติด ลองใหม่ %d/6 ...&quot;</span> % (i + <span class="hljs-number">1</span>))
    time.sleep(<span class="hljs-number">2</span>)                        <span class="hljs-comment"># พัก 2 วิ ให้ WCM ตั้งตัว</span>
<span class="hljs-keyword">if</span> <span class="hljs-keyword">not</span> ok:
    <span class="hljs-built_in">print</span>(<span class="hljs-string">&quot;ต่อ WiFi ไม่ได้ ลองเช็ค SSID/รหัสอีกที&quot;</span>)
    <span class="hljs-keyword">raise</span> SystemExit
<span class="hljs-built_in">print</span>(<span class="hljs-string">&quot;ต่อ WiFi แล้ว IP =&quot;</span>, wifi.ip())   <span class="hljs-comment"># โชว์ IP ที่ได้มา</span>
</code></pre>
<ul>
<li>ทำไมต้อง <strong>วนลอง 6 ครั้ง</strong> ไม่ยิง <code>wifi.connect</code> ครั้งเดียว? เพราะการจับ AP แล้วขอ IP ใช้เวลาไม่แน่นอน ครั้งแรกมักยังไม่ติด นี่คือ retry loop มาตรฐานที่เราคุยกันในสไลด์ ก้าวที่ 1 — ยิงครั้งเดียวแล้วเชื่อว่าติดเลยคือสาเหตุที่โค้ดเน็ตล้มบ่อยที่สุด (<code>:25-30</code>)</li>
<li><code>ok = False</code> แล้วตั้งเป็น <code>True</code> ตอนสำเร็จ (<code>:24,27</code>) คือธง (flag) ที่บอกว่า &quot;ออกจากลูปเพราะติดจริง หรือเพราะลองครบ 6 ครั้งแล้ว&quot; ถ้าไม่มีธงนี้ เราแยกสองกรณีนี้ไม่ออก</li>
<li><code>if not ok: raise SystemExit</code> (<code>:31-33</code>) คือด่านกั้น — ต่อเน็ตไม่ติดก็อย่าไปต่อ MQTT ให้เสียเวลา ตรงกับหลัก &quot;เช็กผลก่อนไปต่อ&quot; จากสไลด์วงจรชีวิตการเชื่อมต่อ (&quot;ถ้า step ก่อนไม่สำเร็จ step ถัดไปจะพังเงียบ ๆ&quot;)</li>
<li><code>wifi.ip()</code> เรียก <strong>หลัง</strong> ต่อสำเร็จเท่านั้น (<code>:34</code>) — จำกับดัก &quot;เรียก ip() ก่อนต่อสำเร็จ ได้ค่าแปลก ๆ&quot; ได้ไหม ที่นี่เราปลอดภัยเพราะผ่านด่าน <code>not ok</code> มาแล้ว</li>
</ul>
<blockquote>
<p>การต่อเน็ตที่ดีคือการ &quot;ลองใหม่อย่างมีขอบเขต&quot; ไม่ใช่ลองรอบเดียวแล้วยอมแพ้ และไม่ใช่วนไม่รู้จบ — 6 ครั้งพร้อมหน่วง 2 วิ คือจุดพอดีที่ตั้งใจเลือกไว้</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="20" style="--paginate:true;--theme:default;" data-marpit-pagination-total="24">
<h1 id="%E0%B9%80%E0%B8%89%E0%B8%A5%E0%B8%A2--%E0%B8%AA%E0%B9%88%E0%B8%A7%E0%B8%99%E0%B8%97%E0%B8%B5%E0%B9%88%E0%B8%AA%E0%B8%B2%E0%B8%A1--%E0%B8%95%E0%B9%88%E0%B8%AD-broker-%E0%B9%81%E0%B8%A5%E0%B9%89%E0%B8%A7%E0%B8%AA%E0%B9%88%E0%B8%87%E0%B8%84%E0%B8%B0%E0%B9%81%E0%B8%99%E0%B8%99">เฉลย · ส่วนที่สาม — ต่อ broker แล้วส่งคะแนน</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-comment"># --- 2) ต่อ MQTT broker ---</span>
<span class="hljs-built_in">print</span>(<span class="hljs-string">&quot;กำลังต่อ MQTT broker ...&quot;</span>)
<span class="hljs-keyword">if</span> <span class="hljs-keyword">not</span> mqtt.connect(BROKER, <span class="hljs-number">1883</span>, client_id=PLAYER):   <span class="hljs-comment"># พอร์ต MQTT ปกติคือ 1883</span>
    <span class="hljs-built_in">print</span>(<span class="hljs-string">&quot;ต่อ broker ไม่ได้&quot;</span>)
    <span class="hljs-keyword">raise</span> SystemExit
<span class="hljs-built_in">print</span>(<span class="hljs-string">&quot;ต่อ broker แล้ว&quot;</span>)

<span class="hljs-comment"># สมัครรับข้อความใน topic เดียวกัน เพื่อเห็นคะแนนของทุกบอร์ด</span>
mqtt.subscribe(TOPIC)

<span class="hljs-comment"># --- 3) ส่งคะแนนของเราขึ้นกระดาน ---</span>
my_score = <span class="hljs-number">1250</span>                              <span class="hljs-comment"># สมมุติว่าเพิ่งเล่นจบได้เท่านี้</span>
payload = <span class="hljs-string">&quot;%s:%d&quot;</span> % (PLAYER, my_score)       <span class="hljs-comment"># รูปแบบง่าย ๆ &quot;ชื่อ:คะแนน&quot;</span>
mqtt.publish(TOPIC, payload)
<span class="hljs-built_in">print</span>(<span class="hljs-string">&quot;ส่งคะแนนแล้ว -&gt;&quot;</span>, payload)
</code></pre>
<ul>
<li><code>mqtt.connect</code> มา <strong>หลัง</strong> WiFi เสมอ (<code>:38</code>) — ลำดับนี้ห้ามสลับ MQTT วิ่งบนเน็ตอีกชั้น เหมือนที่เราวาดในสไลด์วงจรชีวิต (<code>wifi.connect → mqtt.connect → subscribe</code>) ต่อ broker ก่อนได้ IP คือต่อไม่ติดแน่นอน</li>
<li><code>client_id=PLAYER</code> เป็น <strong>keyword argument</strong> (<code>:38</code>) ที่ผูกชื่อบอร์ดเข้ากับ session ของ broker นี่คือเหตุผลที่ <code>PLAYER</code> ต้องไม่ซ้ำ — โยงกลับไปกับดัก client_id ซ้ำโดยตรง</li>
<li>ทำไม <code>subscribe</code> มา <strong>ก่อน</strong> <code>publish</code> (<code>:44</code> ก่อน <code>:49</code>)? เพราะเราอยากได้ยินของทุกคน <strong>รวมทั้งของตัวเอง</strong> — จำสไลด์ &quot;publish หนึ่งครั้ง วิ่งถึงทุกคน&quot; ที่บอกว่า broker ส่งกลับให้ A เองด้วยไหม ถ้า subscribe ทีหลัง อาจพลาดข้อความที่ส่งมาช่วงต้น</li>
<li><code>payload = &quot;%s:%d&quot; % (PLAYER, my_score)</code> (<code>:48</code>) คือ <strong>application protocol</strong> เล็ก ๆ ที่ทั้งห้องตกลงกัน รูปแบบ &quot;ชื่อ:คะแนน&quot; จากสไลด์ leaderboard — ฝั่งส่งประกอบ string ฝั่งรับ <code>split(&quot;:&quot;)</code> แยกกลับ ตกลงรูปแบบให้ตรงกันคือหัวใจของการคุยข้ามเครื่อง</li>
</ul>
<blockquote>
<p><code>subscribe</code> ก่อน <code>publish</code> ไม่ใช่เรื่องบังเอิญ เราตั้งใจ &quot;เข้าห้องไปนั่งฟัง&quot; ให้เรียบร้อยก่อนค่อยพูด จะได้ไม่พลาดเสียงใคร รวมถึงเสียงของเราเอง</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="21" style="--paginate:true;--theme:default;" data-marpit-pagination-total="24">
<h1 id="%E0%B9%80%E0%B8%89%E0%B8%A5%E0%B8%A2--%E0%B8%AA%E0%B9%88%E0%B8%A7%E0%B8%99%E0%B8%97%E0%B8%B5%E0%B9%88%E0%B8%AA%E0%B8%B5%E0%B9%88--%E0%B8%A7%E0%B8%99%E0%B8%A3%E0%B8%B1%E0%B8%9A-%E0%B9%81%E0%B8%A5%E0%B9%89%E0%B8%A7%E0%B9%80%E0%B8%81%E0%B9%87%E0%B8%9A%E0%B8%81%E0%B8%A7%E0%B8%B2%E0%B8%94%E0%B9%83%E0%B8%AB%E0%B9%89%E0%B9%80%E0%B8%A3%E0%B8%B5%E0%B8%A2%E0%B8%9A%E0%B8%A3%E0%B9%89%E0%B8%AD%E0%B8%A2">เฉลย · ส่วนที่สี่ — วนรับ แล้วเก็บกวาดให้เรียบร้อย</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-comment"># --- 4) วนรับคะแนนของเพื่อน 15 วินาที ---</span>
deadline = time.time() + <span class="hljs-number">15</span>
<span class="hljs-keyword">while</span> time.time() &lt; deadline:
    msg = mqtt.get_message()                 <span class="hljs-comment"># คืน (topic, payload) เป็น bytes หรือ None</span>
    <span class="hljs-keyword">if</span> msg <span class="hljs-keyword">is</span> <span class="hljs-keyword">not</span> <span class="hljs-literal">None</span>:
        topic, data = msg
        <span class="hljs-built_in">print</span>(<span class="hljs-string">&quot;ได้คะแนนใหม่:&quot;</span>, data.decode())  <span class="hljs-comment"># payload เป็น bytes ต้อง .decode()</span>
    time.sleep(<span class="hljs-number">0.2</span>)                          <span class="hljs-comment"># พักนิดให้ระบบหายใจ</span>

mqtt.disconnect()
<span class="hljs-built_in">print</span>(<span class="hljs-string">&quot;จบคาบ ปิดการเชื่อมต่อเรียบร้อย&quot;</span>)
</code></pre>
<ul>
<li><code>get_message()</code> เป็นแบบ <strong>ไม่บล็อก</strong> — ไม่มีของก็คืน <code>None</code> (<code>:55-56</code>) เราจึงวน <code>while</code> เช็กเรื่อย ๆ ได้โดยโปรแกรมไม่ค้าง นี่คือ non-blocking polling ที่เราย้ำในสไลด์ ก้าวที่ 2 และเป็นเหตุผลที่เกมจริงเอาโครงนี้ไปแทรกในลูปได้โดยเกมไม่กระตุก</li>
<li><code>topic, data = msg</code> แกะ tuple ออกเป็นสองตัว แล้ว <code>data.decode()</code> (<code>:57-58</code>) เพราะ payload ที่วิ่งมาบนเน็ตเป็น <code>bytes</code> เสมอ ต้องแปลงเป็น <code>str</code> ก่อนอ่าน — จำกับดัก &quot;แสดงเป็น <code>b'...'</code> เพราะลืม decode&quot; ได้ไหม บรรทัดนี้แหละที่กัน</li>
<li><code>deadline = time.time() + 15</code> แล้ว <code>while time.time() &lt; deadline</code> (<code>:53-54</code>) คือการ <strong>จำกัดเวลาแทนวนไม่รู้จบ</strong> — เดโมนี้ตั้งใจให้จบเองใน 15 วิ จะได้ทดสอบง่าย ในเกมจริงเราจะเปลี่ยน deadline เป็นเงื่อนไข &quot;ยังเล่นอยู่&quot; แทน</li>
<li><code>mqtt.disconnect()</code> (<code>:61</code>) คือการเก็บกวาด คืนการเชื่อมต่อให้ broker อย่างเรียบร้อย ไม่ทิ้ง session ค้าง — นิสัยเดียวกับที่งาน embedded ต้องปิดของที่เปิดไว้เสมอ ออกจากงานให้เครื่องอยู่ในสถานะที่รู้แน่</li>
</ul>
<p><strong>ห้าส่วนนี้ไต่ระดับกันยังไง:</strong></p>

<thead>
<tr>
<th>ส่วน</th>
<th>บรรทัด</th>
<th>แนวคิดใหม่ที่เพิ่มเข้ามา</th>
<th>ของเดิมที่เอากลับมาใช้</th>
</tr>
</thead>
<tbody>
<tr>
<td>ตั้งค่า</td>
<td><code>:15-20</code></td>
<td>รวมค่าที่ต้องแก้ไว้ที่เดียว (config block)</td>
<td>ตัวแปร + constant</td>
</tr>
<tr>
<td>ต่อ WiFi</td>
<td><code>:25-34</code></td>
<td>retry loop + ธง <code>ok</code> + ด่าน <code>raise SystemExit</code></td>
<td><code>for</code> ลูป + เช็ก True/False</td>
</tr>
<tr>
<td>ต่อ broker</td>
<td><code>:38-44</code></td>
<td>ลำดับ wifi→mqtt, <code>client_id</code>, subscribe ก่อน publish</td>
<td>ด่านกั้นเดิมของ WiFi</td>
</tr>
<tr>
<td>ส่งคะแนน</td>
<td><code>:48-49</code></td>
<td>application protocol <code>&quot;%s:%d&quot;</code> (ชื่อ:คะแนน)</td>
<td>string format</td>
</tr>
<tr>
<td>วนรับ</td>
<td><code>:53-61</code></td>
<td>non-blocking poll + <code>.decode()</code> + จำกัดเวลา + disconnect</td>
<td><code>while</code> ลูป + guard เดิม</td>
</tr>
</tbody>
</table>
<blockquote>
<p>ทั้งไฟล์คือด่านกั้นเดิมซ้ำ ๆ แค่เปลี่ยนของที่กั้น: ต่อเน็ตติดไหม, ต่อ broker ติดไหม, มีข้อความไหม เห็นจังหวะไต่ระดับนี้แล้ว น้องจะเขียนโค้ดเน็ตของตัวเองได้โดยไม่ต้องท่อง</p>
</blockquote>
</section>

<h1 id="%E0%B9%80%E0%B8%8A%E0%B8%B7%E0%B9%88%E0%B8%AD%E0%B8%A1%E0%B8%88%E0%B8%B8%E0%B8%94--%E0%B9%80%E0%B8%99%E0%B9%87%E0%B8%95%E0%B8%A7%E0%B8%B1%E0%B8%99%E0%B8%99%E0%B8%B5%E0%B9%89%E0%B8%A1%E0%B8%B2%E0%B8%88%E0%B8%B2%E0%B8%81%E0%B9%84%E0%B8%AB%E0%B8%99-%E0%B9%81%E0%B8%A5%E0%B9%89%E0%B8%A7%E0%B8%88%E0%B8%B0%E0%B8%9E%E0%B8%B2%E0%B9%80%E0%B8%A3%E0%B8%B2%E0%B9%84%E0%B8%9B%E0%B8%96%E0%B8%B6%E0%B8%87%E0%B9%84%E0%B8%AB%E0%B8%99">เชื่อมจุด — เน็ตวันนี้มาจากไหน แล้วจะพาเราไปถึงไหน</h1>
<p>หยุดคิดสักครู่ก่อนปิดคาบ ไม่ใช่เรื่องไวยากรณ์ แต่เรื่องมองให้ทะลุว่า &quot;ส่งคะแนนขึ้นกระดาน&quot; ที่เราเพิ่งทำ จริง ๆ มันคือชิ้นส่วนของอะไร</p>
<p><strong>ที่มา — เน็ตวันนี้ยืนอยู่บนอะไร</strong> ย้อนไปสไลด์ &quot;publish / subscribe — ส่งครั้งเดียว ถึงทุกบอร์ด&quot; เราคุยเรื่อง <strong>decouple</strong>: คนส่งกับคนรับไม่ต้องรู้จักกัน broker เป็นตัวกลาง และ <code>get_message()</code> ที่คืน <code>None</code> เมื่อไม่มีของ ก็คือแนวคิดเดียวกับ non-blocking ที่เราใช้วนเช็กปุ่มในเกมมาตั้งแต่คาบต้น ๆ — &quot;วนถามเรื่อย ๆ โดยไม่ค้าง&quot; ส่วนโครง <code>for i in range(6)</code> ที่วนต่อ WiFi ก็คือ <code>for</code> ลูปตัวเดิมที่เราใช้มาตั้งแต่คาบแรกสุด แค่เอามากั้นการต่อเน็ต</p>
<p><strong>ที่ไป — เน็ตวันนี้จะโตเป็นอะไร</strong> ในสไลด์เช็กผ่านท้ายคาบ อาจารย์บอกว่าคาบ 14 คือโปรเจกต์ปิดคอร์ส สังเกตไหมว่า pattern &quot;อ่านค่า → ประกอบ payload → publish → ฝั่งโน้น subscribe → decode → ใช้งาน&quot; ไม่ได้ผูกกับคำว่าคะแนนเลย เปลี่ยน <code>my_score</code> เป็นค่าเซ็นเซอร์ เปลี่ยนปลายทางเป็นแดชบอร์ดคลาวด์ ก็กลายเป็นระบบ IoT จริงทันที นี่คือโครงเดียวที่อุปกรณ์ IoT ทุกตัวในโลกใช้</p>
<p>ลองตอบคำถามพวกนี้ในใจ นี่แหละคือการเชื่อมจุดด้วยตัวเอง:</p>
<ul>
<li>จำ <code>get_message()</code> ที่คืน <code>None</code> เมื่อยังไม่มีของได้ไหม มันคือเรื่องเดียวกับตอนเราวนเช็กปุ่ม joystick ที่ &quot;ไม่มีก็ผ่านไป&quot; หรือเปล่า</li>
<li>ถ้าวันนี้เราส่ง <code>&quot;board-01:1250&quot;</code> ขึ้น topic ได้ พรุ่งนี้เราส่ง <code>&quot;sensor-3:27.5&quot;</code> (อุณหภูมิ) ขึ้นคลาวด์ ได้ไหม เปลี่ยนแค่ค่ากับปลายทาง โครงเดิมทั้งดุ้น</li>
<li>สังเกตไหมว่า &quot;subscribe topic เดียวกันแล้วได้ยินกันหมด&quot; คือเรื่องเดียวกับการเข้าห้องแชตห้องเดียวกัน — เปลี่ยนคำว่าคะแนนเป็นข้อความ ก็ได้แอปแชตย่อ ๆ</li>
</ul>

<p>ถ้าตอบสามคำถามข้างบนได้ว่า &quot;อ๋อ มันคือเรื่องเดียวกัน&quot; — นั่นคือการหยั่งรู้ที่อาจารย์อยากให้เกิด คะแนนบนกระดานวันนี้ไม่ได้เล็ก มันคือประตูบานแรกที่พาบอร์ดของเราออกสู่โลกทั้งใบ</p>

  <line x1="568" y1="185" x2="756" y2="158" stroke="#607d8b" stroke-width="1.6" marker-end="url(#s13uAr)" />
  <line x1="568" y1="185" x2="756" y2="185" stroke="#607d8b" stroke-width="1.6" marker-end="url(#s13uAr)" />
  <line x1="568" y1="185" x2="756" y2="212" stroke="#607d8b" stroke-width="1.6" marker-end="url(#s13uAr)" />
  <circle cx="774" cy="158" r="6" fill="#6a1b9a" /><rect x="766" y="164" width="16" height="11" rx="4" fill="#6a1b9a" />
  <circle cx="774" cy="185" r="6" fill="#6a1b9a" /><rect x="766" y="191" width="16" height="11" rx="4" fill="#6a1b9a" />
  <circle cx="774" cy="212" r="6" fill="#6a1b9a" /><rect x="766" y="218" width="16" height="11" rx="4" fill="#6a1b9a" />
  <text x="556" y="222" font-size="11" fill="#777" text-anchor="middle">ส่งครั้งเดียว → ทุกคนที่ subscribe เห็น</text>
</svg>
</div>
<ul>
<li><strong>บ้านอัจฉริยะ (Home Assistant / smart home)</strong> — สวิตช์ เซ็นเซอร์ หลอดไฟ ต่างก็ <code>publish</code> สถานะขึ้น topic ตัวเอง แล้วแอปกลาง <code>subscribe</code> เห็นครบ เพิ่มอุปกรณ์ใหม่ไม่ต้องแก้แอป — คือ <strong>decouple</strong> จากสไลด์ publish/subscribe เป๊ะ</li>
<li><strong>เซ็นเซอร์ในโรงงาน (IIoT telemetry)</strong> — อุณหภูมิ/ความสั่นนับร้อยจุด <code>publish</code> ขึ้น broker ตัวเดียว แดชบอร์ดตัวเดียว subscribe ก็มอนิเตอร์ได้หมด — คือ &quot;เซ็นเซอร์ 100 ตัว topic เดียว&quot; ที่พูดถึงในสไลด์ publish โดยตรง</li>
<li><strong>ติดตามยานพาหนะ/ขนส่ง (fleet tracking)</strong> — รถแต่ละคัน <code>publish</code> พิกัด GPS เป็นระยะ ส่ง <strong>เมื่อขยับพอควร</strong> ไม่ใช่ทุกเสี้ยววินาที — ตรงกับสไลด์ &quot;ส่งคะแนนถี่แค่ไหนพอดี&quot; ที่ให้ส่งเมื่อค่าเปลี่ยน</li>
<li><strong>แอปแชต/สถานะออนไลน์ (presence)</strong> — คนในห้องแชตเดียวกันคือ subscriber ของ topic เดียวกัน ส่งครั้งเดียวถึงทุกคน — โครงเดียวกับ topic = &quot;ห้อง&quot; ที่เป็นหัวใจของคาบนี้</li>
</ul>
<blockquote>
<p>ไม่มีข้อไหนเป็นของสมมติเลย ทุกข้อคือ pub/sub บน MQTT ที่เดินอยู่จริงในผลิตภัณฑ์ระดับโลก น้องเพิ่งเขียนโครงเดียวกับมันไปเมื่อกี้นี้เอง</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="24" style="--paginate:true;--theme:default;" data-marpit-pagination-total="24">
<h1 id="%E0%B8%95%E0%B9%88%E0%B8%AD%E0%B8%A2%E0%B8%AD%E0%B8%94--%E0%B8%84%E0%B8%B4%E0%B8%94%E0%B8%95%E0%B9%88%E0%B8%AD%E0%B9%80%E0%B8%AD%E0%B8%87">ต่อยอด — คิดต่อเอง</h1>
<p>ลองเอาโจทย์พวกนี้ไปคิดต่อ ไม่มีคำตอบเดียวตายตัว ทุกข้อโยงกลับไปหาโปรเจกต์จริงได้:</p>
<div style="text-align:center">
<svg width="840" height="228" viewBox="0 0 840 228" font-family="DejaVu Sans, sans-serif">
  <defs>
    <marker id="s13tDn" markerWidth="9" markerHeight="9" refX="4" refY="7" orient="auto"><path d="M0,0 L8,0 L4,7 Z" fill="#607d8b" /></marker>
  </defs>
  
  <text x="14" y="24" font-size="13" font-weight="700" fill="#607d8b">แบบเดิม — payload แบน "ชื่อ:คะแนน"</text>
  <rect x="120" y="36" width="160" height="34" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" />
  <text x="200" y="57" font-size="12" fill="#1565c0" text-anchor="middle" font-family="monospace">"board-01:1250"</text>
  <rect x="300" y="36" width="420" height="34" rx="6" fill="#fff3e0" stroke="#ef6c00" stroke-width="2" />
  <text x="510" y="57" font-size="11" fill="#ef6c00" text-anchor="middle">ชื่อซ้ำเพิ่มบรรทัด · ปลอมง่าย · มีแค่คะแนน</text>
  <text x="420" y="92" font-size="11" fill="#ef6c00" text-anchor="middle">พอมีหลายบอร์ด/คนป่วน → กระดานเชื่อไม่ได้</text>
  
  <line x1="420" y1="102" x2="420" y2="126" stroke="#607d8b" stroke-width="2" marker-end="url(#s13tDn)" />
  <text x="436" y="119" font-size="11" fill="#777">เปลี่ยนวิธีคิด</text>
  
  <text x="14" y="150" font-size="13" font-weight="700" fill="#2e7d32">ต่อยอด — เก็บใน dict + ตรวจสอบ + ส่ง state</text>
  <rect x="120" y="160" width="616" height="38" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" />
  <rect x="132" y="167" width="182" height="24" rx="5" fill="#ffffff" stroke="#2e7d32" />
  <text x="223" y="183" font-size="10" fill="#2e7d32" text-anchor="middle">dict คีย์=ชื่อ → กระดานสด</text>
  <rect x="326" y="167" width="182" height="24" rx="5" fill="#ffffff" stroke="#2e7d32" />
  <text x="417" y="183" font-size="10" fill="#2e7d32" text-anchor="middle">ตรวจ payload → กันปลอม</text>
  <rect x="520" y="167" width="204" height="24" rx="5" fill="#ffffff" stroke="#2e7d32" />
  <text x="622" y="183" font-size="10" fill="#2e7d32" text-anchor="middle">ส่ง state ทั้งเกม → ต่อคาบ 14</text>
  <text x="428" y="214" font-size="11" fill="#2e7d32" text-anchor="middle">ออกแบบให้เชื่อถือได้ + ต่อยอดได้ ก่อนขยายจริง</text>
</svg>
</div>
<ul>
<li><strong>กระดานเรียงอันดับสด</strong> — ถ้าเก็บคะแนนที่รับมาใส่ <code>dict</code> (คีย์ = ชื่อบอร์ด) แล้วอยากโชว์ Top 3 เรียงมากไปน้อย อัปเดตทุกครั้งที่มีคะแนนใหม่ จะออกแบบยังไงให้ชื่อซ้ำทับค่าเดิม ไม่ใช่เพิ่มบรรทัดใหม่เรื่อย ๆ</li>
<li><strong>กันคะแนนปลอม</strong> — ถ้ามีคนแอบ <code>publish</code> <code>&quot;board-99:999999&quot;</code> มาป่วนกระดาน เราจะออกแบบ payload ให้ตรวจสอบได้ยังไง (ใบ้: เพิ่มฟิลด์ลายเซ็นง่าย ๆ หรือช่วงคะแนนที่เป็นไปได้) — โจทย์เดียวกับที่วิศวกรจริงต้องคิดเรื่องความน่าเชื่อถือของข้อมูล</li>
<li><strong>เน็ตหลุดกลางเกมแล้วต่อกลับเอง</strong> — ตอนนี้ <code>raise SystemExit</code> เมื่อต่อไม่ติด แต่ถ้าเน็ตหลุดตอนเล่นอยู่ล่ะ จะเอา retry loop ของ WiFi (<code>:25-30</code>) มาห่อ <code>mqtt.get_message</code> ให้ต่อกลับเองโดยไม่รีสตาร์ตเกมยังไง</li>
<li><strong>จากคะแนนเป็นสถานะทั้งเกม (สะพานสู่คาบ 14)</strong> — ถ้าโปรเจกต์ปิดคอร์สอยากให้สองบอร์ดเห็นกันเรียลไทม์ (เช่นตำแหน่งตัวละคร ไม่ใช่แค่คะแนนตอนจบ) จะออกแบบ payload กับอัตรา <code>publish</code> ยังไงให้ลื่นแต่ไม่ถล่ม broker — คิดไว้ เพราะคาบหน้าจะได้หยิบมาใช้จริง</li>
</ul>
<blockquote>
<p>เลือกมาสักข้อ แล้วเขียนลงใบงานว่า &quot;ถ้าเป็นเรา จะออกแบบยังไง&quot; ไม่ต้องมีคำตอบถูก ขอแค่คิดต่อจากโค้ดที่พิมพ์เองวันนี้ — ตรงนั้นแหละที่น้องเริ่มเป็นวิศวกรระบบ ไม่ใช่แค่คนต่อเน็ตตามเฉลย</p>
</blockquote>
</section>
